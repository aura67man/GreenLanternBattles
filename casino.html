<script>
'use strict';
// =====================================================================

const W = 1280, H = 800;

// ---------------- state & persistence ----------------

// ---------------- chips ----------------

  rr(px - 10, y + 216, pw, def.pays.length * 36 + 16, 10); ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fill(); ctx.strokeStyle = 'rgba(232,193,74,.5)'; ctx.lineWidth = 1; ctx.stroke();
  def.pays.forEach((p, i) => { const ry = y + 242 + i * 36; T(p[0], px + 6, ry, 16, '#fff', 'left', 'normal'); T(p[1], px + pw - 26, ry, 16, '#ffe39a', 'right', 'bold'); if (i < def.pays.length - 1) { ctx.fillStyle = 'rgba(255,255,255,.1)'; ctx.fillRect(px, ry + 18, pw - 20, 1); } });
  T('Your chips: ' + fmt(S.chips), 640, y + h - 60, 18, '#ffe9a6', 'center', 'bold');
  if (overlay) button(530, y + h - 40 - 24, 220, 52, 'RESUME', () => { S.overlay = false; }, { color: '#2f9e55', text: '#fff', size: 20 });

function drawHUD() {

  ctx.save(); ctx.font = 'bold 28px ' + SERIF; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = goldGrad(12, 44); ctx.fillText(S.def.name.toUpperCase(), 640, 29); ctx.restore();
  drawChip(930, 28, 14, 100); T('CHIPS', 952, 28, 12, '#e8c14a', 'left', 'bold'); T(fmt(S.chips), 1110, 29, 24, '#fff', 'right', 'bold', SERIF);
  button(1124, 10, 90, 36, 'RULES', () => { S.overlay = true; }, { size: 15 });

function drawBust() {
  ctx.drawImage(CARPET, 0, 0); ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 18; i++) { const x = (i * 97 + 40) % W, y = ((S.time * (60 + i * 7) + i * 130) % (H + 100)) - 50; drawChip(x, y, 18, DENOMS[i % 6], .35); }
  ctx.save(); ctx.shadowColor = '#ff2a3a'; ctx.shadowBlur = 30 + Math.sin(S.time * 4) * 10; T('BUSTED', 640, 260, 120, '#ff5a6a', 'center', 'bold', SERIF); ctx.restore();

// =====================================================================
//  MAIN LOOP
// =====================================================================
let lastT = performance.now();
function update(dt) {
  S.time += dt;
  if (S.scene === 'game' && S.game && !S.overlay) { S.game.tick(dt); updParts(dt); }
  for (let i = S.popups.length - 1; i >= 0; i--) { const p = S.popups[i]; p.t += dt; p.y -= 34 * dt; if (p.t > 2) S.popups.splice(i, 1); }
  if (S.toast) { S.toast.t += dt; if (S.toast.t > 2.8) S.toast = null; }
  if (S.chips > S.best) S.best = S.chips;
  if (S.scene === 'game' && S.game && S.chips <= 0 && S.game.onTable() === 0 && !S.game.busy() && S.game.phase !== 'spin' && S.game.phase !== 'fly' && S.game.phase !== 'roll') {
    S.bustT += dt; if (S.bustT > 2.6) { S.scene = 'bust'; S.game = null; S.overlay = false; S.bustT = 0; Snd.lose(); save(); }
  } else if (S.scene === 'menu' && S.chips <= 0) { S.scene = 'bust'; }
  else S.bustT = 0;
  S.saveT += dt; if (S.saveT > 1) { S.saveT = 0; save(); }
}
function render() {
  ctx.setTransform(K, 0, 0, K, 0, 0); UI.items = []; ctx.textBaseline = 'middle';
  if (S.scene === 'menu') drawMenu();
  else if (S.scene === 'intro') drawIntro(S.def, false);
  else if (S.scene === 'game') { S.game.draw(); if (!(S.game instanceof Slots) && !(S.game instanceof Crash)) drawParts(); drawHUD(); if (S.overlay) drawIntro(S.def, true); }
  else if (S.scene === 'bust') drawBust();
  for (const p of S.popups) { ctx.globalAlpha = clamp(2 - p.t, 0, 1); ctx.save(); ctx.shadowColor = '#000'; ctx.shadowBlur = 6; T(p.text, p.x, p.y, 24, p.color, 'center', 'bold'); ctx.restore(); ctx.globalAlpha = 1; }
  if (S.toast) {
    const a = clamp((2.8 - S.toast.t) * 3, 0, 1); ctx.globalAlpha = a; ctx.font = 'bold 16px ' + SANS; const w = ctx.measureText(S.toast.text).width + 40;
    rr(640 - w / 2, 66, w, 38, 19); ctx.fillStyle = 'rgba(10,5,2,.92)'; ctx.fill(); ctx.strokeStyle = '#e8c14a'; ctx.lineWidth = 1.5; ctx.stroke(); T(S.toast.text, 640, 86, 16, '#ffe9a6'); ctx.globalAlpha = 1;
  }
  if (S.scene === 'game' && S.game && S.chips <= 0 && S.bustT > 0) T('Out of chips…', 640, 110, 22, '#ff8b8b', 'center', 'bold', SERIF);
  let hot = false; for (const it of UI.items) if (it.cb && over(it.x, it.y, it.w, it.h) && !(it.x === 0 && it.y === 0 && it.w === W)) { hot = true; break; }
  cv.style.cursor = hot ? 'pointer' : 'default';
}
function frame(now) {
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now;
  try { update(dt); render(); } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
addEventListener('beforeunload', save);
requestAnimationFrame(frame);
</script>
