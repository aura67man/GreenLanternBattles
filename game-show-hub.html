<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Game Show Hub</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;left:0;top:0;width:100vw;height:100vh;outline:none}
#tx{position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:0;border:0;padding:0;margin:0;font-size:16px;pointer-events:none;background:transparent;color:transparent}
</style>
</head>
<body>
<canvas id="c"></canvas>
<input id="tx" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
<script>
'use strict';
/* =====================================================================
   GAME SHOW HUB  —  single-file, vanilla JS, Canvas-rendered
   ===================================================================== */

/* ---------------------------- CORE ---------------------------------- */
const W = 1280, H = 720;
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), txEl = document.getElementById('tx');
let DPR = 1, SC = 1, OX = 0, OY = 0;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);

  cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
  SC = Math.min(w / W, h / H); OX = (w - W * SC) / 2; OY = (h - H * SC) / 2;
}
window.addEventListener('resize', resize); resize();

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const chance = p => Math.random() < p;
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const E = {
  out: t => 1 - Math.pow(1 - clamp(t, 0, 1), 3),
  inOut: t => { t = clamp(t, 0, 1); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; },
  back: t => { t = clamp(t, 0, 1); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  elastic: t => { t = clamp(t, 0, 1); if (t === 0 || t === 1) return t; return Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (2 * Math.PI) / 3) + 1; }
};
function money(n, dec) {
  const d = dec || 0;
  return (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
}
function deferred() { let r; const p = new Promise(x => r = x); p.resolve = r; return p; }
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem('gsh_' + k)); localStorage.setItem('gsh_' + k, JSON.stringify(v)); } catch (e) { return null; } }

/* ---------------------------- FONTS --------------------------------- */
const F = {
  sans: '"Helvetica Neue", Helvetica, Arial, sans-serif',
  impact: 'Impact, Haettenschweiler, "Arial Narrow Bold", "Franklin Gothic Bold", "Arial Black", sans-serif',
  black: '"Arial Black", "Arial Bold", Gadget, sans-serif',
  serif: 'Georgia, "Times New Roman", serif',
  korinna: '"ITC Korinna", "Korinna", Georgia, "Times New Roman", serif',
  copper: 'Copperplate, "Copperplate Gothic Bold", "Copperplate Gothic Light", "Palatino Linotype", Georgia, serif',
  round: '"Arial Rounded MT Bold", "Trebuchet MS", "Helvetica Neue", Arial, sans-serif',
  script: '"Brush Script MT", "Segoe Script", "Lucida Handwriting", "Comic Sans MS", cursive',
  mono: '"Courier New", Courier, monospace',
  cond: '"Arial Narrow", "Roboto Condensed", "Helvetica Neue", Arial, sans-serif'
};

/* ---------------------------- INPUT --------------------------------- */
const I = { x: -99, y: -99, down: false, click: null, keys: [] };
const UI = { cursor: false };
const UIL = { top: 0, cur: 0 };
function toV(e) { return { x: (e.clientX - OX) / SC, y: (e.clientY - OY) / SC }; }
cv.addEventListener('pointermove', e => { const p = toV(e); I.x = p.x; I.y = p.y; });
cv.addEventListener('pointerdown', e => {
  AU.init();
  const p = toV(e); I.x = p.x; I.y = p.y; I.down = true; I.click = p;
  if (TX.active) { try { txEl.focus({ preventScroll: true }); } catch (_) { txEl.focus(); } }
  e.preventDefault();
});
window.addEventListener('pointerup', () => { I.down = false; });
cv.addEventListener('pointerleave', () => { I.x = -99; I.y = -99; });
window.addEventListener('keydown', e => {
  AU.init();
  if (e.target === txEl) {
    if (e.key === 'Enter') { e.preventDefault(); TX.enter(); }
    return;
  }
  let k = e.key.length === 1 ? e.key.toUpperCase() : e.key;
  if (k === ' ') k = 'Space';
  if (k === 'Space' || k.startsWith('Arrow') || k === 'Backspace') e.preventDefault();
  I.keys.push(k);
  if (SCENE && SCENE.key) SCENE.key(k, e);
});
function inR(p, x, y, w, h) { return p && p.x >= x && p.x <= x + w && p.y >= y && p.y <= y + h; }
function keyHit(k) {
  if (TX.active || !k) return false;
  const ks = Array.isArray(k) ? k : [k];
  for (const kk of ks) { const i = I.keys.indexOf(kk); if (i >= 0) { I.keys.splice(i, 1); return true; } }
  return false;
}
const HOV = {};
/* Immediate-mode hit region. Returns {over, h (hover anim 0..1), clicked} */
function hit(id, x, y, w, h, o) {
  o = o || {};
  const on = UIL.cur >= UIL.top && !o.disabled;
  const over = on && I.x >= x && I.x <= x + w && I.y >= y && I.y <= y + h;
  if (over) UI.cursor = true;
  HOV[id] = lerp(HOV[id] || 0, over ? 1 : 0, 0.28);
  let clicked = false;
  if (on && I.click && inR(I.click, x, y, w, h)) { clicked = true; I.click = null; }
  if (on && !clicked && o.key && keyHit(o.key)) clicked = true;
  if (clicked && !o.silent) SFX.click();

}
function layer(n, fn) { const p = UIL.cur; UIL.cur = n; fn(); UIL.cur = p; }

/* ---------------------------- TEXT INPUT ---------------------------- */
const TX = {
  active: false, res: null, o: {}, rect: null, shake: 0,
  open(o) {
    this.o = o || {}; this.active = true; txEl.value = this.o.value || '';
    txEl.maxLength = this.o.max || 48;
    txEl.setAttribute('inputmode', this.o.numeric ? 'numeric' : 'text');
    try { txEl.focus({ preventScroll: true }); } catch (_) { txEl.focus(); }
    const d = deferred(); this.res = d.resolve; return d;
  },
  value() { return txEl.value; },
  set(v) { txEl.value = v; },
  enter() {
    if (!this.active) return;
    const v = txEl.value;
    if (this.o.onEnter) { this.o.onEnter(v); return; }
    if (!this.o.allowEmpty && !v.trim()) { this.shake = 0.4; return; }
    this.finish(v);
  },
  finish(v) {
    if (!this.active) return;
    const r = this.res; const val = v === undefined ? txEl.value : v;
    this.close(); if (r) r(val);
  },
  close() { this.active = false; this.res = null; this.o = {}; txEl.value = ''; txEl.blur(); this.rect = null; }
};
txEl.addEventListener('input', () => {
  if (TX.o.numeric) txEl.value = txEl.value.replace(/[^0-9]/g, '').slice(0, TX.o.max || 9);
  if (TX.o.upper) txEl.value = txEl.value.toUpperCase();
  SFX.key();
});
/* Draws the visible text field that mirrors the hidden input. */
function drawField(c, x, y, w, h, s) {
  s = s || {};
  const sh = TX.shake > 0 ? Math.sin(TX.shake * 60) * 8 * TX.shake : 0;
  x += sh;
  TX.rect = { x, y, w, h };
  c.save();
  rr(c, x, y, w, h, s.r == null ? 10 : s.r);
  c.fillStyle = s.bg || 'rgba(0,0,0,.55)'; c.fill();
  c.lineWidth = s.bw || 3; c.strokeStyle = s.border || '#fff'; c.stroke();
  const val = TX.active ? txEl.value : (s.value || '');
  const size = s.size || Math.round(h * 0.5);
  const pre = s.prefix || '';
  c.font = `${s.weight || 'bold'} ${size}px ${s.font || F.sans}`;
  c.textBaseline = 'middle'; c.textAlign = 'left';
  let shown = pre + (s.upper ? val.toUpperCase() : val);
  const pad = 16;
  let tw = c.measureText(shown).width;
  c.beginPath(); c.rect(x + 4, y, w - 8, h); c.clip();
  let tx0 = x + pad;
  if (s.center && tw < w - pad * 2) tx0 = x + (w - tw) / 2;
  if (tw > w - pad * 2) tx0 = x + w - pad - tw;
  if (!val && s.placeholder) {
    c.fillStyle = s.ph || 'rgba(255,255,255,.4)';
    c.fillText(s.placeholder, s.center ? x + (w - c.measureText(s.placeholder).width) / 2 : x + pad + 10 + c.measureText(pre).width, y + h / 2 + 1);
    if (pre) { c.fillStyle = s.color || '#fff'; c.fillText(pre, x + pad, y + h / 2 + 1); }
  } else { c.fillStyle = s.color || '#fff'; c.fillText(shown, tx0, y + h / 2 + 1); }
  if (TX.active && (TT * 2 % 2) < 1.2) {
    const cx = (val ? tx0 + tw : (s.center && !s.placeholder ? x + w / 2 : x + pad + c.measureText(pre).width)) + 3;
    c.fillStyle = s.caret || s.color || '#fff'; c.fillRect(cx, y + h * 0.22, 3, h * 0.56);
  }

}

/* ---------------------------- TIMERS -------------------------------- */
let TIMERS = [];
function wait(s) { return new Promise(r => TIMERS.push({ t: s, r })); }
function tickTimers(dt) {
  if (!TIMERS.length) return;
  const due = [];
  TIMERS = TIMERS.filter(o => { o.t -= dt; if (o.t <= 0) { due.push(o); return false; } return true; });
  due.forEach(o => o.r());
}
/* A countdown that can be awaited and cancelled; exposes .left for drawing */
function countdown(sec, onTick) {
  const cd = { total: sec, left: sec, done: false, d: deferred(), last: Math.ceil(sec) };
  cd.stop = () => { if (!cd.done) { cd.done = true; cd.d.resolve(false); } };
  cd.p = cd.d;
  COUNTDOWNS.push(cd);
  cd.onTick = onTick;
  return cd;
}
let COUNTDOWNS = [];
function tickCountdowns(dt) {
  COUNTDOWNS = COUNTDOWNS.filter(cd => {
    if (cd.done) return false;
    if (cd.paused) return true;
    cd.left -= dt;
    const s = Math.ceil(cd.left);
    if (s !== cd.last) { cd.last = s; if (cd.onTick) cd.onTick(s); }
    if (cd.left <= 0) { cd.left = 0; cd.done = true; cd.d.resolve(true); return false; }
    return true;
  });
}

/* ---------------------------- AUDIO --------------------------------- */
const AU = {
  c: null, m: false, master: null, nb: null,
  init() {
    if (this.c) { if (this.c.state === 'suspended') this.c.resume(); return; }
    try {
      this.c = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.c.createGain(); this.master.gain.value = this.m ? 0 : 0.45;
      const comp = this.c.createDynamicsCompressor(); this.master.connect(comp); comp.connect(this.c.destination);
      const len = this.c.sampleRate * 2; this.nb = this.c.createBuffer(1, len, this.c.sampleRate);
      const d = this.nb.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.c = null; }
  },
  toggle() { this.m = !this.m; store('muted', this.m); if (this.master) this.master.gain.value = this.m ? 0 : 0.45; },
  ok() { return this.c && !this.m; },
  tone(f, d, o) {
    if (!this.ok()) return; o = o || {};
    const c = this.c, t = c.currentTime + (o.at || 0);
    const os = c.createOscillator(), g = c.createGain();
    os.type = o.type || 'sine'; os.frequency.setValueAtTime(f, t);
    if (o.to) os.frequency.exponentialRampToValueAtTime(o.to, t + (o.slide || d));
    if (o.vib) { const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = o.vib; lg.gain.value = o.vibD || 8; l.connect(lg); lg.connect(os.frequency); l.start(t); l.stop(t + d + .1); }
    const v = o.vol == null ? 0.25 : o.vol;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + (o.att || 0.008));
    if (o.hold) g.gain.setValueAtTime(v, t + o.hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    let node = os;
    if (o.lp) { const f2 = c.createBiquadFilter(); f2.type = 'lowpass'; f2.frequency.value = o.lp; os.connect(f2); node = f2; }
    node.connect(g); g.connect(this.master); os.start(t); os.stop(t + d + 0.05);
  },
  noise(d, o) {
    if (!this.ok()) return; o = o || {};
    const c = this.c, t = c.currentTime + (o.at || 0);
    const s = c.createBufferSource(); s.buffer = this.nb; s.loop = true;
    const f = c.createBiquadFilter(); f.type = o.ft || 'bandpass'; f.frequency.setValueAtTime(o.f || 1000, t); f.Q.value = o.q || 1;
    if (o.fto) f.frequency.exponentialRampToValueAtTime(o.fto, t + d);
    const g = c.createGain(); const v = o.vol == null ? 0.2 : o.vol;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + (o.att || 0.005)); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t, Math.random()); s.stop(t + d + 0.05);
  },
  seq(notes, o) { o = o || {}; let at = o.at || 0; for (const [n, d, v] of notes) { if (n) this.tone(typeof n === 'string' ? nf(n) : n, d * (o.len || 1.05), Object.assign({}, o, { at, vol: v || o.vol })); at += d; } }
};
function nf(n) { const m = /^([A-G])(#|b)?(\d)$/.exec(n); const b = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0); return 440 * Math.pow(2, (b + (+m[3] + 1) * 12 - 69) / 12); }
const SFX = {
  click() { AU.tone(1100, 0.05, { type: 'square', vol: 0.05 }); },
  key() { AU.tone(1600, 0.025, { type: 'square', vol: 0.025 }); },
  tick() { AU.tone(1900, 0.035, { type: 'square', vol: 0.05 }); },
  tock() { AU.tone(1300, 0.035, { type: 'square', vol: 0.05 }); },
  ding() { AU.tone(1318, 0.9, { vol: 0.22 }); AU.tone(2637, 0.5, { vol: 0.07 }); },
  bell() { AU.tone(1760, 0.5, { type: 'triangle', vol: 0.18 }); AU.tone(2217, 0.4, { vol: 0.06 }); },
  correct() { AU.seq([['C5', .08], ['E5', .08], ['G5', .08], ['C6', .3]], { type: 'triangle', vol: 0.2 }); },
  wrong() { AU.tone(140, 0.55, { type: 'sawtooth', vol: 0.16, lp: 900 }); AU.tone(147, 0.55, { type: 'sawtooth', vol: 0.16, lp: 900 }); },
  strike() { AU.tone(110, 0.9, { type: 'square', vol: 0.14, lp: 1200 }); AU.tone(116, 0.9, { type: 'sawtooth', vol: 0.14, lp: 1200 }); },
  buzz() { AU.tone(330, 0.25, { type: 'square', vol: 0.1, lp: 2500 }); AU.tone(440, 0.25, { type: 'square', vol: 0.06, lp: 2500 }); },
  whoosh() { AU.noise(0.45, { f: 400, fto: 3000, q: 0.8, vol: 0.18, att: 0.15 }); },
  swoosh() { AU.noise(0.3, { f: 3000, fto: 500, q: 0.8, vol: 0.14, att: 0.05 }); },
  pop() { AU.tone(600, 0.12, { to: 1200, type: 'sine', vol: 0.2 }); },
  plink() { AU.tone(rnd(1800, 2600), 0.08, { type: 'triangle', vol: 0.08 }); },
  cash() { AU.tone(2093, 0.12, { type: 'square', vol: 0.06 }); AU.tone(2637, 0.4, { type: 'triangle', vol: 0.15, at: 0.08 }); AU.noise(0.1, { f: 5000, vol: 0.08 }); },
  applause(d) {
    d = d || 2.4; if (!AU.ok()) return;
    AU.noise(d, { f: 2000, q: 0.4, vol: 0.05, att: 0.3 });
    for (let i = 0; i < 90 * d / 2.4; i++) AU.noise(0.04, { at: Math.random() * d * 0.9, f: rnd(900, 3500), q: 1.5, vol: rnd(0.04, 0.12) });
  },
  fanfare() { AU.seq([['G4', .12], ['C5', .12], ['E5', .12], ['G5', .24], ['E5', .12], ['G5', .6]], { type: 'sawtooth', vol: 0.09, lp: 2500 }); AU.seq([['C4', .72], ['C4', .6]], { type: 'triangle', vol: 0.12 }); },
  win() { SFX.fanfare(); setTimeout(() => SFX.applause(3), 300); },
  lose() { AU.seq([['G4', .35], ['F#4', .35], ['F4', .35]], { type: 'triangle', vol: 0.18 }); AU.tone(nf('E4'), 1.2, { type: 'triangle', vol: 0.18, at: 1.05, vib: 6, vibD: 10 }); },
  timeup() { AU.seq([['E5', .18], ['C5', .18], ['A4', .5]], { type: 'square', vol: 0.07, lp: 1800 }); },
  ring() { for (let i = 0; i < 2; i++) { AU.tone(440, 0.4, { at: i * 0.5, vol: 0.08, vib: 20, vibD: 30 }); AU.tone(480, 0.4, { at: i * 0.5, vol: 0.08 }); } },
  sting() { AU.tone(55, 1.6, { type: 'sawtooth', vol: 0.18, lp: 400 }); AU.tone(110, 1.6, { type: 'sawtooth', vol: 0.1, lp: 600 }); AU.noise(0.8, { ft: 'lowpass', f: 200, vol: 0.3 }); },
  drum() { AU.noise(0.25, { ft: 'lowpass', f: 180, vol: 0.5 }); AU.tone(70, 0.3, { to: 40, vol: 0.4 }); },
  whammy() { AU.tone(700, 0.5, { to: 90, type: 'square', vol: 0.1, lp: 2000 }); AU.seq([['C4', .12], ['C4', .12], ['G3', .4]], { type: 'sawtooth', vol: 0.1, lp: 1500, at: 0.5 }); AU.noise(0.3, { at: 0.5, f: 300, vol: 0.2 }); },
  boing() { AU.tone(200, 0.5, { to: 700, type: 'sine', vol: 0.2, vib: 12, vibD: 60 }); },
  spinTick() { AU.tone(2400, 0.02, { type: 'square', vol: 0.05 }); AU.noise(0.02, { f: 4000, vol: 0.05 }); },
  yodel() { AU.seq([['G4', .12], ['D5', .12], ['G4', .12], ['D5', .12], ['B4', .12], ['G5', .24]], { type: 'triangle', vol: 0.12 }); },
  bigwin() { AU.seq([['C5', .1], ['E5', .1], ['G5', .1], ['C6', .1], ['G5', .1], ['C6', .5]], { type: 'square', vol: 0.07, lp: 3000 }); AU.seq([['C4', .5], ['G4', .5]], { type: 'triangle', vol: 0.15 }); setTimeout(() => SFX.applause(3.5), 400); }
};

/* ---------------------------- DRAW HELPERS -------------------------- */

function setFont(c, size, fam, wt, it) { c.font = `${it ? 'italic ' : ''}${wt || 'bold'} ${size}px ${fam || F.sans}`; }
/* Draw a line of text. o: size, font, weight, italic, color, align, base, stroke, sw, shadow, blur, sx, sy, maxW, ls, alpha */
function T(c, s, x, y, o) {

/* Text fitted & wrapped into a box. Returns size used. */
function TB(c, s, x, y, w, h, o) {

  async function showdown(spinners) {

      else { await wait(1.2); again = v1 <= leader || (i < spinners.length - 1 && v1 < 60) || (i === spinners.length - 1 && v1 <= leader); if (v1 > leader && v1 >= 60) again = false; S.msg = again ? `${sp.name.toUpperCase()} WILL SPIN AGAIN` : `${sp.name.toUpperCase()} STAYS AT ${v1}¢`; await wait(1.0); }
      if (again) { const v2 = await spinOnce(sp); sp.spins.push(v2); sp.total += v2; SFX.ding(); }
      if (sp.total > 100) { sp.over = true; SFX.wrong(); flash('OVER!', '#ff4040'); S.msg = `${sp.name === 'YOU' ? 'YOU GO' : sp.name.toUpperCase() + ' GOES'} OVER WITH ${sp.total}¢`; }

      await wait(2.0);

    if (!alive.length) { alive = spinners; S.msg = 'EVERYONE WENT OVER! SPIN-OFF!'; spinners.forEach(s => s.total = 0); }
    let best = Math.max(...alive.map(s => s.total));

    top.ai ? SFX.lose() : SFX.win();
    await wait(2.6);
    return top;
  }

  const flash = (text, col) => { S.fx = { text, col, t0: TT }; };
  const taunt = s => { S.taunt = { text: s, t0: TT }; };
  async function run() {
    SFX.sting(); await wait(3.4);
    await cashBuilder();
    if (S.cash === 0) S.cash = 1000;
    const home = await headToHead();
    if (!home) return;
    await finalChase();
  }
  /* ---------- Cash Builder ---------- */
  async function cashBuilder() {
    S.phase = 'cbintro'; S.riT0 = TT; await wait(2.2);
    S.phase = 'cb'; S.cbRight = 0; S.cbWrong = 0;
    const cd = countdown(60, s => { if (s <= 10 && s > 0) SFX.tick(); }); S.cd = cd;
    while (!cd.done) {
      S.q = nextQ(); S.q.t0 = TT; S.q.pick = null;
      S.pickD = deferred();
      const r = await Promise.race([S.pickD, cd.p.then(() => -1)]);
      S.pickD = null;
      if (r === -1 || cd.done && r == null) break;
      S.q.pick = r;
      if (r === S.q.ans) { S.cash += 5000; S.cbRight++; SFX.ding(); S.q.res = 'ok'; }
      else { S.cbWrong++; SFX.buzz(); S.q.res = 'no'; }
      await wait(0.35);
    }
    SFX.timeup(); S.q = null; S.cd = null;
    S.msg = `TIME! ${S.cbRight} CORRECT — YOU BANKED ${money(S.cash)}`; await wait(2.4);
  }
  /* ---------- Head to Head ---------- */
  async function headToHead() {
    S.phase = 'offers'; S.msg = '';
    const high = Math.round(S.cash * CH.mult / 1000) * 1000 + rint(1, 4) * 5000;
    const low = Math.max(1000, Math.round(S.cash * rnd(0.1, 0.3) / 1000) * 1000);
    S.offers = [{ k: 'high', v: high, pos: 2 }, { k: 'mid', v: S.cash, pos: 3 }, { k: 'low', v: low, pos: 4 }];
    taunt(pick(TAUNTS)); SFX.sting();
    S.offD = deferred(); const off = await S.offD; S.offD = null;
    S.prize = off.v; S.ppos = off.pos; S.cpos = 0;
    S.phase = 'h2h'; S.msg = off.k === 'high' ? 'GOING HIGH! BOLD MOVE.' : off.k === 'low' ? 'PLAYING IT SAFE…' : 'STICKING WITH YOUR CASH.';
    taunt(off.k === 'high' ? 'Greed. I love it.' : off.k === 'low' ? 'Sensible. Won\'t help you.' : 'Let\'s see what you\'ve got.');
    await wait(2);
    let n = 0;
    while (true) {
      n++;
      S.q = nextQ(); S.q.pick = null; S.q.cpick = null; S.q.reveal = false; S.q.n = n;
      S.msg = `QUESTION ${n}`;
      SFX.swoosh();
      const cd = countdown(D === 'hard' ? 9 : 12, s => { if (s <= 3 && s > 0) SFX.tick(); }); S.cd = cd;
      S.pickD = deferred();
      const r = await Promise.race([S.pickD, cd.p.then(() => -1)]);
      S.pickD = null; cd.stop(); S.cd = null;
      S.q.pick = r;
      S.q.cpick = chance(CH.acc) ? S.q.ans : pick([0, 1, 2].filter(i => i !== S.q.ans));
      await wait(0.8);
      // reveal: player's answer, chaser's answer, then the right answer
      S.q.stage = 1; SFX.pop(); await wait(1.0);
      S.q.stage = 2; SFX.pop(); await wait(1.2);
      S.q.reveal = true; S.q.stage = 3;
      const pOk = r === S.q.ans, cOk = S.q.cpick === S.q.ans;
      if (pOk) { SFX.correct(); } else SFX.wrong();
      await wait(0.8);
      if (pOk) { S.ppos++; SFX.ding(); }
      await wait(0.5);
      if (cOk) { S.cpos++; SFX.drum(); }
      await wait(1.2);
      if (S.cpos >= S.ppos) {
        S.phase = 'caught'; S.caughtT = TT; SFX.lose(); taunt('Caught you.');
        await wait(3);
        S.end = { title: 'CAUGHT!', sub: `${chaser[0]} wins`, lines: [`You were chasing ${money(S.prize)}.`, `You answered ${S.cbRight} in the Cash Builder.`], t0: TT };
        S.phase = 'end'; return false;
      }
      if (S.ppos >= 8) {
        S.phase = 'home'; S.homeT = TT; SFX.win(); confetti(640, 360, 160, ['#3ad0ff', '#ffffff', '#1a8adf']); taunt('Hmph. Lucky.');
        await wait(3.2);
        return true;
      }
    }
  }
  /* ---------- Final Chase ---------- */
  async function finalChase() {
    S.phase = 'fcintro'; S.riT0 = TT; SFX.sting(); await wait(2.6);
    S.fc = { target: 1, cstep: 0, stage: 'you' };
    S.phase = 'fc';
    const cd = countdown(60, s => { if (s <= 10 && s > 0) SFX.tick(); }); S.cd = cd;
    while (!cd.done) {
      S.q = nextQ(); S.q.pick = null;
      S.pickD = deferred();
      const r = await Promise.race([S.pickD, cd.p.then(() => -1)]);
      S.pickD = null;
      if (r === -1) break;
      if (r === S.q.ans) { S.fc.target++; SFX.ding(); S.q.res = 'ok'; }
      else { SFX.buzz(); S.q.res = 'no'; S.fc.lock = TT + 0.8; }
      S.q.pick = r;
      await wait(0.3);
      if (S.fc.lock && TT < S.fc.lock) await wait(S.fc.lock - TT);
    }
    SFX.timeup(); S.q = null; S.cd = null;
    S.msg = `YOUR TARGET: ${S.fc.target} STEPS`; await wait(2.4);
    // the chaser responds
    S.fc.stage = 'chaser'; S.msg = `${chaser[0]} HAS 60 SECONDS TO CATCH YOU…`; taunt('My turn.');
    await wait(2);
    const cdc = countdown(60, s => { if (s <= 10 && s > 0) SFX.tick(); }); S.cd = cdc;
    S.fc.pushbacks = 0;
    while (!cdc.done && S.fc.cstep < S.fc.target) {
      const q = nextQ(); S.fc.cq = q; S.fc.cqT = TT;
      const dt = CH.speed * rnd(0.75, 1.25);
      const done = await Promise.race([wait(dt).then(() => false), cdc.p.then(() => true)]);
      if (done || cdc.done) break;
      if (chance(CH.acc + 0.04)) { S.fc.cstep++; SFX.drum(); S.fc.cflash = TT; }
      else {
        // pushback opportunity
        cdc.paused = true; SFX.buzz();
        S.fc.push = { q, t0: TT, pick: null }; S.msg = `${chaser[0]} GOT IT WRONG! PUSHBACK — ANSWER FOR A STEP BACK!`;
        const pcd = countdown(6, s => { if (s > 0) SFX.tick(); }); S.fc.push.cd = pcd;
        S.pickD = deferred();
        const r = await Promise.race([S.pickD, pcd.p.then(() => -1)]);
        S.pickD = null; pcd.stop();
        S.fc.push.pick = r;
        if (r === q.ans) { if (S.fc.cstep > 0) S.fc.cstep--; else S.fc.target++; S.fc.pushbacks++; SFX.correct(); S.msg = 'PUSHBACK! THE CHASER DROPS A STEP!'; }
        else { SFX.wrong(); S.msg = 'NO PUSHBACK…'; }
        await wait(1.4);
        S.fc.push = null; cdc.paused = false; S.msg = '';
      }
    }
    cdc.stop(); S.cd = null; S.fc.cq = null;
    const caught = S.fc.cstep >= S.fc.target;
    await wait(0.8);
    if (caught) {
      S.phase = 'caught'; S.caughtT = TT; SFX.lose(); taunt('Game over.'); await wait(3);
      S.end = { title: 'CAUGHT IN THE FINAL!', sub: `${chaser[0]} caught you with ${Math.ceil(cdc.left)}s to spare`, lines: [`Your target: ${S.fc.target} steps  •  Pushbacks: ${S.fc.pushbacks}`, `You were playing for ${money(S.prize)}.`], t0: TT };
    } else {
      S.phase = 'won'; S.wonT = TT; SFX.bigwin(); confettiRain(220, ['#3ad0ff', '#ffffff', '#1a8adf', '#ffd400']); taunt('…Well played.'); await wait(3.4);
      S.end = { title: 'YOU BEAT THE CHASER!', sub: `You win ${money(S.prize)}!`, lines: [`Your target: ${S.fc.target}  •  ${chaser[0]} reached ${S.fc.cstep}`, `Pushbacks: ${S.fc.pushbacks}`], t0: TT };
    }
    S.phase = 'end';
  }
  /* ---------- drawing ---------- */
  function drawQ(c, q, x, y, w, o) {
    o = o || {};
    rr(c, x, y, w, 120, 14); c.fillStyle = 'rgba(2,20,40,.92)'; c.fill(); c.lineWidth = 2.5; c.strokeStyle = '#3ad0ff'; c.stroke();
    TB(c, q.q.q, x + 24, y + 10, w - 48, 100, { size: 30, min: 14, font: F.sans, weight: 'bold', color: '#fff' });
    const bw = (w - 40) / 3;
    q.opts.forEach((opt, i) => {
      const bx = x + i * (bw + 20), by = y + 140;
      let st = { grad: ['#0f4a7a', '#062238'], border: '#3ad0ff', size: 22, font: F.sans, key: String(i + 1), disabled: !S.pickD };
      if (o.h2h && q.stage >= 1 && q.pick === i) st = Object.assign(st, { grad: ['#1a8adf', '#0a4a8a'], border: '#fff' });
      if (!o.h2h && q.pick === i) st = Object.assign(st, { grad: q.res === 'ok' ? ['#3fe03f', '#0a7a0a'] : ['#ff4040', '#8a0000'] });
      if (q.reveal && i === q.ans) st = Object.assign(st, { grad: ['#3fe03f', '#0a7a0a'], border: '#fff' });
      if (btn('cq' + i, bx, by, bw, 70, opt, st) && S.pickD) S.pickD.resolve(i);
      if (o.h2h && q.stage >= 1 && q.pick === i) T(c, 'YOU', bx + 30, by - 10, { size: 14, font: F.black, color: '#3ad0ff' });
      if (o.h2h && q.stage >= 2 && q.cpick === i) { T(c, 'CHASER', bx + bw - 40, by - 10, { size: 14, font: F.black, color: '#ff4040' }); c.strokeStyle = '#ff2a2a'; c.lineWidth = 4; rr(c, bx - 4, by - 4, bw + 8, 78, 14); c.stroke(); }
    });
    T(c, 'Keys 1 · 2 · 3', x + w / 2, y + 232, { size: 12, font: F.sans, weight: 'normal', color: 'rgba(160,220,255,.5)' });
  }
  function drawBoard(c, t) {
    const x = 930, y = 60, w = 300, rh = 64;
    rr(c, x - 14, y - 14, w + 28, 9 * rh + 18, 16); c.fillStyle = 'rgba(0,8,16,.85)'; c.fill(); c.strokeStyle = '#3ad0ff'; c.lineWidth = 2; c.stroke();
    for (let r = 0; r < 8; r++) {
      const yy = y + r * rh;
      let fill = '#0a2238', txt = '';
      if (r === S.ppos) { fill = '#1a8adf'; txt = money(S.prize || S.cash); }
      if (r < S.cpos || r === S.cpos) { fill = r === S.cpos ? '#d01010' : '#5a0a0a'; if (r === S.cpos) txt = chaser[0]; }
      if (r === S.cpos && r === S.ppos) { fill = Math.floor(TT * 6) % 2 ? '#d01010' : '#1a8adf'; txt = 'CAUGHT!'; }
      rr(c, x, yy, w, rh - 8, 10); c.fillStyle = fill; c.fill(); c.strokeStyle = 'rgba(160,220,255,.4)'; c.lineWidth = 1.5; c.stroke();
      if (txt) T(c, txt, x + w / 2, yy + (rh - 8) / 2 + 1, { size: 24, font: F.black, color: '#fff', maxW: w - 20 });
    }
    rr(c, x, y + 8 * rh, w, rh - 8, 10); c.fillStyle = S.ppos >= 8 ? '#1aa84a' : '#083a1a'; c.fill(); c.strokeStyle = '#7dff4d'; c.lineWidth = 2; c.stroke();
    T(c, S.ppos >= 8 ? `HOME! ${money(S.prize)}` : 'HOME', x + w / 2, y + 8 * rh + (rh - 8) / 2, { size: 24, font: F.black, color: '#fff' });
  }
  S.draw = (c, t) => {
    if (S.end) UIL.top = 5;
    chaseBg(c, t);
    const ph = S.phase;
    if (ph === 'intro') {
      const k = E.out(clamp((TT - S.t0) / 1.2, 0, 1));
      drawChaser(c, 900, 470, 1.6 * k, t);
      chaseLogo(c, 420, 220, 110 * k);
      if (TT - S.t0 > 1.3) { T(c, 'TONIGHT\'S CHASER IS…', 420, 400, { size: 26, font: F.black, color: '#9fe6ff', ls: 3 }); }
      if (TT - S.t0 > 2.0) { T(c, chaser[0], 420, 460, { size: 64, font: F.black, color: '#ff2a2a', stroke: '#000', sw: 6, ls: 3 }); T(c, chaser[1], 420, 510, { size: 20, font: F.sans, color: '#fff', italic: true, weight: 'normal' }); }
    } else chaseLogo(c, 640, 38, 30);
    if (ph === 'cbintro') banner(c, 'THE CASH BUILDER', S.riT0, { y: 330, size: 80, font: F.black, color: '#3ad0ff', stroke: '#021a2a', life: 2 });
    if (ph === 'cb' || ph === 'fc') {
      const q = S.q;
      if (q) drawQ(c, q, 100, 180, 820, {});
      if (S.cd) timerRing(c, 1060, 200, 80, S.cd.left / S.cd.total, '#3ad0ff', Math.ceil(S.cd.left), { lw: 12 });
      if (ph === 'cb') { T(c, 'BANKED', 1060, 330, { size: 18, font: F.black, color: '#9fe6ff', ls: 3 }); T(c, money(S.cash), 1060, 380, { size: 48, font: F.black, color: '#fff' }); T(c, `${S.cbRight} correct`, 1060, 425, { size: 18, font: F.sans, color: '#9fe6ff' }); }
      if (ph === 'fc') {
        const f = S.fc;
        T(c, 'YOUR TARGET', 1060, 330, { size: 18, font: F.black, color: '#9fe6ff', ls: 3 }); T(c, String(f.target), 1060, 390, { size: 72, font: F.black, color: '#3ad0ff' });
        if (f.stage === 'chaser') {
          T(c, chaser[0], 1060, 450, { size: 18, font: F.black, color: '#ff6060', ls: 2 }); T(c, String(f.cstep), 1060, 510, { size: 72, font: F.black, color: f.cflash && TT - f.cflash < 0.3 ? '#fff' : '#ff2a2a' });
          // track
          rr(c, 100, 440, 820, 60, 30); c.fillStyle = '#021a2a'; c.fill(); c.strokeStyle = '#3ad0ff'; c.lineWidth = 2; c.stroke();
          const tw2 = 800 / Math.max(f.target, 1);
          for (let k = 0; k < f.target; k++) { rr(c, 110 + k * tw2, 448, tw2 - 4, 44, 8); c.fillStyle = k < f.cstep ? '#d01010' : '#0f4a7a'; c.fill(); }
          if (!f.push) { drawChaser(c, 510, 330, 0.9, t); T(c, f.cq ? `${chaser[0]} is answering…` : '', 510, 560, { size: 22, font: F.sans, color: '#fff' }); }
          if (f.push) { drawQ(c, Object.assign({}, f.push.q, { pick: f.push.pick, res: f.push.pick === f.push.q.ans ? 'ok' : 'no', reveal: f.push.pick != null }), 100, 180, 820, {}); if (f.push.cd && f.push.pick == null) timerBar(c, 100, 150, 820, 12, f.push.cd.left / 6, '#ff4040'); }
        } else T(c, 'Head start: 1 step', 1060, 440, { size: 16, font: F.sans, color: '#9fe6ff' });
      }
      if (ph === 'fc' && S.fc.stage === 'you') T(c, 'THE FINAL CHASE — SET YOUR TARGET!', 510, 130, { size: 26, font: F.black, color: '#3ad0ff', ls: 2 });
      if (ph === 'cb') {
        T(c, 'CASH BUILDER — $5,000 PER CORRECT ANSWER', 510, 130, { size: 24, font: F.black, color: '#3ad0ff', ls: 2 });
        drawChaser(c, 510, 600, 0.75, t);
        T(c, `${chaser[0]} is watching…`, 510, 690, { size: 16, font: F.sans, color: '#ff8080', italic: true, weight: 'normal' });
      }
      if (ph === 'fc' && S.fc.stage === 'you') {
        const f = S.fc; rr(c, 100, 470, 820, 50, 25); c.fillStyle = '#021a2a'; c.fill(); c.strokeStyle = '#3ad0ff'; c.lineWidth = 2; c.stroke();
        for (let k = 0; k < Math.min(f.target, 26); k++) { rr(c, 108 + k * 31, 476, 27, 38, 6); c.fillStyle = k === 0 ? '#7dff4d' : '#1a8adf'; c.fill(); }
        T(c, 'Wrong answers freeze you for a moment — accuracy matters!', 510, 560, { size: 16, font: F.sans, color: '#9fe6ff', weight: 'normal' });
      }
    }
    if (ph === 'offers') {
      drawChaser(c, 1030, 520, 1.1, t);
      T(c, `${chaser[0]} MAKES YOU AN OFFER`, 470, 120, { size: 30, font: F.black, color: '#fff', ls: 2 });
      S.offers.forEach((o, i) => {
        const y = 170 + i * 150;
        const lab = o.k === 'high' ? 'HIGH OFFER' : o.k === 'mid' ? 'YOUR CASH' : 'LOW OFFER';
        const sub = o.k === 'high' ? 'Start ONE step closer to the Chaser (6 to get home)' : o.k === 'mid' ? 'Start in the middle (5 to get home)' : 'Start ONE step closer to home (4 to get home)';
        if (btn('off' + o.k, 140, y, 660, 124, `${lab}:  ${money(o.v)}`, { grad: o.k === 'high' ? ['#d01010', '#5a0000'] : o.k === 'mid' ? ['#1a8adf', '#063a6a'] : ['#1aa84a', '#063a1a'], border: '#fff', size: 34, font: F.black, sub, subSize: 16, key: String(i + 1) }) && S.offD) S.offD.resolve(o);
      });
    }
    if (['h2h', 'caught', 'home'].includes(ph) || (ph === 'end' && !S.fc)) {
      drawBoard(c, t);
      if (S.q && ph === 'h2h') { drawQ(c, S.q, 60, 170, 820, { h2h: true }); if (S.cd) timerBar(c, 60, 140, 820, 12, S.cd.left / S.cd.total, '#3ad0ff'); T(c, S.msg, 470, 110, { size: 22, font: F.black, color: '#9fe6ff', ls: 2 }); }
      if (ph === 'h2h') drawChaser(c, 300, 620, 0.55, t);
      if (ph === 'caught') banner(c, 'CAUGHT!', S.caughtT, { y: 360, x: 470, size: 120, font: F.black, color: '#ff2a2a', stroke: '#000', life: 3 });
      if (ph === 'home') banner(c, 'YOU\'RE HOME!', S.homeT, { y: 360, x: 470, size: 90, font: F.black, color: '#7dff4d', stroke: '#021a2a', life: 3.2 });
    }
    if (ph === 'fcintro') banner(c, 'THE FINAL CHASE', S.riT0, { y: 330, size: 84, font: F.black, color: '#ff2a2a', stroke: '#000', life: 2.4 });
    if (ph === 'won') banner(c, 'YOU BEAT THE CHASER!', S.wonT, { y: 330, size: 70, font: F.black, color: '#7dff4d', stroke: '#021a2a', life: 3.4 });
    if (ph === 'caught' && S.fc) banner(c, 'CAUGHT!', S.caughtT, { y: 330, size: 120, font: F.black, color: '#ff2a2a', stroke: '#000', life: 3 });
    if (S.msg && (ph === 'cb' || ph === 'fc') && (!S.q || S.fc && S.fc.stage === 'chaser')) T(c, S.msg, 510, 620, { size: 22, font: F.black, color: '#fff', maxW: 820 });
    if (S.taunt && TT - S.taunt.t0 < 2.6 && ph !== 'intro') {
      const tx = `${chaser[0]}: "${S.taunt.text}"`;
      setFont(c, 18, F.sans); const w = c.measureText(tx).width + 40;
      rr(c, 640 - w / 2, 660, w, 40, 20); c.fillStyle = 'rgba(120,0,0,.85)'; c.fill(); c.strokeStyle = '#ff4040'; c.lineWidth = 1.5; c.stroke();
      T(c, tx, 640, 680, { size: 18, font: F.sans, color: '#fff', italic: true });
    }
    if (S.end) endPanel(c, Object.assign({ theme: { accent: '#3ad0ff', font: F.black, panel: lg(c, 0, 150, 0, 570, ['#0d3a5a', '#01060d']), btn: { grad: ['#1a8adf', '#063a6a'], fg: '#fff', border: '#9fe6ff' } } }, S.end), () => go(ChaseScene(cfg)));
  };
  return S;
}

AU.m = !!store('muted');
window.GSH = { go, GAMES, MenuScene, SetupScene, get scene() { return SCENE; }, TX, I };
