<script>
'use strict';
// =====================================================================
//  LUMEN — Constructs of Will
//  A single-file canvas roguelite. Vanilla JS, no libraries.

// ---------------------------------------------------------------- utils
const TAU = Math.PI * 2;
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const dist2 = (ax, ay, bx, by) => { const dx = bx - ax, dy = by - ay; return dx * dx + dy * dy; };
const angTo = (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax);
const angDiff = (a, b) => { let d = b - a; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; };
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeOutBack = t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const weighted = (items, wf) => { let t = 0; for (const it of items) t += wf(it); let r = Math.random() * t; for (const it of items) { r -= wf(it); if (r <= 0) return it; } return items[items.length - 1]; };
function segDist2(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy;

  const cx = ax + dx * t, cy = ay + dy * t;
  return { d2: dist2(px, py, cx, cy), cx, cy, t };
}
function pointInPoly(x, y, poly) {

    const xi = poly[i].x, yi = poly[i].y, xj = poly[j].x, yj = poly[j].y;
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) ins = !ins;

}
function polyArea(poly) { let a = 0; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) a += (poly[j].x + poly[i].x) * (poly[j].y - poly[i].y); return Math.abs(a / 2); }
// returns t along segment A (0..1) where it hits segment B, or -1
function segSeg(ax, ay, bx, by, cx, cy, dx, dy) {

  const den = rx * sy - ry * sx; if (Math.abs(den) < 1e-9) return -1;

// ray/circle: first t in [0,1] along segment
function segCircle(ax, ay, bx, by, cx, cy, r) {

  if (t1 >= 0 && t1 <= 1) return t1; return -1;
}
const hexCache = {};
function hexToRgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgba(hex, a) { const c = hexCache[hex] || (hexCache[hex] = hexToRgb(hex)); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function mixHex(h1, h2, t) { const a = hexCache[h1] || (hexCache[h1] = hexToRgb(h1)), b = hexCache[h2] || (hexCache[h2] = hexToRgb(h2)); const r = [0, 1, 2].map(i => Math.round(lerp(a[i], b[i], t))); return '#' + r.map(v => v.toString(16).padStart(2, '0')).join(''); }
const fmt = n => { n = Math.floor(n); return n >= 1e6 ? (n / 1e6).toFixed(2) + 'M' : n >= 1e4 ? (n / 1e3).toFixed(1) + 'k' : '' + n; };
const fmtTime = s => { s = Math.floor(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

// ------------------------------------------------------------- storage
const SAVE_KEY = 'lumen_save_v1', SET_KEY = 'lumen_settings_v1';
function defaultMeta() {
  return { embers: 0, totalEmbers: 0, runs: 0, bestWave: 0, bestScore: 0, victories: 0, kills: 0, constructs: 0,
    upgrades: {}, hues: { verdant: true }, feats: {}, seen: {}, bossKills: {}, lastHue: 'verdant', lastDiff: 1, hueBest: {}, tutorialDone: false, midnightWin: false };
}
function loadMeta() { try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); const m = Object.assign(defaultMeta(), s || {}); for (const k of ['upgrades', 'hues', 'feats', 'seen', 'bossKills', 'hueBest']) m[k] = Object.assign({}, defaultMeta()[k], m[k] || {}); return m; } catch (e) { return defaultMeta(); } }
function saveMeta() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(meta)); } catch (e) { } }
function defaultSettings() { return { master: 0.7, music: 0.45, sfx: 0.8, shake: 1, numbers: 1, fps: 0, autoFire: 0, drawSlow: 1 }; }
function loadSettings() { try { return Object.assign(defaultSettings(), JSON.parse(localStorage.getItem(SET_KEY)) || {}); } catch (e) { return defaultSettings(); } }
function saveSettings() { try { localStorage.setItem(SET_KEY, JSON.stringify(settings)); } catch (e) { } applyVolumes(); }
let meta = loadMeta();
let settings = loadSettings();

// --------------------------------------------------------------- audio
let AC = null, masterG = null, sfxG = null, musG = null, noiseBuf = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const comp = AC.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 6; comp.connect(AC.destination);
    masterG = AC.createGain(); masterG.connect(comp);
    sfxG = AC.createGain(); sfxG.connect(masterG);
    musG = AC.createGain(); musG.connect(masterG);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    applyVolumes(); Music.start();
  } catch (e) { AC = null; }
}
function applyVolumes() { if (!AC) return; masterG.gain.value = settings.master; sfxG.gain.value = settings.sfx; musG.gain.value = settings.music * 0.55; }
function tone(o) {
  if (!AC) return; const t0 = AC.currentTime + (o.delay || 0);
  const osc = AC.createOscillator(), g = AC.createGain();
  osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(o.f, t0);
  if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f2), t0 + o.d);
  if (o.detune) osc.detune.value = o.detune;
  const v = o.v || 0.1, at = o.a || 0.005;
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0 + at); g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.d);
  let node = osc;
  if (o.lp) { const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; node.connect(f); node = f; }
  node.connect(g); g.connect(o.bus || sfxG); osc.start(t0); osc.stop(t0 + o.d + 0.05);
}
function noise(o) {
  if (!AC) return; const t0 = AC.currentTime + (o.delay || 0);
  const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  const f = AC.createBiquadFilter(); f.type = o.ft || 'lowpass'; f.frequency.setValueAtTime(o.f || 1000, t0);
  if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t0 + o.d); f.Q.value = o.q || 1;
  const g = AC.createGain(); const v = o.v || 0.1;
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0 + (o.a || 0.005)); g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.d);
  src.connect(f); f.connect(g); g.connect(o.bus || sfxG); src.start(t0, Math.random() * 0.5); src.stop(t0 + o.d + 0.05);
}
const sfxLast = {};
const SFX = {
  shoot: () => tone({ type: 'square', f: 760 + rand(80), f2: 380, d: 0.06, v: 0.028, lp: 3000 }),
  hit: () => tone({ type: 'triangle', f: 320 + rand(60), f2: 140, d: 0.06, v: 0.05 }),
  crit: () => { tone({ type: 'square', f: 1300, f2: 600, d: 0.08, v: 0.04, lp: 4000 }); },
  block: () => tone({ type: 'square', f: 200, f2: 180, d: 0.05, v: 0.04, lp: 1200 }),
  kill: () => { noise({ ft: 'bandpass', f: 1400, f2: 300, d: 0.14, v: 0.08, q: 2 }); tone({ f: 420, f2: 70, d: 0.14, v: 0.06 }); },
  hurt: () => { tone({ type: 'sawtooth', f: 220, f2: 55, d: 0.3, v: 0.12, lp: 900 }); noise({ f: 600, d: 0.2, v: 0.1 }); },
  dash: () => noise({ ft: 'bandpass', f: 600, f2: 2600, d: 0.2, v: 0.12, q: 1.5 }),
  pickup: () => tone({ f: 880 + rand(200), f2: 1500, d: 0.08, v: 0.035 }),
  will: () => tone({ type: 'triangle', f: 520, f2: 1040, d: 0.1, v: 0.04 }),
  heal: () => { tone({ f: 660, d: 0.15, v: 0.04 }); tone({ f: 990, d: 0.2, v: 0.03, delay: 0.06 }); },
  explode: () => { noise({ f: 900, f2: 60, d: 0.55, v: 0.28 }); tone({ f: 90, f2: 30, d: 0.5, v: 0.2 }); },
  smallboom: () => { noise({ f: 1400, f2: 120, d: 0.3, v: 0.14 }); tone({ f: 140, f2: 40, d: 0.25, v: 0.1 }); },
  zap: () => { noise({ ft: 'highpass', f: 2500, d: 0.12, v: 0.08 }); tone({ type: 'sawtooth', f: 1800, f2: 200, d: 0.12, v: 0.04 }); },
  focus: () => tone({ type: 'sine', f: 300, f2: 150, d: 0.35, v: 0.06 }),
  fizzle: () => { tone({ type: 'sawtooth', f: 300, f2: 80, d: 0.25, v: 0.05, lp: 800 }); },
  lance: () => { tone({ type: 'sawtooth', f: 180, f2: 900, d: 0.25, v: 0.1, lp: 3000 }); noise({ ft: 'highpass', f: 3000, d: 0.3, v: 0.1 }); },
  wall: () => { tone({ type: 'triangle', f: 140, d: 0.3, v: 0.12 }); tone({ type: 'sine', f: 280, d: 0.4, v: 0.06, delay: 0.03 }); },
  aegis: () => { tone({ f: 520, d: 0.5, v: 0.06 }); tone({ f: 780, d: 0.5, v: 0.05, delay: 0.05 }); tone({ f: 1040, d: 0.6, v: 0.04, delay: 0.1 }); },
  prison: () => { tone({ type: 'square', f: 220, f2: 110, d: 0.4, v: 0.06, lp: 1500 }); noise({ ft: 'bandpass', f: 900, d: 0.3, v: 0.06 }); },
  scythe: () => noise({ ft: 'bandpass', f: 3000, f2: 500, d: 0.35, v: 0.12, q: 3 }),
  vortex: () => { tone({ type: 'sawtooth', f: 60, f2: 240, d: 1.2, v: 0.1, lp: 600 }); },
  shot: () => tone({ type: 'sine', f: 500, f2: 300, d: 0.09, v: 0.035 }),
  warn: () => tone({ type: 'square', f: 880, d: 0.12, v: 0.03, lp: 2000 }),
  charge: () => tone({ type: 'sawtooth', f: 80, f2: 300, d: 0.7, v: 0.06, lp: 900 }),
  portal: () => tone({ type: 'sine', f: 180, f2: 90, d: 0.5, v: 0.04 }),
  ember: () => tone({ type: 'triangle', f: 1600 + rand(400), d: 0.06, v: 0.025 }),
  card: () => { [523, 659, 784, 1046].forEach((f, i) => tone({ type: 'triangle', f, d: 0.3, v: 0.05, delay: i * 0.06 })); },
  legend: () => { [523, 659, 784, 1046, 1318].forEach((f, i) => tone({ type: 'triangle', f, d: 0.6, v: 0.06, delay: i * 0.07 })); },
  hover: () => tone({ type: 'sine', f: 1200, d: 0.03, v: 0.015 }),
  click: () => tone({ type: 'triangle', f: 700, f2: 1000, d: 0.07, v: 0.04 }),
  wave: () => { [220, 277, 330].forEach((f, i) => tone({ type: 'sawtooth', f, d: 1.2, v: 0.03, lp: 1200, a: 0.1, delay: i * 0.02 })); },
  clear: () => { [392, 494, 587, 784].forEach((f, i) => tone({ type: 'triangle', f, d: 0.5, v: 0.05, delay: i * 0.09 })); },
  boss: () => { tone({ type: 'sawtooth', f: 55, f2: 40, d: 2.2, v: 0.18, lp: 500, a: 0.2 }); tone({ type: 'sawtooth', f: 82, f2: 58, d: 2.2, v: 0.12, lp: 400, a: 0.3 }); noise({ f: 300, d: 2, v: 0.08, a: 0.4 }); },
  ult: () => { tone({ type: 'sawtooth', f: 110, f2: 880, d: 0.6, v: 0.12, lp: 2500 }); [440, 554, 659, 880].forEach((f, i) => tone({ f, d: 0.8, v: 0.05, delay: 0.1 + i * 0.05 })); },
  death: () => { tone({ type: 'sawtooth', f: 300, f2: 30, d: 1.6, v: 0.15, lp: 800 }); noise({ f: 800, f2: 50, d: 1.5, v: 0.15 }); },
  revive: () => { [262, 330, 392, 523, 659, 784].forEach((f, i) => tone({ f, d: 0.7, v: 0.06, delay: i * 0.06 })); },
  feat: () => { [659, 784, 988, 1318].forEach((f, i) => tone({ type: 'square', f, d: 0.25, v: 0.03, lp: 3000, delay: i * 0.08 })); },
  buy: () => { tone({ type: 'triangle', f: 880, d: 0.1, v: 0.05 }); tone({ type: 'triangle', f: 1320, d: 0.2, v: 0.05, delay: 0.07 }); },
  deny: () => tone({ type: 'square', f: 140, d: 0.15, v: 0.05, lp: 800 }),

function sfx(name, minGap = 0.03) {
  if (!AC || !SFX[name]) return; const now = AC.currentTime;
  if (sfxLast[name] && now - sfxLast[name] < minGap) return; sfxLast[name] = now; SFX[name]();
}

// Generative music: minor-key progressions whose layers fade in with intensity
const Music = {
  started: false, step: 0, nextT: 0, intensity: 0.2, target: 0.2, mode: 'calm', timer: null,
  progs: {
    calm: [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]],
    fight: [[57, 60, 64], [53, 57, 60], [55, 59, 62], [52, 56, 59]],
    boss: [[50, 53, 57], [51, 55, 58], [50, 53, 57], [48, 51, 55]],
  },
  start() {
    if (this.started || !AC) return; this.started = true; this.nextT = AC.currentTime + 0.1;
    this.timer = setInterval(() => this.tick(), 50);
  },
  mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); },
  tick() {
    if (!AC) return;
    this.intensity = lerp(this.intensity, this.target, 0.02);
    const spb = this.mode === 'boss' ? 0.115 : 0.135; // seconds per 16th
    while (this.nextT < AC.currentTime + 0.2) { this.play(this.step, this.nextT, spb); this.nextT += spb; this.step++; }
  },
  play(s, t, spb) {
    const prog = this.progs[this.mode] || this.progs.calm;
    const bar = Math.floor(s / 16), chord = prog[bar % prog.length], st = s % 16, I = this.intensity;
    const bus = musG, delay = t - AC.currentTime;
    if (st === 0) { // pad
      for (const n of chord) tone({ type: 'triangle', f: this.mtof(n), d: spb * 16, v: 0.035, a: 0.6, lp: 900, bus, delay, detune: rand(-6, 6) });
      tone({ type: 'sine', f: this.mtof(chord[0] - 12), d: spb * 16, v: 0.05, a: 0.4, bus, delay });
    }
    if (I > 0.35 && (st === 0 || st === 6 || st === 8 || st === 14)) tone({ type: 'sawtooth', f: this.mtof(chord[0] - 24), d: spb * 2.2, v: 0.06 * I, lp: 320 + I * 300, bus, delay });
    if (I > 0.5) { const n = chord[[0, 1, 2, 1, 0, 2, 1, 2][st % 8]] + ((st >> 3) % 2 ? 12 : 0); if (st % 2 === 0 || I > 0.8) tone({ type: 'square', f: this.mtof(n + 12), d: spb * 0.9, v: 0.012 + 0.012 * I, lp: 1400 + I * 1200, bus, delay }); }
    if (I > 0.6 && st % 4 === 0) tone({ type: 'sine', f: 120, f2: 40, d: 0.18, v: 0.12 * I, bus, delay });
    if (I > 0.7 && st % 4 === 2) noise({ ft: 'highpass', f: 7000, d: 0.04, v: 0.02 * I, bus, delay });
    if (I > 0.85 && (st === 4 || st === 12)) noise({ ft: 'bandpass', f: 1800, d: 0.12, v: 0.05, bus, delay });

  },
  set(mode, intensity) { this.mode = mode; this.target = intensity; }
};

// --------------------------------------------------------------- input
const keys = {}, pressed = {};
const mouse = { x: 0, y: 0, l: false, r: false, clicked: false, rclicked: false, down: false, wheel: 0 };
addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (!keys[k]) pressed[k] = true; keys[k] = true;
  if ([' ', 'Tab', 'ArrowUp', 'ArrowDown'].includes(k)) e.preventDefault();
  initAudio();
});
addEventListener('keyup', e => { const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; keys[k] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.l = mouse.r = false; if (state === 'playing' && G && G.phase !== 'pick') state = 'paused'; });

// -------------------------------------------------------------- canvas
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 800, H = 600, DPR = 1, US = 1, ZOOM = 1;
const lightCv = document.createElement('canvas'), lctx = lightCv.getContext('2d');
let vignetteCv = null;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
  US = clamp(Math.min(W / 1280, H / 760), 0.55, 1.5);
  ZOOM = clamp(Math.min(W / 1500, H / 880), 0.5, 1.4);
  lightCv.width = Math.ceil(W / 2); lightCv.height = Math.ceil(H / 2);
  vignetteCv = document.createElement('canvas'); vignetteCv.width = 256; vignetteCv.height = 256;
  const v = vignetteCv.getContext('2d'); const g = v.createRadialGradient(128, 128, 60, 128, 128, 182);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.75)'); v.fillStyle = g; v.fillRect(0, 0, 256, 256);
}
addEventListener('resize', resize); resize();
cv.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
cv.addEventListener('mousedown', e => {
  initAudio(); mouse.x = e.clientX; mouse.y = e.clientY;
  if (e.button === 0) { mouse.l = true; mouse.clicked = true; }
  if (e.button === 2) { mouse.r = true; mouse.rclicked = true; }
});
addEventListener('mouseup', e => { if (e.button === 0) mouse.l = false; if (e.button === 2) mouse.r = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('wheel', e => { mouse.wheel += Math.sign(e.deltaY); }, { passive: true });

// ------------------------------------------------------------- sprites
const glowCache = {};
function glowSprite(color) {
  if (glowCache[color]) return glowCache[color];
  const s = 64, c = document.createElement('canvas'); c.width = c.height = s; const g = c.getContext('2d');
  const gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  gr.addColorStop(0, rgba(color, 1)); gr.addColorStop(0.2, rgba(color, 0.55)); gr.addColorStop(0.5, rgba(color, 0.16)); gr.addColorStop(1, rgba(color, 0));
  g.fillStyle = gr; g.fillRect(0, 0, s, s); return glowCache[color] = c;
}
function drawGlow(c, x, y, r, color, alpha = 1) {
  if (alpha <= 0 || r <= 0) return;
  c.globalAlpha = Math.min(1, alpha); c.drawImage(glowSprite(color), x - r, y - r, r * 2, r * 2); c.globalAlpha = 1;
}

// ----------------------------------------------------------- particles
const MAXP = 2200;
let parts = [], floaters = [];
function part(x, y, vx, vy, life, size, color, o) {
  if (parts.length >= MAXP) return null;
  const p = { x, y, vx, vy, life, max: life, size, color, drag: 3, type: 0, grow: 0, g: 0 };
  if (o) Object.assign(p, o); parts.push(p); return p;
}
function burst(x, y, color, n, speed = 200, size = 3, life = 0.6, o) {
  for (let i = 0; i < n; i++) { const a = rand(TAU), s = rand(0.2, 1) * speed; part(x, y, Math.cos(a) * s, Math.sin(a) * s, life * rand(0.6, 1.2), size * rand(0.6, 1.3), color, o); }
}
function sparks(x, y, color, n, speed = 300, ang = null, spread = TAU, life = 0.35) {
  for (let i = 0; i < n; i++) { const a = ang === null ? rand(TAU) : ang + rand(-spread / 2, spread / 2), s = rand(0.3, 1) * speed; part(x, y, Math.cos(a) * s, Math.sin(a) * s, life * rand(0.5, 1.2), rand(1, 2.2), color, { type: 1, drag: 4 }); }
}
function ringFx(x, y, color, r0, r1, life = 0.4, width = 3) { if (parts.length < MAXP) parts.push({ x, y, vx: 0, vy: 0, life, max: life, size: width, color, type: 2, r0, r1, drag: 0 }); }
function floatText(x, y, text, color, size = 14, life = 0.8, vy = -60) { if (floaters.length > 120) floaters.shift(); floaters.push({ x, y, text: String(text), color, size, life, max: life, vy, vx: rand(-20, 20) }); }
function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt;
    if (p.life <= 0) { parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
    const d = Math.exp(-p.drag * dt); p.vx *= d; p.vy *= d; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.size += p.grow * dt;
  }
  for (let i = floaters.length - 1; i >= 0; i--) { const f = floaters[i]; f.life -= dt; f.y += f.vy * dt; f.x += f.vx * dt; f.vy *= Math.exp(-3 * dt); if (f.life <= 0) floaters.splice(i, 1); }
}
function drawParts(c) {
  c.globalCompositeOperation = 'lighter';
  for (const p of parts) {
    const t = p.life / p.max;
    if (p.type === 0) { drawGlow(c, p.x, p.y, p.size * 3, p.color, t); }
    else if (p.type === 1) { c.strokeStyle = rgba(p.color, t); c.lineWidth = p.size; c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03); c.stroke(); }
    else if (p.type === 2) { const rr = p.r0 + (p.r1 - p.r0) * easeOut(1 - t); c.strokeStyle = rgba(p.color, t * 0.9); c.lineWidth = p.size * t + 0.5; c.beginPath(); c.arc(p.x, p.y, Math.max(0.1, rr), 0, TAU); c.stroke(); }
    else if (p.type === 3) { c.fillStyle = rgba(p.color, t); c.save(); c.translate(p.x, p.y); c.rotate(p.life * 8); c.fillRect(-p.size / 2, -p.size / 2, p.size, p.size); c.restore(); }
  }
  c.globalCompositeOperation = 'source-over';
}
function drawFloaters(c) {
  c.textAlign = 'center'; c.textBaseline = 'middle';
  for (const f of floaters) {
    const t = f.life / f.max, s = f.size * (t > 0.8 ? 1 + (t - 0.8) * 3 : 1);
    c.font = `800 ${s}px ${FONT}`; c.globalAlpha = Math.min(1, t * 2);
    c.lineWidth = 3; c.strokeStyle = 'rgba(0,0,0,0.7)'; c.strokeText(f.text, f.x, f.y);
    c.fillStyle = f.color; c.fillText(f.text, f.x, f.y);
  }
  c.globalAlpha = 1;
}
const FONT = '"Segoe UI", "Trebuchet MS", Roboto, Helvetica, Arial, sans-serif';

// wrap text into lines that fit a width
function wrapText(c, text, maxW) {
  const out = [];
  for (const para of String(text).split('\n')) {
    const words = para.split(' '); let line = '';
    for (const w of words) { const test = line ? line + ' ' + w : w; if (c.measureText(test).width > maxW && line) { out.push(line); line = w; } else line = test; }
    out.push(line);
  }
  return out;
}

const GRID = 90; const grid = new Map();
function buildGrid() {
  grid.clear();
  for (const e of G.enemies) {
    if (e.dead) continue;
    const k = (Math.floor(e.x / GRID) + 10) + (Math.floor(e.y / GRID) + 10) * 1000;
    let a = grid.get(k); if (!a) { a = []; grid.set(k, a); } a.push(e);
  }
}
function queryEnemies(x, y, r) {
  const out = [], x0 = Math.floor((x - r) / GRID), x1 = Math.floor((x + r) / GRID), y0 = Math.floor((y - r) / GRID), y1 = Math.floor((y + r) / GRID);
  for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++) {
    const a = grid.get((cx + 10) + (cy + 10) * 1000); if (!a) continue;
    for (const e of a) if (!e.dead) out.push(e);
  }
  return out;
}
function nearestEnemy(x, y, maxR, filter) {
  let best = null, bd = maxR * maxR;
  for (const e of G.enemies) { if (e.dead || e.spawning || (filter && !filter(e))) continue; const d = dist2(x, y, e.x, e.y); if (d < bd) { bd = d; best = e; } }
  return best;
}

function waveScale() { return 1 + 0.07 * Math.max(0, G.wave - 1); }
function cScale() { return G.p.cPow * G.p.dmgMult * waveScale(); }
function sScale() { return G.p.dmgMult * waveScale(); }
function playerDmgMult() {

  if (p.wrath) m *= 1 + 0.6 * (1 - p.hp / p.maxHp);
  if (p.rampage > 0) m *= 1.3;

function addShake(v) { G.shake = Math.min(28, G.shake + v * settings.shake); }
function pushOutCircle(o, cx, cy, cr) {
  const dx = o.x - cx, dy = o.y - cy, d = Math.hypot(dx, dy), m = o.r + cr;
  if (d < m && d > 0.001) { o.x = cx + dx / d * m; o.y = cy + dy / d * m; return true; }
  if (d <= 0.001) { o.x += m; return true; }

}

// ------------------------------------------------------------- player update
function updatePlayer(dt, rdt) {
  const p = G.p;
  const m = mouseWorld(); p.aim = angTo(p.x, p.y, m.x, m.y);
  let mx = (keys.d || keys.ArrowRight ? 1 : 0) - (keys.a || keys.ArrowLeft ? 1 : 0);
  let my = (keys.s || keys.ArrowDown ? 1 : 0) - (keys.w || keys.ArrowUp ? 1 : 0);
  const ml = Math.hypot(mx, my); if (ml) { mx /= ml; my /= ml; }
  let sp = p.speed;
  for (const z of G.zones) if (z.type === 'web' && dist2(p.x, p.y, z.x, z.y) < z.r * z.r) sp *= 0.5;
  // dash
  if ((pressed[' '] || pressed.Shift) && p.dashStock > 0 && p.dashT <= 0) {
    p.dashAng = ml ? Math.atan2(my, mx) : p.aim; p.dashT = 0.17; p.invuln = Math.max(p.invuln, p.dashInv);
    p.dashStock--; if (p.dashCdT <= 0) p.dashCdT = p.dashCd; p.dashHit = new Set();
    if (p.dashWill) { p.will = Math.min(p.maxWill, p.will + p.dashWill); }
    if (p.afterimage) G.decoys.push({ x: p.x, y: p.y, life: 2.5, max: 2.5 });
    sfx('dash'); sparks(p.x, p.y, p.color, 12, 300, p.dashAng + Math.PI, 1.2);
  }
  if (p.dashStock < p.dashCharges) { p.dashCdT -= dt; if (p.dashCdT <= 0) { p.dashStock++; p.dashCdT = p.dashStock < p.dashCharges ? p.dashCd : 0; } }
  if (p.dashT > 0) {
    p.dashT -= dt; const ds = 1150; p.vx = Math.cos(p.dashAng) * ds; p.vy = Math.sin(p.dashAng) * ds;
    part(p.x, p.y, 0, 0, 0.3, 9, p.color, { drag: 0 });
    if (p.dashDmg) for (const e of queryEnemies(p.x, p.y, 60)) {
      if (!p.dashHit.has(e.id) && dist2(p.x, p.y, e.x, e.y) < (e.r + p.r + 14) ** 2) { p.dashHit.add(e.id); damageEnemy(e, 45 * p.dashDmg * sScale(), { kb: p.dashAng, kf: 300, src: 'dash' }); sparks(e.x, e.y, p.color, 8); }
    }
    if (p.dashT <= 0) { p.vx *= 0.3; p.vy *= 0.3; }
  } else {
    const acc = 1 - Math.exp(-14 * dt); p.vx += (mx * sp - p.vx) * acc; p.vy += (my * sp - p.vy) * acc;
  }
  p.x += p.vx * dt; p.y += p.vy * dt;
  for (const o of G.obstacles) pushOutCircle(p, o.x, o.y, o.r);
  clampArena(p);

  if (G.time % 0.05 < dt) { p.trail.push({ x: p.x, y: p.y }); if (p.trail.length > 8) p.trail.shift(); }

  // timers & regen
  p.invuln -= dt; p.hurtT -= rdt; p.rampage -= dt; p.citadel -= dt;
  let wr = p.willRegen * (G.anomaly && G.anomaly.id === 'surge' ? 3 : 1);

  p.fireCd -= dt;

  // passive specials

    }
  }
  if (p.staticField) {

function updateAllies(dt) {
  const p = G.p;

    for (let i = 0; i < n; i++) {
      const a = G.time * 2.8 + i * TAU / n, wx = p.x + Math.cos(a) * 74, wy = p.y + Math.sin(a) * 74;
      for (const e of queryEnemies(wx, wy, 60)) {

      }
      for (const q of G.eproj) if (!q.dead && dist2(wx, wy, q.x, q.y) < (q.r + 10) ** 2) { q.dead = true; sparks(q.x, q.y, p.color, 4); }

    d.x = lerp(d.x, tx, 1 - Math.exp(-6 * dt)); d.y = lerp(d.y, ty, 1 - Math.exp(-6 * dt));
    d.cd -= dt;
    const t = nearestEnemy(d.x, d.y, 560);

    if (t && d.cd <= 0) { d.cd = 0.55; makeBolt(d.x, d.y, d.ang, { dmg: p.dmg * 0.65, r: 3.5, ally: true, homing: 0.5, color: '#ffffff', bounce: 0 }); }
  });

  // seeking spirits (violet ult)
  for (let i = G.spirits.length - 1; i >= 0; i--) {

    if (!s.target || s.target.dead) s.target = nearestEnemy(s.x, s.y, 1500);

    s.x += s.vx * dt; s.y += s.vy * dt; s.cd -= dt;
    part(s.x, s.y, 0, 0, 0.25, 6, p.color, { drag: 0 });
    if (s.target && s.cd <= 0 && dist2(s.x, s.y, s.target.x, s.target.y) < (s.target.r + 14) ** 2) {
      damageEnemy(s.target, s.dmg, { kb: a, kf: 300, src: 'ult' }); burst(s.x, s.y, p.color, 10, 250); s.hits--; s.cd = 0.2;
      s.vx = -s.vx * 0.6; s.vy = -s.vy * 0.6; sfx('hit');

function drawingInput() { return mouse.r || keys.e; }
function pathLen(pts) { let L = 0; for (let i = 1; i < pts.length; i++) L += dist(pts[i - 1].x, pts[i - 1].y, pts[i].x, pts[i].y); return L; }
function resample(pts, n) {
  const L = pathLen(pts); if (L === 0) return pts.slice(0, 1);
  const I = L / (n - 1); const out = [{ x: pts[0].x, y: pts[0].y }]; let D = 0;
  const src = pts.map(p => ({ x: p.x, y: p.y }));
  for (let i = 1; i < src.length; i++) {
    const d = dist(src[i - 1].x, src[i - 1].y, src[i].x, src[i].y);
    if (D + d >= I && d > 0) {
      const t = (I - D) / d, q = { x: src[i - 1].x + t * (src[i].x - src[i - 1].x), y: src[i - 1].y + t * (src[i].y - src[i - 1].y) };

}
function centroid(pts) { let x = 0, y = 0; for (const p of pts) { x += p.x; y += p.y; } return { x: x / pts.length, y: y / pts.length }; }

function classifyStroke(s) {
  const pts = s.pts; if (pts.length < 3 || s.len < 55) return null;
  const p = G.p, L = s.len, R = resample(pts, 40), a = R[0], b = R[R.length - 1], D = dist(a.x, a.y, b.x, b.y);
  let signed = 0;
  for (let i = 1; i < R.length - 1; i++) {
    const a1 = angTo(R[i - 1].x, R[i - 1].y, R[i].x, R[i].y), a2 = angTo(R[i].x, R[i].y, R[i + 1].x, R[i + 1].y);
    if ((R[i].x !== R[i - 1].x || R[i].y !== R[i - 1].y) && (R[i + 1].x !== R[i].x || R[i + 1].y !== R[i].y)) signed += angDiff(a1, a2);
  }

    if (Math.abs(angDiff(a1, a2)) > 1.05 && i - lastC > 3) { corners++; lastC = i; }
  }

  const c = centroid(R);
  if (Math.abs(signed) > TAU * 1.3 && L > 250) {
    type = 'vortex'; let ar = 0; for (const q of R) ar += dist(q.x, q.y, c.x, c.y); ar /= R.length;
    data.cx = c.x; data.cy = c.y; data.r = clamp(ar * 1.35, 140, 320) * (1 + 0.15 * p.vortexMod);
  } else if (D < Math.max(55, L * 0.2) && L > 170) {

    else { type = 'prison'; const area = polyArea(R); extra = area * 0.00011; data.cx = c.x; data.cy = c.y; }

    if (type === 'wall') extra = L * 0.022;

}

function updateStroke(rdt) {
  const p = G.p, want = drawingInput() && (G.phase === 'wave' || G.phase === 'cleared');
  if (want && !G.stroke) {
    const m = mouseWorld(); G.stroke = { pts: [m], len: 0, sx: p.x, sy: p.y, cls: null, t: 0 }; sfx('focus');
  }
  if (!G.stroke) return;
  const s = G.stroke; s.t += rdt;
  p.will = Math.max(0, p.will - p.focusDrain * rdt);
  const m = mouseWorld(), last = s.pts[s.pts.length - 1], d = dist(last.x, last.y, m.x, m.y);

}

function finishStroke() {

}

  sfx('lance', 0.05); addShake(free ? 2 : 7);
}

function pathAt(pts, s) {
  let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const d = dist(pts[i - 1].x, pts[i - 1].y, pts[i].x, pts[i].y);
    if (acc + d >= s) { const t = d ? (s - acc) / d : 0; return { x: lerp(pts[i - 1].x, pts[i].x, t), y: lerp(pts[i - 1].y, pts[i].y, t), a: angTo(pts[i - 1].x, pts[i - 1].y, pts[i].x, pts[i].y) }; }

}

function lightning(x1, y1, x2, y2, color, life = 0.25, jag = 18) {

  for (let i = 1; i < n; i++) { const t = i / n; pts.push({ x: lerp(x1, x2, t) + rand(-jag, jag), y: lerp(y1, y2, t) + rand(-jag, jag) }); }
  pts.push({ x: x2, y: y2 });

}

function updateConstructs(dt) {
  const p = G.p;
  for (let i = G.constructs.length - 1; i >= 0; i--) {
    const c = G.constructs[i]; c.life -= dt; if (c.flash) c.flash -= dt;
    switch (c.type) {
      case 'wall': {
        if (c.hp <= 0) { c.life = 0; burst((c.ax + c.bx) / 2, (c.ay + c.by) / 2, CONSTRUCTS.wall.color, 20, 250); sfx('block'); }
        break;
      }
      case 'aegis': {
        if (c.hp <= 0 || c.life <= 0) {
          c.life = 0; sfx('smallboom'); ringFx(p.x, p.y, CONSTRUCTS.aegis.color, c.r, c.r * 3, 0.5, 6);
          if (p.aegisNova) for (const e of queryEnemies(p.x, p.y, 260)) if (dist2(p.x, p.y, e.x, e.y) < 260 * 260) damageEnemy(e, 60 * p.aegisNova * cScale(), { kb: angTo(p.x, p.y, e.x, e.y), kf: 500, src: 'aegis' });
        }

        break;
      }
      case 'prison': {

        for (const q of G.eproj) if (!q.dead && pointInPoly(q.x, q.y, c.poly)) { q.dead = true; sparks(q.x, q.y, CONSTRUCTS.prison.color, 3); }
        if (c.life <= 0) {
          sfx('explode'); addShake(8);
          const hitSet = new Set(c.trapped);
          for (const e of G.enemies) if (!e.dead && pointInPoly(e.x, e.y, c.poly)) hitSet.add(e);
          for (const e of hitSet) if (!e.dead) { damageEnemy(e, c.boom, { kb: angTo(e.x, e.y, c.cx, c.cy), kf: 300, src: 'prison' }); }
          for (const q of c.poly) { part(q.x, q.y, (c.cx - q.x) * 3, (c.cy - q.y) * 3, 0.35, 4, CONSTRUCTS.prison.color, { drag: 1 }); }
          ringFx(c.cx, c.cy, CONSTRUCTS.prison.color, 10, 120, 0.4, 8);
        }
        break;
      }
      case 'storm': {

          const q = c.pts[randi(0, c.pts.length - 1)];
          const targets = queryEnemies(q.x, q.y, 110).filter(e => !e.spawning && dist2(q.x, q.y, e.x, e.y) < 110 * 110);
          const tgt = targets.length ? pick(targets) : null;
          const sx = tgt ? tgt.x : q.x + rand(-20, 20), sy = tgt ? tgt.y : q.y + rand(-20, 20);
          lightning(sx + rand(-60, 60), sy - 420, sx, sy, '#dfe6ff', 0.25, 26);
          ringFx(sx, sy, CONSTRUCTS.storm.color, 5, 75, 0.3, 4); sparks(sx, sy, '#dfe6ff', 8, 350);
          for (const e of queryEnemies(sx, sy, 80)) if (dist2(sx, sy, e.x, e.y) < (70 + e.r) ** 2) {
            damageEnemy(e, c.dmg, { src: 'storm' }); e.slowT = 0.8;
            if (c.chain) { const others = queryEnemies(e.x, e.y, 220).filter(o => o !== e).slice(0, 2); for (const o of others) { lightning(e.x, e.y, o.x, o.y, '#a8b8ff', 0.18); damageEnemy(o, c.dmg * 0.6, { src: 'storm' }); } }

          }
        }
        for (const pr of G.eproj) if (!pr.dead && dist2(q.x, q.y, pr.x, pr.y) < (44 + pr.r) ** 2) pr.dead = true;
        if ((c.dir > 0 && c.s >= c.L) || (c.dir < 0 && c.s <= 0)) {

        } else c.life = Math.max(c.life, 0.1);

        if (Math.random() < 0.8) { const a = rand(TAU), r = c.r * rand(0.5, 1.1); part(c.x + Math.cos(a) * r, c.y + Math.sin(a) * r, Math.cos(a + 1.9) * 300, Math.sin(a + 1.9) * 300, 0.5, 3, c.ult ? G.p.color : CONSTRUCTS.vortex.color, { drag: 2 }); }
        if (c.t >= c.dur) {

          ringFx(c.x, c.y, c.ult ? G.p.color : CONSTRUCTS.vortex.color, 10, c.r * 1.2, 0.6, 10); ringFx(c.x, c.y, '#ffffff', 10, c.r * 0.8, 0.4, 5);
          burst(c.x, c.y, c.ult ? G.p.color : CONSTRUCTS.vortex.color, 50, 500, 5, 0.9);
          for (const e of G.enemies) if (!e.dead && dist2(e.x, e.y, c.x, c.y) < (c.r * 1.2 + e.r) ** 2) damageEnemy(e, c.boom, { kb: angTo(c.x, c.y, e.x, e.y), kf: 600, src: 'vortex' });
          stain(c.x, c.y, c.r * 0.7, '#1a0830', 0.5);
        } else c.life = Math.max(c.life, 0.1);
        break;
      }
    }
    if (c.life <= 0) G.constructs.splice(i, 1);
  }
}

// =====================================================================
//  ENEMIES

function enemyHpMult() { const w = G.wave - 1; return G.D.hp * (1 + 0.11 * w + 0.0045 * w * w); }

function spawnEnemy(type, x, y, o = {}) {
  const d = ENEMIES[type];
  const e = {
    id: uid++, type, name: d.name, x, y, vx: 0, vy: 0, kx: 0, ky: 0, r: d.r, hp: d.hp * enemyHpMult(), speed: d.speed * rand(0.92, 1.08),
    dmg: d.dmg, color: d.color, value: d.value, t: rand(0, 2), state: 'move', stT: 0, flash: 0, slowT: 0, burn: 0, burnT: 0, rooted: 0,
    elite: null, shield: 0, maxShield: 0, gen: o.gen || 0, spawning: 0.35, wob: rand(TAU), shieldAng: 0, cd: rand(1, 2.5), wispCd: 0, isBoss: false,
  };

  if (o.gen) { e.r *= Math.pow(0.68, o.gen); e.hp *= Math.pow(0.42, o.gen); e.value = Math.max(1, Math.floor(e.value / 2)); }
  let eliteChance = 0.02 + G.wave * 0.006 + G.D.elite + (G.anomaly && G.anomaly.id === 'elitetide' ? 0.35 : 0);
  if (o.elite || (!o.noElite && G.wave >= 3 && type !== 'mote' && !o.gen && Math.random() < eliteChance)) makeElite(e, o.eliteMod);
  e.maxHp = e.hp;

}
function makeElite(e, mod) {
  const mods = Object.keys(ELITE_MODS); const m = mod || pick(mods);
  e.elite = m; e.hp *= 2.6; e.value *= 3; e.r *= 1.18;
  if (m === 'swift') e.speed *= 1.55;
  if (m === 'giant') { e.r *= 1.45; e.hp *= 1.6; e.speed *= 0.85; e.dmg *= 1.4; }
  if (m === 'shielded') { e.maxShield = e.shield = e.hp * 0.5; }
}

function damageEnemy(e, dmg, o = {}) {
  if (e.dead || e.spawning > 0.2 || e.invulnT > 0) return 0;
  const p = G.p;
  if (e.elite === 'armored') dmg *= 0.55;
  if ((e.elite || e.isBoss) && p.eliteDmg) dmg *= 1 + p.eliteDmg;
  if (p.execute && e.hp < e.maxHp * 0.3) dmg *= 2;
  if (G.anomaly && G.anomaly.id === 'glass') dmg *= 1.5;
  if (e.bossShield) dmg *= 0.25;
  if (e.shield > 0) { const ab = Math.min(e.shield, dmg); e.shield -= ab; dmg -= ab; e.shieldT = 3; if (dmg <= 0) { e.flash = 0.06; return ab; } }
  G.dmgDealt += Math.min(dmg, Math.max(0, e.hp)); e.hp -= dmg; e.flash = 0.08;
  if (e.isBoss) p.ult = Math.min(100, p.ult + dmg / e.maxHp * 45 * p.ultRate);
  if (o.kb !== undefined && o.kf) { const k = o.kf * (e.isBoss ? 0.08 : e.type === 'brute' ? 0.4 : 1) * (e.elite === 'giant' ? 0.5 : 1); e.kx += Math.cos(o.kb) * k; e.ky += Math.sin(o.kb) * k; }
  if (settings.numbers && !o.silent) floatText(e.x + rand(-8, 8), e.y - e.r - 4, Math.round(dmg), o.crit ? '#ffe45a' : '#ffffff', o.crit ? 17 : 12, 0.6);
  if (!o.silent) sfx(o.crit ? 'crit' : 'hit', 0.035);

}

function killEnemy(e, o = {}) {
  if (e.dead) return; e.dead = true;
  const p = G.p;
  if (e.isBoss) { bossDeath(e); return; }
  G.kills++; meta.kills++;
  G.combo++; G.comboT = 2.8; G.maxCombo = Math.max(G.maxCombo, G.combo);
  if (G.combo >= 50) unlockFeat('combo50'); if (G.combo >= 150) unlockFeat('combo150');
  const cm = 1 + Math.min(2, Math.floor(G.combo / 10) * 0.1);
  G.score += Math.round(e.value * 10 * cm * (1 + G.wave * 0.1));

  if (e.elite) { burst(e.x, e.y, '#ffd24d', 20, 350, 3, 0.8); ringFx(e.x, e.y, '#ffd24d', e.r, e.r * 4, 0.5, 4); G.hitstop = Math.max(G.hitstop, 0.05); addShake(5); }
  stain(e.x, e.y, e.r * 1.4, e.color, 0.18);

  const emb = (e.elite ? 5 : 0) + (Math.random() < 0.18 + e.value * 0.03 ? randi(1, Math.max(1, Math.ceil(e.value / 2))) : 0);
  for (let i = 0; i < emb; i++) dropPickup('ember', e.x, e.y);
  if (Math.random() < (e.elite ? 1 : 0.035)) dropPickup('hp', e.x, e.y);
  if (Math.random() < (e.elite ? 1 : 0.09 + e.value * 0.01)) dropPickup('will', e.x, e.y);
  if (e.bounty) { G.bountyKilled = true; floatText(e.x, e.y - 30, 'BOUNTY CLAIMED', '#ffe65a', 20, 1.5); sfx('legend'); }
  // on-death behaviours
  if (e.type === 'splitter' && e.gen < 2) for (let i = 0; i < 2; i++) { const c = spawnEnemy('splitter', e.x + rand(-10, 10), e.y + rand(-10, 10), { gen: e.gen + 1, noElite: true }); c.spawning = 0; c.kx = rand(-250, 250); c.ky = rand(-250, 250); }
  if (e.type === 'bomber') explode(e.x, e.y, 80, e.dmg * 0.6, true, e.name);
  if (e.elite === 'volatile') explode(e.x, e.y, 110, e.dmg, true, 'a Volatile elite');
  if (e.elite === 'haunted') for (let i = 0; i < 3; i++) { const m = spawnEnemy('mote', e.x, e.y, { noElite: true }); m.spawning = 0; m.kx = rand(-300, 300); m.ky = rand(-300, 300); }
  if (p.deathBoom && Math.random() < p.deathBoom) explode(e.x, e.y, 90, 0, false, '', 30 * sScale());
}

// generic explosion. hurtsPlayer: can damage player. dmgE: damage to enemies.
function explode(x, y, r, dmgP, hurtsPlayer, cause, dmgE) {
  if (dmgE === undefined) dmgE = 40 * waveScale();
  ringFx(x, y, '#ff8a3d', 10, r, 0.35, 6); burst(x, y, '#ff8a3d', 22, 330, 4, 0.5); burst(x, y, '#ffe07a', 8, 200, 3, 0.4);
  stain(x, y, r * 0.8, '#301000', 0.4); sfx('smallboom', 0.05); addShake(5);
  if (hurtsPlayer && dist2(x, y, G.p.x, G.p.y) < (r + G.p.r) ** 2) hurtPlayer(dmgP, cause, x, y);
  for (const e of queryEnemies(x, y, r + 30)) if (!e.dead && dist2(x, y, e.x, e.y) < (r + e.r) ** 2) damageEnemy(e, dmgE, { kb: angTo(x, y, e.x, e.y), kf: 300, src: 'boom' });
}

function enemyTarget(e) {
  let tx = G.p.x, ty = G.p.y;
  if (G.decoys.length) { let bd = dist2(e.x, e.y, tx, ty); for (const d of G.decoys) { const dd = dist2(e.x, e.y, d.x, d.y); if (dd < bd + 90000) { bd = dd; tx = d.x; ty = d.y; } } }
  return { x: tx, y: ty };
}
function steer(e, tx, ty, sp, dt, acc = 5) {
  const a = angTo(e.x, e.y, tx, ty); const k = 1 - Math.exp(-acc * dt);
  e.vx += (Math.cos(a) * sp - e.vx) * k; e.vy += (Math.sin(a) * sp - e.vy) * k;
}
function steerVel(e, vx, vy, dt, acc = 5) { const k = 1 - Math.exp(-acc * dt); e.vx += (vx - e.vx) * k; e.vy += (vy - e.vy) * k; }
function eShoot(x, y, a, sp, dmg, o = {}) {
  G.eproj.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: o.r || 7, dmg, life: o.life || 5, color: o.color || '#ff3d9a', type: o.type || 'orb', src: o.src || 'a Hollow bolt', t: 0, accel: o.accel || 0, curve: o.curve || 0 });
}

function updateEnemies(dt) {
  const p = G.p;
  const blood = G.anomaly && G.anomaly.id === 'bloodmoon';
  for (const e of G.enemies) {
    if (e.dead) continue;
    if (e.spawning > 0) { e.spawning = Math.max(0, e.spawning - dt); continue; }
    e.t += dt; e.flash -= dt; e.wispCd -= dt; e.slowT -= dt; e.rooted -= dt; e.invulnT = (e.invulnT || 0) - dt;
    if (e.burnT > 0) { e.burnT -= dt; damageEnemy(e, e.burn * dt, { silent: true, src: 'burn' }); if (Math.random() < 0.3) part(e.x + rand(-e.r, e.r), e.y + rand(-e.r, e.r), 0, -60, 0.4, 3, '#ff8a3d'); if (e.dead) continue; }
    if (e.elite === 'vampiric' && e.hp < e.maxHp) e.hp = Math.min(e.maxHp, e.hp + e.maxHp * 0.02 * dt);
    if (e.elite === 'shielded') { e.shieldT = (e.shieldT || 0) - dt; if (e.shieldT <= 0) e.shield = Math.min(e.maxShield, e.shield + e.maxShield * 0.25 * dt); }
    let sp = e.speed * (e.slowT > 0 ? 0.6 : 1);
    const tg = enemyTarget(e), dToP = dist(e.x, e.y, tg.x, tg.y), aToP = angTo(e.x, e.y, tg.x, tg.y);
    if (e.isBoss) updateBoss(e, dt, tg);
    else switch (e.type) {
      case 'mote': { const w = Math.sin(e.t * 6 + e.wob) * 0.6; steerVel(e, Math.cos(aToP + w) * sp, Math.sin(aToP + w) * sp, dt, 4); break; }
      case 'shade': steer(e, tg.x, tg.y, sp, dt, 4); break;
      case 'splitter': steer(e, tg.x, tg.y, sp * (1 + e.gen * 0.3), dt, 4); break;
      case 'spitter': {
        const want = dToP > 420 ? 1 : dToP < 300 ? -1 : 0, strafe = Math.sin(e.t * 0.8 + e.wob) > 0 ? 1 : -1;
        const a = aToP + (want === 0 ? strafe * Math.PI / 2 : want < 0 ? Math.PI : 0);
        steerVel(e, Math.cos(a) * sp, Math.sin(a) * sp, dt, 3);
        e.cd -= dt;
        if (e.cd <= 0 && dToP < 700) {
          e.cd = rand(2, 2.8) / (blood ? 1.3 : 1); const n = G.wave >= 12 ? 3 : 1;
          for (let k = 0; k < n; k++) eShoot(e.x, e.y, aToP + (k - (n - 1) / 2) * 0.22, 270, e.dmg, { src: 'a Spitter' });
          sfx('shot', 0.08);
        }
        break;
      }
      case 'bomber': {
        if (e.state === 'move') { steer(e, tg.x, tg.y, sp, dt, 5); if (dToP < 75) { e.state = 'prime'; e.stT = 0.55; sfx('warn', 0.1); } }
        else { e.vx *= 0.85; e.vy *= 0.85; e.stT -= dt; if (e.stT <= 0) { e.dead = true; explode(e.x, e.y, 95, e.dmg, true, 'a Bomber'); } }
        break;
      }
      case 'blinker': {
        e.cd -= dt;
        if (e.state === 'move') { steer(e, tg.x, tg.y, sp * 0.8, dt, 3); if (e.cd <= 0) { e.state = 'out'; e.stT = 0.4; } }
        else if (e.state === 'out') { e.vx = e.vy = 0; e.stT -= dt; if (e.stT <= 0) { const a = rand(TAU), r = rand(140, 200); e.x = clamp(tg.x + Math.cos(a) * r, 30, AW - 30); e.y = clamp(tg.y + Math.sin(a) * r, 30, AH - 30); e.state = 'in'; e.stT = 0.45; sparks(e.x, e.y, e.color, 10, 200); } }
        else if (e.state === 'in') { e.stT -= dt; if (e.stT <= 0) { e.state = 'move'; e.cd = rand(2.6, 3.4); const n = 5; for (let k = 0; k < n; k++) eShoot(e.x, e.y, aToP + (k - 2) * 0.2, 300, e.dmg * 0.8, { r: 5, src: 'a Blinker', color: '#5ab4ff' }); sfx('shot'); } }
        break;
      }
      case 'leech': {
        if (dToP > 150) steer(e, tg.x, tg.y, sp, dt, 4); else { const a = aToP + Math.PI / 2; steerVel(e, Math.cos(a) * sp * 0.6, Math.sin(a) * sp * 0.6, dt, 3); }
        const pd = dist(e.x, e.y, p.x, p.y);

        if (e.tether && pd > 280) { e.tether = false; sparks(lerp(e.x, p.x, 0.5), lerp(e.y, p.y, 0.5), e.color, 8, 200); }
        if (e.tether) { const dr = 11 * dt; p.will = Math.max(0, p.will - dr); e.hp = Math.min(e.maxHp, e.hp + dr * 2); }
        break;
      }
      case 'lancer': {
        if (e.state === 'move') {
          const want = dToP > 520 ? 1 : dToP < 360 ? -1 : 0; const a = aToP + (want === 0 ? Math.PI / 2 : want < 0 ? Math.PI : 0);
          steerVel(e, Math.cos(a) * sp, Math.sin(a) * sp, dt, 3); e.cd -= dt;
          if (e.cd <= 0 && dToP < 900) { e.state = 'aim'; e.stT = 1.1; e.aim = aToP; sfx('charge', 0.2); }
        } else if (e.state === 'aim') {
          e.vx *= 0.8; e.vy *= 0.8; e.stT -= dt; if (e.stT > 0.4) e.aim = angTo(e.x, e.y, p.x, p.y);
          if (e.stT <= 0) { e.state = 'move'; e.cd = rand(3, 4); eShoot(e.x, e.y, e.aim, 1250, e.dmg, { r: 6, type: 'needle', color: '#ffe65a', src: 'a Lancer', life: 1.5 }); sfx('lance', 0.1); }
        }
        break;
      }
      case 'warden': {
        steer(e, tg.x, tg.y, sp, dt, 3);

        break;
      }
      case 'brute': {

        else if (e.state === 'wind') { e.vx *= 0.85; e.vy *= 0.85; e.stT -= dt; e.aim += clamp(angDiff(e.aim, aToP), -2 * dt, 2 * dt); if (e.stT <= 0) { e.state = 'charge'; e.stT = 0.7; } }
        else if (e.state === 'charge') { e.vx = Math.cos(e.aim) * 680; e.vy = Math.sin(e.aim) * 680; e.stT -= dt; if (Math.random() < 0.6) part(e.x, e.y, 0, 0, 0.3, e.r * 0.5, e.color, { drag: 0 }); if (e.stT <= 0) { e.state = 'stun'; e.stT = 0.8; } }
        else if (e.state === 'stun') { e.vx *= 0.9; e.vy *= 0.9; e.stT -= dt; if (e.stT <= 0) { e.state = 'move'; e.cd = rand(2.5, 3.5); } }
        break;
      }
      case 'weaver': {
        const want = dToP > 480 ? 1 : dToP < 340 ? -1 : 0; const a = aToP + (want === 0 ? Math.PI / 2 : want < 0 ? Math.PI : 0);
        steerVel(e, Math.cos(a) * sp, Math.sin(a) * sp, dt, 2); e.cd -= dt;
        if (e.cd <= 0) { e.cd = rand(4, 5); for (let k = 0; k < 3; k++) { const aa = rand(TAU); G.portals.push({ x: e.x + Math.cos(aa) * 60, y: e.y + Math.sin(aa) * 60, t: 0.6, max: 0.6, type: 'mote', count: 1, small: true }); } sfx('portal', 0.2); }
        if (dToP < 200 && Math.random() < dt * 0.8) { const a2 = rand(TAU); sparks(e.x, e.y, e.color, 10); e.x = clamp(p.x + Math.cos(a2) * 450, 40, AW - 40); e.y = clamp(p.y + Math.sin(a2) * 450, 40, AH - 40); sparks(e.x, e.y, e.color, 10); }
        break;
      }
      case 'prism': {
        let tgt = null, lo = 1;
        for (const o of queryEnemies(e.x, e.y, 330)) { if (o === e || o.dead || o.isBoss) continue; const f = o.hp / o.maxHp; if (f < lo && dist2(e.x, e.y, o.x, o.y) < 330 * 330) { lo = f; tgt = o; } }
        e.healT = tgt;
        if (tgt) { tgt.hp = Math.min(tgt.maxHp, tgt.hp + (14 + G.wave) * dt * (tgt.elite ? 2 : 1)); steer(e, tgt.x + 120, tgt.y, sp * 0.6, dt, 2); }

    }

    if (!e.isBoss || e.contact !== false) if (dist2(e.x, e.y, p.x, p.y) < (e.r + p.r - 2) ** 2 && e.type !== 'bomber' && !(e.type === 'blinker' && e.state !== 'move')) {
      if (hurtPlayer(e.dmg * (e.state === 'charge' ? 1.5 : 1) * (blood ? 1.2 : 1), e.isBoss ? e.bossName : e.elite ? ELITE_MODS[e.elite].name + ' ' + e.name : 'a ' + e.name, e.x, e.y)) {
        if (e.elite === 'vampiric') e.hp = Math.min(e.maxHp, e.hp + e.maxHp * 0.1);

}

function updateEProj(dt) {
  const p = G.p;
  for (const q of G.eproj) {
    if (q.dead) continue;
    q.t += dt; q.life -= dt;
    if (q.accel) { const sp = Math.hypot(q.vx, q.vy), ns = sp + q.accel * dt, a = Math.atan2(q.vy, q.vx) + q.curve * dt; q.vx = Math.cos(a) * ns; q.vy = Math.sin(a) * ns; }
    else if (q.curve) { const sp = Math.hypot(q.vx, q.vy), a = Math.atan2(q.vy, q.vx) + q.curve * dt; q.vx = Math.cos(a) * sp; q.vy = Math.sin(a) * sp; }
    if (q.type === 'mine') {
      q.vx *= Math.exp(-3 * dt); q.vy *= Math.exp(-3 * dt);
      if ((q.t > 0.8 && dist2(q.x, q.y, p.x, p.y) < 90 * 90) || q.life <= 0) {
        q.dead = true; ringFx(q.x, q.y, q.color, 5, 60, 0.3, 4); sfx('smallboom', 0.08);
        for (let k = 0; k < 8; k++) eShoot(q.x, q.y, k * TAU / 8 + q.t, 230, q.dmg * 0.7, { r: 6, src: q.src });
        continue;
      }
    }
    q.x += q.vx * dt; q.y += q.vy * dt;
    if (q.life <= 0 || q.x < -40 || q.y < -40 || q.x > AW + 40 || q.y > AH + 40) { q.dead = true; continue; }
    for (const o of G.obstacles) if (dist2(q.x, q.y, o.x, o.y) < (o.r + q.r) ** 2) { q.dead = true; sparks(q.x, q.y, q.color, 3, 120); }
    if (q.dead) continue;
    for (const c of G.constructs) {
      if (c.type !== 'wall') continue;
      if (segDist2(q.x, q.y, c.ax, c.ay, c.bx, c.by).d2 < (q.r + 6) ** 2) {
        q.dead = true; c.hp -= q.dmg; c.flash = 0.1; sparks(q.x, q.y, CONSTRUCTS.wall.color, 5, 200);
        if (c.mirror) { const a = Math.atan2(-q.vy, -q.vx) + rand(-0.2, 0.2); makeBolt(q.x, q.y, a, { dmg: p.dmg * 1.5 + q.dmg, r: 5, color: CONSTRUCTS.wall.color }); }

  }

// ------------------------------------------------------------- hazards / zones / shocks / beams
function updateHazards(dt) {
  const p = G.p;
  for (let i = G.zones.length - 1; i >= 0; i--) {
    const z = G.zones[i]; z.life -= dt;
    if (z.type === 'fire') { for (const e of queryEnemies(z.x, z.y, z.r + 30)) if (dist2(z.x, z.y, e.x, e.y) < (z.r + e.r) ** 2) damageEnemy(e, z.dps * dt, { silent: true, src: 'fire' }); if (Math.random() < 0.3) part(z.x + rand(-z.r, z.r) * 0.7, z.y + rand(-z.r, z.r) * 0.7, 0, -50, 0.5, 3, '#ffb13d'); }
    if (z.type === 'rift') {
      z.warn -= dt;
      if (z.warn <= 0) { if (!z.active) { z.active = true; sfx('smallboom', 0.1); ringFx(z.x, z.y, '#c05aff', 10, z.r, 0.3, 5); } if (dist2(z.x, z.y, p.x, p.y) < (z.r + p.r) ** 2) hurtPlayer(12, 'a Rift'); for (const e of queryEnemies(z.x, z.y, z.r)) if (dist2(z.x, z.y, e.x, e.y) < z.r * z.r) damageEnemy(e, 20 * dt * waveScale(), { silent: true, src: 'rift' }); }

    const s = G.shocks[i]; s.r += s.speed * dt;

    if (s.r > s.maxR) G.shocks.splice(i, 1);

  for (let i = G.beams.length - 1; i >= 0; i--) {

    G.riftT -= dt;
    if (G.riftT <= 0) { G.riftT = rand(1.2, 2.2); const a = rand(TAU), r = rand(0, 350); G.zones.push({ type: 'rift', x: clamp(p.x + Math.cos(a) * r, 60, AW - 60), y: clamp(p.y + Math.sin(a) * r, 60, AH - 60), r: rand(55, 85), warn: 1.2, life: 4, max: 4 }); }

// ------------------------------------------------------------- pickups
function dropPickup(type, x, y) {
  const a = rand(TAU), s = rand(80, 220);
  G.pickups.push({ type, x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 22, t: 0, mag: false });
}
function updatePickups(dt) {
  const p = G.p, R = p.pickupRange;
  for (let i = G.pickups.length - 1; i >= 0; i--) {
    const k = G.pickups[i]; k.t += dt; k.life -= dt;
    const d = dist(k.x, k.y, p.x, p.y);
    if (k.t > 0.35 && (d < R || G.phase === 'cleared' || k.mag)) k.mag = true;
    if (k.mag) { const a = angTo(k.x, k.y, p.x, p.y), sp = 500 + k.t * 200; k.vx = lerp(k.vx, Math.cos(a) * sp, 0.2); k.vy = lerp(k.vy, Math.sin(a) * sp, 0.2); }
    else { k.vx *= Math.exp(-4 * dt); k.vy *= Math.exp(-4 * dt); }
    k.x += k.vx * dt; k.y += k.vy * dt;

// =====================================================================
//  BOSSES
// =====================================================================
function spawnBoss(def, cycle) {
  const hpm = G.D.hp * (1 + 0.6 * cycle) * (G.endless ? 1 + 0.03 * G.wave : 1);
  const mk = (x, y, color, twinIdx) => {
    const e = spawnEnemy('shade', x, y, { noElite: true });
    Object.assign(e, { isBoss: true, bossDef: def, bossName: def.name, name: def.name, r: def.r, hp: def.hp * hpm, maxHp: def.hp * hpm, speed: def.speed, dmg: 22 * (1 + 0.3 * cycle), color, value: 60,
      phase: 0, pat: null, patT: 0, idle: 2, twinIdx, spawning: 1.2, patQueue: [] });
    return e;
  };
  G.bosses = [];
  if (def.twin) { G.bosses.push(mk(AW / 2 - 250, AH / 2 - 260, def.color, 0)); G.bosses.push(mk(AW / 2 + 250, AH / 2 - 260, def.color2, 1)); }
  else G.bosses.push(mk(AW / 2, AH / 2 - 300, def.color));
  G.bossDef = def;
  G.announce = { title: def.name, sub: def.sub, t: 0, dur: 3.2, color: def.color, boss: true };
  sfx('boss'); addShake(14); Music.set('boss', 1);
  for (const b of G.bosses) ringFx(b.x, b.y, def.color, 10, 300, 1, 10);
}

function bossPhase(e) {
  const f = e.hp / e.maxHp, th = e.bossDef.thresholds; let ph = 0;
  for (let i = 0; i < th.length; i++) if (f < th[i]) ph = i + 1;
  if (e.bossDef.twin && G.bosses.filter(b => !b.dead).length === 1) ph = Math.max(ph, 1);
  return Math.min(ph, e.bossDef.phases.length - 1);
}

function updateBoss(e, dt, tg) {
  const p = G.p, def = e.bossDef;
  const ph = bossPhase(e);
  if (ph !== e.phase) {
    e.phase = ph; e.pat = null; e.idle = 1.2; e.invulnT = 1.0;
    floatText(e.x, e.y - e.r - 30, ph === 2 ? 'FINAL FORM' : 'ENRAGED', e.color, 24, 1.6); sfx('boss'); addShake(12);
    ringFx(e.x, e.y, e.color, e.r, e.r * 6, 0.8, 10); G.eproj.length = 0;
    if (def.final && ph === 2) G.forcedDark = 0.8;
  }
  const enr = 1 + ph * 0.25 + (def.twin && G.bosses.filter(b => !b.dead).length === 1 ? 0.35 : 0);
  if (!e.pat) {
    e.idle -= dt;
    // idle movement: drift around target at range
    const d = dist(e.x, e.y, tg.x, tg.y), a = angTo(e.x, e.y, tg.x, tg.y);
    const want = d > 380 ? a : d < 240 ? a + Math.PI : a + Math.PI / 2 * (e.twinIdx ? -1 : 1);
    steerVel(e, Math.cos(want) * e.speed * enr, Math.sin(want) * e.speed * enr, dt, 2);
    if (def.twin) { // twins orbit each other
      const o = G.bosses.find(b => b !== e && !b.dead);
      if (o && dist(e.x, e.y, o.x, o.y) > 520) steer(e, o.x, o.y, e.speed, dt, 1);
    }
    if (e.idle <= 0) {
      if (!e.patQueue.length) e.patQueue = shuffle(def.phases[e.phase][0].slice());
      startPattern(e, e.patQueue.pop(), enr);
    }
  } else {
    const done = runPattern(e, dt, enr, tg);
    if (done) { e.pat = null; e.idle = rand(0.7, 1.3) / enr; }
  }
  // twin link beam
  if (def.twin && e.twinIdx === 0) {
    const o = G.bosses.find(b => b !== e && !b.dead);
    if (o && !e.spawning && !o.spawning && segDist2(p.x, p.y, e.x, e.y, o.x, o.y).d2 < (10 + p.r) ** 2) hurtPlayer(14, 'the Eclipse Link');
  }
}

function startPattern(e, name, enr) {
  e.pat = name; e.patT = 0; e.step = 0; e.pd = {};
  switch (name) {
    case 'charge': e.pd.aim = angTo(e.x, e.y, G.p.x, G.p.y); e.pd.n = e.phase ? 3 : 2; G.teles.push({ type: 'line', x: e.x, y: e.y, a: e.pd.aim, len: 900, w: e.r * 2, life: 0.8, max: 0.8, color: e.color, owner: e }); sfx('charge'); break;
    case 'laser': {
      const n = e.bossDef.id === 'unlight' ? 3 : e.phase ? 2 : 1, base = angTo(e.x, e.y, G.p.x, G.p.y) + 0.9, rot = (Math.random() < 0.5 ? 1 : -1) * 0.75 * enr;
      for (let k = 0; k < n; k++) G.beams.push({ owner: e, x: e.x, y: e.y, ang: base + k * TAU / n, rot, len: 1500, w: 26, warn: 1.1, dur: 3.2, t: 0, dmg: 20, color: e.color, src: e.bossName + "'s beam" });
      sfx('charge'); break;
    }
    case 'slam': e.pd.tx = G.p.x; e.pd.ty = G.p.y; e.pd.sx = e.x; e.pd.sy = e.y; G.teles.push({ type: 'circle', x: G.p.x, y: G.p.y, r: e.r + 40, life: 0.9, max: 0.9, color: e.color }); sfx('charge'); break;
    case 'teleport': e.pd.done = false; break;
    case 'pull': sfx('vortex'); break;
    case 'webs': for (let k = 0; k < 5; k++) G.zones.push({ type: 'web', x: clamp(G.p.x + rand(-450, 450), 80, AW - 80), y: clamp(G.p.y + rand(-350, 350), 80, AH - 80), r: rand(80, 130), life: 9, max: 9 }); sfx('prison'); break;
  }
}

// returns true when pattern complete
function runPattern(e, dt, enr, tg) {
  const p = G.p; e.patT += dt; const T = e.patT, d = e.pd;
  const aim = angTo(e.x, e.y, p.x, p.y), src = e.bossName, dmg = 14 * (1 + 0.05 * G.wave);
  e.vx *= Math.exp(-4 * dt); e.vy *= Math.exp(-4 * dt);
  switch (e.pat) {
    case 'ring': {
      const waves = 3 + e.phase, gap = 0.55 / enr;
      if (T > e.step * gap && e.step < waves) { const n = 16 + e.phase * 4; for (let k = 0; k < n; k++) eShoot(e.x, e.y, k * TAU / n + e.step * 0.2, 220 * (0.9 + 0.1 * enr), dmg, { r: 8, src, color: e.color }); e.step++; sfx('shot'); ringFx(e.x, e.y, e.color, e.r, e.r + 30, 0.3, 4); }
      return e.step >= waves && T > waves * gap + 0.3;

function rollCards(n) {
