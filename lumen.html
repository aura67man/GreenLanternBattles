  // border
  const pulse = 0.5 + 0.2 * Math.sin(G.time * 2);
  c.strokeStyle = rgba(col, 0.15 * pulse); c.lineWidth = 26; c.strokeRect(-13, -13, AW + 26, AH + 26);
  c.strokeStyle = rgba(col, 0.7 * pulse + 0.2); c.lineWidth = 3; c.strokeRect(0, 0, AW, AH);
}

function drawObstacle(c, o) {
  const g = c.createLinearGradient(o.x - o.r, o.y - o.r, o.x + o.r, o.y + o.r);
  g.addColorStop(0, '#2a3048'); g.addColorStop(1, '#0c0e18');
  c.fillStyle = 'rgba(0,0,0,0.45)'; poly(c, o.x + 8, o.y + 12, o.r, o.sides, o.seed); c.fill();
  c.fillStyle = g; poly(c, o.x, o.y, o.r, o.sides, o.seed); c.fill();
  c.strokeStyle = rgba(G.p.color, 0.35); c.lineWidth = 2; c.stroke();
  c.strokeStyle = 'rgba(255,255,255,0.08)'; c.lineWidth = 1; poly(c, o.x, o.y, o.r * 0.6, o.sides, o.seed + 0.3); c.stroke();
  const gl = 0.3 + 0.25 * Math.sin(G.time * 1.3 + o.seed);
  c.globalCompositeOperation = 'lighter'; drawGlow(c, o.x, o.y, o.r * 0.5, G.p.color, gl * 0.4); c.globalCompositeOperation = 'source-over';
}

function drawZones(c, v) {
  for (const z of G.zones) {
    if (!inView(z.x, z.y, z.r, v)) continue;
    const t = z.life / z.max;
    if (z.type === 'fire') { c.globalCompositeOperation = 'lighter'; drawGlow(c, z.x, z.y, z.r * 1.4, '#ff7a2a', 0.5 * Math.min(1, t * 3)); c.globalCompositeOperation = 'source-over'; }
    else if (z.type === 'rift') {
      if (z.warn > 0) { c.strokeStyle = rgba('#c05aff', 0.5 + 0.4 * Math.sin(G.time * 20)); c.setLineDash([8, 8]); c.lineWidth = 2; c.beginPath(); c.arc(z.x, z.y, z.r * (1 - z.warn / 1.2 * 0.3), 0, TAU); c.stroke(); c.setLineDash([]); }
      else { c.fillStyle = rgba('#3a0a5a', 0.55 * Math.min(1, z.life)); c.beginPath(); c.arc(z.x, z.y, z.r, 0, TAU); c.fill(); c.globalCompositeOperation = 'lighter'; drawGlow(c, z.x, z.y, z.r * 1.3, '#c05aff', 0.5 * Math.min(1, z.life)); c.globalCompositeOperation = 'source-over'; }
    } else if (z.type === 'web') {
      c.strokeStyle = `rgba(200,220,180,${0.25 * Math.min(1, z.life)})`; c.lineWidth = 1.2;
      c.beginPath(); for (let k = 0; k < 8; k++) { const a = k * TAU / 8; c.moveTo(z.x, z.y); c.lineTo(z.x + Math.cos(a) * z.r, z.y + Math.sin(a) * z.r); } c.stroke();
      for (let r = z.r / 3; r <= z.r; r += z.r / 3) { poly(c, z.x, z.y, r, 8, 0); c.stroke(); }
      c.fillStyle = `rgba(200,220,180,${0.05 * Math.min(1, z.life)})`; c.beginPath(); c.arc(z.x, z.y, z.r, 0, TAU); c.fill();
    }
  }
  for (const t of G.teles) {
    const k = 1 - t.life / t.max;
    if (t.type === 'line') {
      const x = t.owner ? t.owner.x : t.x, y = t.owner ? t.owner.y : t.y;
      c.save(); c.translate(x, y); c.rotate(t.a);
      c.fillStyle = rgba(t.color, 0.08 + 0.12 * k); c.fillRect(0, -t.w / 2, t.len, t.w);
      c.fillStyle = rgba(t.color, 0.4 + 0.4 * k); c.fillRect(0, -1, t.len * k, 2); c.restore();
    } else if (t.type === 'circle') {
      c.strokeStyle = rgba(t.color, 0.7); c.lineWidth = 2; c.beginPath(); c.arc(t.x, t.y, t.r, 0, TAU); c.stroke();
      c.fillStyle = rgba(t.color, 0.25); c.beginPath(); c.arc(t.x, t.y, t.r * k, 0, TAU); c.fill();
    }
  }
  for (const pt of G.portals) {
    const k = 1 - pt.t / pt.max, col = ENEMIES[pt.type].color, r = (pt.small ? 16 : 34) * (0.4 + 0.6 * k);
    c.globalCompositeOperation = 'lighter'; drawGlow(c, pt.x, pt.y, r * 2.2, col, 0.6);
    c.strokeStyle = rgba(col, 0.9); c.lineWidth = 2.5;
    for (let i = 0; i < 3; i++) { c.beginPath(); c.arc(pt.x, pt.y, r * (0.5 + i * 0.25), G.time * (4 + i) + i, G.time * (4 + i) + i + 3.6); c.stroke(); }
    c.globalCompositeOperation = 'source-over';
    c.fillStyle = '#000'; c.beginPath(); c.arc(pt.x, pt.y, r * 0.4, 0, TAU); c.fill();
    if (pt.bounty) { c.fillStyle = '#ffe65a'; c.font = `900 14px ${FONT}`; c.textAlign = 'center'; c.fillText('★', pt.x, pt.y - r - 10); }
  }
}

function drawPickups(c, v) {
  c.globalCompositeOperation = 'lighter';
  for (const k of G.pickups) {
    if (!inView(k.x, k.y, 20, v)) continue;
    const blink = k.life < 4 && Math.sin(k.life * 20) > 0 ? 0.3 : 1, bob = Math.sin(k.t * 5) * 2;
    if (k.type === 'hp') { drawGlow(c, k.x, k.y + bob, 22, '#ff4d6a', 0.8 * blink); c.fillStyle = rgba('#ffd0d8', blink); c.fillRect(k.x - 6, k.y + bob - 2, 12, 4); c.fillRect(k.x - 2, k.y + bob - 6, 4, 12); }
    else if (k.type === 'will') { drawGlow(c, k.x, k.y + bob, 20, '#3dc2ff', 0.8 * blink); c.fillStyle = rgba('#d0f0ff', blink); poly(c, k.x, k.y + bob, 6, 4, G.time * 2); c.fill(); }
    else { drawGlow(c, k.x, k.y + bob, 12, '#ffa53d', 0.9 * blink); c.fillStyle = rgba('#fff0c0', blink); star(c, k.x, k.y + bob, 4, 1.5, 4, k.t * 3); c.fill(); }
  }
  c.globalCompositeOperation = 'source-over';
}

function drawConstructs(c) {
  const p = G.p;
  for (const k of G.constructs) {
    const t = k.max ? k.life / k.max : 1;
    switch (k.type) {
      case 'wall': {
        const col = CONSTRUCTS.wall.color, blink = k.life < 1.2 && Math.sin(k.life * 25) > 0 ? 0.4 : 1, hpf = k.hp / k.maxHp;
        c.lineCap = 'round';
        c.globalCompositeOperation = 'lighter';
        c.strokeStyle = rgba(col, 0.18 * blink); c.lineWidth = 26; c.beginPath(); c.moveTo(k.ax, k.ay); c.lineTo(k.bx, k.by); c.stroke();
        c.strokeStyle = rgba(k.flash > 0 ? '#ffffff' : col, (0.5 + 0.4 * hpf) * blink); c.lineWidth = 10; c.stroke();
        c.strokeStyle = rgba('#ffffff', 0.8 * blink); c.lineWidth = 2.5; c.stroke();
        if (k.thorn) { const n = Math.floor(dist(k.ax, k.ay, k.bx, k.by) / 22), a = angTo(k.ax, k.ay, k.bx, k.by) + Math.PI / 2; c.strokeStyle = rgba(col, 0.8 * blink); c.lineWidth = 2; c.beginPath(); for (let i = 0; i <= n; i++) { const x = lerp(k.ax, k.bx, i / n), y = lerp(k.ay, k.by, i / n); c.moveTo(x - Math.cos(a) * 14, y - Math.sin(a) * 14); c.lineTo(x + Math.cos(a) * 14, y + Math.sin(a) * 14); } c.stroke(); }
        c.globalCompositeOperation = 'source-over'; c.lineCap = 'butt';
        break;
      }
      case 'aegis': {
        const col = CONSTRUCTS.aegis.color, hpf = k.hp / k.maxHp, blink = k.life < 1.2 && Math.sin(k.life * 25) > 0 ? 0.4 : 1;
        c.globalCompositeOperation = 'lighter';
        c.fillStyle = rgba(col, 0.07 * blink); c.beginPath(); c.arc(p.x, p.y, k.r, 0, TAU); c.fill();
        c.strokeStyle = rgba(k.flash > 0 ? '#ffffff' : col, (0.4 + 0.5 * hpf) * blink); c.lineWidth = 3; c.stroke();
        c.lineWidth = 2; for (let i = 0; i < 3; i++) { const a = G.time * 2 + i * TAU / 3; c.beginPath(); c.arc(p.x, p.y, k.r + 5, a, a + 1.2 * hpf); c.stroke(); }
        c.globalCompositeOperation = 'source-over'; break;
      }
      case 'prison': {
        const col = CONSTRUCTS.prison.color, pulse = 0.5 + 0.5 * Math.sin(G.time * (8 + 20 * (1 - t)));
        c.beginPath(); k.poly.forEach((q, i) => i ? c.lineTo(q.x, q.y) : c.moveTo(q.x, q.y)); c.closePath();
        c.fillStyle = rgba(col, 0.08 + 0.08 * pulse); c.fill();
        c.globalCompositeOperation = 'lighter';
        c.strokeStyle = rgba(col, 0.7 + 0.3 * pulse); c.lineWidth = 4; c.setLineDash([14, 8]); c.lineDashOffset = -G.time * 60; c.stroke(); c.setLineDash([]);
        c.strokeStyle = rgba(col, 0.25); c.lineWidth = 1.5; c.beginPath(); for (let i = 0; i < k.poly.length; i += 3) { c.moveTo(k.poly[i].x, k.poly[i].y); c.lineTo(k.cx, k.cy); } c.stroke();
        c.globalCompositeOperation = 'source-over';
        for (const e of k.trapped) if (!e.dead && !e.isBoss) { c.strokeStyle = rgba(col, 0.8); c.lineWidth = 2; c.beginPath(); c.arc(e.x, e.y, e.r + 6, 0, TAU); c.stroke(); }
        break;
      }
      case 'storm': {
        c.strokeStyle = rgba(CONSTRUCTS.storm.color, 0.3 * Math.min(1, k.left / 3 + 0.2)); c.lineWidth = 3; c.setLineDash([6, 10]);
        c.beginPath(); k.pts.forEach((q, i) => i ? c.lineTo(q.x, q.y) : c.moveTo(q.x, q.y)); c.stroke(); c.setLineDash([]);
        break;
      }
      case 'scythe': {
        if (k.x === undefined) break;
        const col = CONSTRUCTS.scythe.color;
        c.globalCompositeOperation = 'lighter';
        k.trail.forEach((q, i) => drawGlow(c, q.x, q.y, 30 * i / k.trail.length, col, 0.3 * i / k.trail.length));
        c.save(); c.translate(k.x, k.y); c.rotate(G.time * 25);
        c.strokeStyle = rgba(col, 0.95); c.lineWidth = 5; c.beginPath(); c.arc(0, 0, 38, 0, 2.2); c.stroke();
        c.strokeStyle = '#ffffff'; c.lineWidth = 2; c.beginPath(); c.arc(0, 0, 38, 0.3, 1.9); c.stroke();
        c.strokeStyle = rgba(col, 0.95); c.lineWidth = 5; c.beginPath(); c.arc(0, 0, 38, Math.PI, Math.PI + 2.2); c.stroke();
        c.restore(); drawGlow(c, k.x, k.y, 55, col, 0.7);
        c.globalCompositeOperation = 'source-over'; break;
      }
      case 'vortex': {
        const col = k.ult ? p.color : CONSTRUCTS.vortex.color, g = Math.min(1, k.t * 3);
        c.fillStyle = `rgba(4,0,12,${0.5 * g})`; c.beginPath(); c.arc(k.x, k.y, k.r * 0.35 * (0.6 + 0.4 * k.t / k.dur), 0, TAU); c.fill();
        c.globalCompositeOperation = 'lighter';
        c.strokeStyle = rgba(col, 0.25 * g); c.lineWidth = 2; c.beginPath(); c.arc(k.x, k.y, k.r, 0, TAU); c.stroke();
        for (let arm = 0; arm < 4; arm++) {
          c.strokeStyle = rgba(col, 0.6 * g); c.lineWidth = 3; c.beginPath();
          for (let s = 0; s <= 30; s++) { const f = s / 30, a = arm * TAU / 4 - k.t * 6 + f * 4.5, r = k.r * (1 - f) + 8; s ? c.lineTo(k.x + Math.cos(a) * r, k.y + Math.sin(a) * r) : c.moveTo(k.x + Math.cos(a) * r, k.y + Math.sin(a) * r); }
          c.stroke();
        }
        drawGlow(c, k.x, k.y, k.r * 0.6, col, 0.5 * g);
        c.globalCompositeOperation = 'source-over'; break;
      }
      case 'lance': {
        const col = CONSTRUCTS.lance.color;
        c.lineCap = 'round'; c.globalCompositeOperation = 'lighter';
        c.strokeStyle = rgba(col, 0.25 * t); c.lineWidth = k.w * 2.2 * (1.3 - t * 0.3); c.beginPath(); c.moveTo(k.x, k.y); c.lineTo(k.bx, k.by); c.stroke();
        c.strokeStyle = rgba(col, 0.8 * t); c.lineWidth = k.w * t; c.stroke();
        c.strokeStyle = rgba('#ffffff', t); c.lineWidth = k.w * 0.35 * t; c.stroke();
        c.globalCompositeOperation = 'source-over'; c.lineCap = 'butt'; break;
      }
      case 'bolt': {
        c.globalCompositeOperation = 'lighter'; c.lineJoin = 'round';
        c.strokeStyle = rgba(k.color, 0.35 * t); c.lineWidth = 8; c.beginPath(); k.pts.forEach((q, i) => i ? c.lineTo(q.x, q.y) : c.moveTo(q.x, q.y)); c.stroke();
        c.strokeStyle = rgba('#ffffff', t); c.lineWidth = 2; c.stroke();
        c.globalCompositeOperation = 'source-over'; break;
      }
    }
  }
}

function drawHazardsTop(c) {
  for (const s of G.shocks) {
    c.globalCompositeOperation = 'lighter';
    c.strokeStyle = rgba(s.color, 0.8); c.lineWidth = s.w * 1.4; c.beginPath(); c.arc(s.x, s.y, Math.max(1, s.r), 0, TAU); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,0.7)'; c.lineWidth = 2; c.stroke();
    c.globalCompositeOperation = 'source-over';
  }
  for (const b of G.beams) {
    const len = b.cur || b.len, ex = b.x + Math.cos(b.ang) * len, ey = b.y + Math.sin(b.ang) * len;
    c.lineCap = 'round';
    if (b.t < b.warn) { c.strokeStyle = rgba(b.color, 0.25 + 0.3 * Math.sin(b.t * 30)); c.lineWidth = 2; c.setLineDash([12, 10]); c.beginPath(); c.moveTo(b.x, b.y); c.lineTo(ex, ey); c.stroke(); c.setLineDash([]); }
    else if (b.t < b.warn + b.dur) {
      c.globalCompositeOperation = 'lighter';
      c.strokeStyle = rgba(b.color, 0.3); c.lineWidth = b.w * 2.2; c.beginPath(); c.moveTo(b.x, b.y); c.lineTo(ex, ey); c.stroke();
      c.strokeStyle = rgba(b.color, 0.9); c.lineWidth = b.w; c.stroke();
      c.strokeStyle = '#ffffff'; c.lineWidth = b.w * 0.3; c.stroke();
      drawGlow(c, ex, ey, 50, b.color, 0.8);
      c.globalCompositeOperation = 'source-over';
    }
    c.lineCap = 'butt';
  }
}

// ------------------------------------------------------------- enemies
function drawEnemy(c, e) {
  const sp = e.spawning > 0 ? 1 - e.spawning / 0.35 : 1;
  if (sp <= 0) return;
  let alpha = sp;
  if (e.type === 'blinker') { if (e.state === 'out') alpha = e.stT / 0.4; else if (e.state === 'in') alpha = 1 - e.stT / 0.45 * 0.7; }
  if (e.fade) alpha *= 1 - e.fade;
  if (alpha <= 0.02) return;
  const r = e.r * (e.spawning > 0 ? easeOutBack(sp) : 1);
  const aP = angTo(e.x, e.y, G.p.x, G.p.y);
  const col = e.color, body = e.flash > 0 ? '#ffffff' : '#120a1c';
  const air = e.air || 0;
  // shadow
  c.fillStyle = `rgba(0,0,0,${0.35 * alpha})`; c.beginPath(); c.ellipse(e.x, e.y + r * 0.8 + air * 30, r * (1 - air * 0.3), r * 0.35, 0, 0, TAU); c.fill();
  const y = e.y - air * 90;
  c.globalAlpha = alpha;
  c.globalCompositeOperation = 'lighter'; drawGlow(c, e.x, y, r * 2.4, col, 0.35 + (e.elite ? 0.2 : 0)); c.globalCompositeOperation = 'source-over';
  c.fillStyle = body; c.strokeStyle = col; c.lineWidth = 2.5;
  if (e.isBoss) drawBossBody(c, e, y, r, aP);
  else switch (e.type) {
    case 'mote': { const a = Math.atan2(e.vy, e.vx); poly(c, e.x, y, r * 1.2, 3, a); c.fill(); c.stroke(); break; }
    case 'shade': case 'splitter': {
      c.beginPath(); const n = 10;
      for (let i = 0; i <= n; i++) { const a = i * TAU / n, rr2 = r * (1 + 0.13 * Math.sin(e.t * 5 + i * 1.7 + e.wob)); i ? c.lineTo(e.x + Math.cos(a) * rr2, y + Math.sin(a) * rr2) : c.moveTo(e.x + Math.cos(a) * rr2, y + Math.sin(a) * rr2); }
      c.closePath(); c.fill(); c.stroke();
      if (e.type === 'splitter') { c.beginPath(); c.arc(e.x - r * 0.3, y, r * 0.35, 0, TAU); c.moveTo(e.x + r * 0.65, y); c.arc(e.x + r * 0.3, y, r * 0.35, 0, TAU); c.stroke(); }
      break;
    }
    case 'spitter': { poly(c, e.x, y, r * 1.15, 4, aP); c.fill(); c.stroke(); c.globalCompositeOperation = 'lighter'; drawGlow(c, e.x + Math.cos(aP) * r * 0.7, y + Math.sin(aP) * r * 0.7, 10, col, 1 - Math.max(0, e.cd) / 3); c.globalCompositeOperation = 'source-over'; break; }
    case 'bomber': {
      star(c, e.x, y, r * 1.25, r * 0.8, 9, e.t * 3); c.fill(); c.stroke();
      const fl = e.state === 'prime' ? (Math.sin(e.t * 40) > 0 ? 1 : 0.2) : 0.5 + 0.3 * Math.sin(e.t * 6);
      c.fillStyle = rgba('#ff6a3d', fl); c.beginPath(); c.arc(e.x, y, r * 0.45, 0, TAU); c.fill();
      if (e.state === 'prime') { c.strokeStyle = rgba('#ff4a4a', 0.5); c.beginPath(); c.arc(e.x, y, 95, 0, TAU); c.stroke(); }
      break;
    }
    case 'blinker': { c.save(); c.translate(e.x, y); c.rotate(e.t * 2); c.beginPath(); c.rect(-r, -r, r * 2, r * 2); c.fill(); c.stroke(); c.strokeRect(-r * 0.45, -r * 0.45, r * 0.9, r * 0.9); c.restore(); break; }
    case 'leech': {
      if (e.tether) { c.strokeStyle = rgba(col, 0.7); c.lineWidth = 2; c.beginPath(); const n = 12; for (let i = 0; i <= n; i++) { const t = i / n, x = lerp(e.x, G.p.x, t), yy = lerp(y, G.p.y, t) + Math.sin(t * 12 + G.time * 15) * 6 * Math.sin(t * Math.PI); i ? c.lineTo(x, yy) : c.moveTo(x, yy); } c.stroke(); c.strokeStyle = col; c.lineWidth = 2.5; }
      c.save(); c.translate(e.x, y); c.rotate(aP); c.beginPath(); c.ellipse(0, 0, r * 1.3, r * 0.75, 0, 0, TAU); c.fill(); c.stroke();
      c.beginPath(); for (let i = -1; i <= 1; i++) { c.moveTo(-r * 1.2, i * 5); c.quadraticCurveTo(-r * 1.8, i * 10 + Math.sin(e.t * 8 + i) * 6, -r * 2.3, i * 14); } c.stroke(); c.restore(); break;
    }
    case 'lancer': {
      if (e.state === 'aim') { const k = 1 - e.stT / 1.1; c.strokeStyle = rgba('#ffe65a', 0.2 + 0.6 * k); c.lineWidth = 1 + 2 * k; c.setLineDash([10, 6]); c.beginPath(); c.moveTo(e.x, y); c.lineTo(e.x + Math.cos(e.aim) * 1400, y + Math.sin(e.aim) * 1400); c.stroke(); c.setLineDash([]); c.strokeStyle = col; c.lineWidth = 2.5; }
      const a = e.state === 'aim' ? e.aim : aP; c.save(); c.translate(e.x, y); c.rotate(a); c.beginPath(); c.moveTo(r * 1.8, 0); c.lineTo(0, r * 0.6); c.lineTo(-r * 1.1, 0); c.lineTo(0, -r * 0.6); c.closePath(); c.fill(); c.stroke(); c.restore(); break;
    }
    case 'warden': {
      c.beginPath(); c.arc(e.x, y, r, 0, TAU); c.fill(); c.stroke();
      c.globalCompositeOperation = 'lighter';
      c.strokeStyle = rgba('#dfe6ff', 0.9); c.lineWidth = 6; c.beginPath(); c.arc(e.x, y, r + 7, e.shieldAng - 1.05, e.shieldAng + 1.05); c.stroke();
      c.strokeStyle = rgba(col, 0.4); c.lineWidth = 14; c.stroke();
      c.globalCompositeOperation = 'source-over'; break;
    }
    case 'brute': {
      if (e.state === 'wind') { const k = 1 - e.stT / 0.85; c.fillStyle = rgba('#ff6a3d', 0.1 + 0.15 * k); c.save(); c.translate(e.x, y); c.rotate(e.aim); c.fillRect(0, -r, 480, r * 2); c.restore(); c.fillStyle = body; }
      poly(c, e.x, y, r, 6, e.t * 0.3); c.fill(); c.lineWidth = 3.5; c.stroke(); poly(c, e.x, y, r * 0.6, 6, -e.t * 0.3); c.stroke();
      if (e.state === 'stun') { c.fillStyle = '#ffe65a'; c.font = `900 14px ${FONT}`; c.textAlign = 'center'; c.fillText('✦ ✦', e.x, y - r - 10); }
      break;
    }
    case 'weaver': {
      star(c, e.x, y, r * 1.2, r * 0.55, 5, e.t); c.fill(); c.stroke();
      for (let i = 0; i < 3; i++) { const a = e.t * 2 + i * TAU / 3; c.beginPath(); c.arc(e.x + Math.cos(a) * r * 1.7, y + Math.sin(a) * r * 1.7, 3.5, 0, TAU); c.fillStyle = col; c.fill(); }
      break;
    }
    case 'prism': {
      if (e.healT && !e.healT.dead) { c.globalCompositeOperation = 'lighter'; c.strokeStyle = rgba(col, 0.6 + 0.3 * Math.sin(G.time * 20)); c.lineWidth = 3; c.beginPath(); c.moveTo(e.x, y); c.lineTo(e.healT.x, e.healT.y); c.stroke(); c.globalCompositeOperation = 'source-over'; c.strokeStyle = col; c.lineWidth = 2.5; }
      poly(c, e.x, y, r * 1.2, 3, -Math.PI / 2 + Math.sin(e.t) * 0.3); c.fill(); c.stroke(); poly(c, e.x, y, r * 0.5, 3, Math.PI / 2); c.stroke(); break;
    }
  }
  // eyes
  if (!e.isBoss && e.type !== 'mote' && e.type !== 'bomber' && e.type !== 'prism') {
    const ex = Math.cos(aP) * r * 0.35, ey = Math.sin(aP) * r * 0.35, px = -Math.sin(aP) * r * 0.28, py = Math.cos(aP) * r * 0.28;
    c.fillStyle = e.flash > 0 ? col : '#ffffff';
    c.beginPath(); c.arc(e.x + ex + px, y + ey + py, Math.max(1.5, r * 0.13), 0, TAU); c.arc(e.x + ex - px, y + ey - py, Math.max(1.5, r * 0.13), 0, TAU); c.fill();
  }
  // elite
  if (e.elite) {
    const mc = ELITE_MODS[e.elite].color;
    c.strokeStyle = '#ffd24d'; c.lineWidth = 2; c.setLineDash([6, 5]); c.lineDashOffset = -G.time * 30; c.beginPath(); c.arc(e.x, y, r + 8, 0, TAU); c.stroke(); c.setLineDash([]);
    c.fillStyle = mc; c.font = `800 ${10}px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(ELITE_MODS[e.elite].name.toUpperCase(), e.x, y - r - 22);
    if (e.shield > 0) { c.strokeStyle = rgba('#7ad7ff', 0.8); c.lineWidth = 3; c.beginPath(); c.arc(e.x, y, r + 4, -Math.PI / 2, -Math.PI / 2 + TAU * e.shield / e.maxShield); c.stroke(); }
  }
  if (e.bounty) { c.fillStyle = '#ffe65a'; c.font = `900 18px ${FONT}`; c.textAlign = 'center'; c.fillText('★', e.x, y - r - 36); c.strokeStyle = rgba('#ffe65a', 0.5 + 0.5 * Math.sin(G.time * 6)); c.lineWidth = 2; c.beginPath(); c.arc(e.x, y, r + 14, 0, TAU); c.stroke(); }
  if (e.burnT > 0) { c.globalCompositeOperation = 'lighter'; drawGlow(c, e.x, y, r * 1.6, '#ff7a2a', 0.35); c.globalCompositeOperation = 'source-over'; }
  if (e.slowT > 0) { c.strokeStyle = 'rgba(160,220,255,0.6)'; c.lineWidth = 1.5; c.beginPath(); c.arc(e.x, y, r + 3, 0, TAU); c.stroke(); }
  // hp bar
  if (!e.isBoss && e.hp < e.maxHp && e.maxHp > 12) {
    const w = Math.max(24, r * 2), f = Math.max(0, e.hp / e.maxHp);
    c.fillStyle = 'rgba(0,0,0,0.6)'; c.fillRect(e.x - w / 2, y + r + 7, w, 4);
    c.fillStyle = e.elite ? '#ffd24d' : col; c.fillRect(e.x - w / 2, y + r + 7, w * f, 4);
  }
  c.globalAlpha = 1;
}

function drawBossBody(c, e, y, r, aP) {
  const col = e.color, t = G.time, body = e.flash > 0 ? '#ffffff' : '#0c0612';
  c.fillStyle = body; c.strokeStyle = col; c.lineWidth = 4;
  if (e.invulnT > 0) { c.strokeStyle = '#ffffff'; }
  switch (e.bossDef.id) {
    case 'maw': {
      const open = 0.35 + 0.3 * Math.sin(t * 3) + (e.pat === 'pull' ? 0.4 : 0);
      c.beginPath(); c.arc(e.x, y, r, aP + open, aP - open + TAU); c.lineTo(e.x, y); c.closePath(); c.fill(); c.stroke();
      c.fillStyle = col; for (let i = 0; i < 6; i++) { const a = aP + open + (TAU - 2 * open) * (i + 0.5) / 6; } // teeth
      c.strokeStyle = '#ffffff'; c.lineWidth = 2;
      for (let i = 0; i < 5; i++) { const s = (i - 2) / 2; const a1 = aP + open, a2 = aP - open; c.beginPath(); c.moveTo(e.x + Math.cos(a1) * r * (0.3 + 0.15 * i), y + Math.sin(a1) * r * (0.3 + 0.15 * i)); c.lineTo(e.x + Math.cos(a1 - 0.25) * r * (0.4 + 0.15 * i), y + Math.sin(a1 - 0.25) * r * (0.4 + 0.15 * i)); c.stroke(); c.beginPath(); c.moveTo(e.x + Math.cos(a2) * r * (0.3 + 0.15 * i), y + Math.sin(a2) * r * (0.3 + 0.15 * i)); c.lineTo(e.x + Math.cos(a2 + 0.25) * r * (0.4 + 0.15 * i), y + Math.sin(a2 + 0.25) * r * (0.4 + 0.15 * i)); c.stroke(); }
      for (let i = 0; i < 5; i++) { const a = aP + Math.PI + (i - 2) * 0.45; const ex = e.x + Math.cos(a) * r * 0.55, ey = y + Math.sin(a) * r * 0.55; c.fillStyle = col; c.beginPath(); c.arc(ex, ey, 5 + (i === 2 ? 3 : 0), 0, TAU); c.fill(); c.fillStyle = '#fff'; c.beginPath(); c.arc(ex + Math.cos(aP) * 2, ey + Math.sin(aP) * 2, 2, 0, TAU); c.fill(); }
      break;
    }
    case 'twins': {
      if (e.twinIdx === 0) {
        star(c, e.x, y, r * 1.35, r * 0.95, 12, t * 0.8); c.fill(); c.stroke();
        c.globalCompositeOperation = 'lighter'; drawGlow(c, e.x, y, r * 1.2, col, 0.8); c.globalCompositeOperation = 'source-over';
        c.fillStyle = '#ffe0a0'; c.beginPath(); c.arc(e.x, y, r * 0.4, 0, TAU); c.fill();
      } else {
        c.beginPath(); c.arc(e.x, y, r, 0, TAU); c.fill(); c.stroke();
        c.fillStyle = col; c.beginPath(); c.arc(e.x, y, r * 0.85, 0, TAU); c.fill();
        c.fillStyle = body; c.beginPath(); c.arc(e.x + r * 0.35 * Math.cos(t), y - r * 0.2, r * 0.75, 0, TAU); c.fill();
      }
      const o = G.bosses.find(b => b !== e && !b.dead);
      if (o && e.twinIdx === 0) { c.globalCompositeOperation = 'lighter'; c.strokeStyle = `rgba(255,255,255,${0.5 + 0.3 * Math.sin(t * 20)})`; c.lineWidth = 4; c.beginPath(); c.moveTo(e.x, y); c.lineTo(o.x, o.y); c.stroke(); c.strokeStyle = rgba('#c0a0ff', 0.4); c.lineWidth = 16; c.stroke(); c.globalCompositeOperation = 'source-over'; }
      break;
    }
    case 'hive': {
      poly(c, e.x, y, r, 6, t * 0.2); c.fill(); c.stroke();
      c.lineWidth = 1.5; for (let i = 0; i < 6; i++) { const a = t * 0.2 + i * TAU / 6; poly(c, e.x + Math.cos(a) * r * 0.5, y + Math.sin(a) * r * 0.5, r * 0.25, 6, t * 0.2); c.stroke(); }
      poly(c, e.x, y, r * 0.25, 6, t * 0.2); c.fillStyle = col; c.fill();
      c.lineWidth = 3; for (let i = 0; i < 8; i++) { const a = i * TAU / 8 + 0.2, w = Math.sin(t * 6 + i) * 0.2; c.beginPath(); c.moveTo(e.x + Math.cos(a) * r, y + Math.sin(a) * r); c.quadraticCurveTo(e.x + Math.cos(a + w) * r * 1.5, y + Math.sin(a + w) * r * 1.5, e.x + Math.cos(a + w * 2) * r * 1.35, y + Math.sin(a + w * 2) * r * 1.35 + 10); c.stroke(); }
      break;
    }
    case 'sovereign': {
      c.save(); c.translate(e.x, y);
      c.beginPath(); c.moveTo(0, -r * 1.3); c.lineTo(r * 0.8, -r * 0.2); c.lineTo(r * 0.5, r); c.lineTo(-r * 0.5, r); c.lineTo(-r * 0.8, -r * 0.2); c.closePath(); c.fill(); c.stroke();
      c.fillStyle = col; for (let i = -1; i <= 1; i++) { c.beginPath(); c.moveTo(i * r * 0.35 - 6, -r * 1.05); c.lineTo(i * r * 0.35, -r * 1.55 - (i === 0 ? 10 : 0)); c.lineTo(i * r * 0.35 + 6, -r * 1.05); c.fill(); }
      c.fillStyle = '#9ad7ff'; c.fillRect(-r * 0.4, -r * 0.35, r * 0.8, 4);
      c.rotate(aP); c.strokeStyle = '#ffffff'; c.lineWidth = 4; c.beginPath(); c.moveTo(r * 0.6, 0); c.lineTo(r * 2.2, 0); c.stroke(); c.lineWidth = 2; c.beginPath(); c.moveTo(r * 0.8, -10); c.lineTo(r * 0.8, 10); c.stroke();
      c.restore(); break;
    }
    case 'colossus': {
      c.beginPath(); for (let i = 0; i < 11; i++) { const a = i * TAU / 11, rr2 = r * (0.85 + 0.15 * Math.sin(i * 3.1)); i ? c.lineTo(e.x + Math.cos(a) * rr2, y + Math.sin(a) * rr2) : c.moveTo(e.x + Math.cos(a) * rr2, y + Math.sin(a) * rr2); } c.closePath(); c.fill(); c.stroke();
      c.lineWidth = 2; for (let i = 0; i < 5; i++) { const a = i * TAU / 5 + 0.4; c.beginPath(); c.moveTo(e.x + Math.cos(a) * r * 0.3, y + Math.sin(a) * r * 0.3); c.lineTo(e.x + Math.cos(a + 0.2) * r * 0.8, y + Math.sin(a + 0.2) * r * 0.8); c.stroke(); }
      c.globalCompositeOperation = 'lighter'; drawGlow(c, e.x, y, r * 0.7, col, 0.6 + 0.3 * Math.sin(t * 3)); c.globalCompositeOperation = 'source-over';
      c.fillStyle = '#ffd0a0'; c.beginPath(); c.arc(e.x + Math.cos(aP) * r * 0.2, y + Math.sin(aP) * r * 0.2, r * 0.18, 0, TAU); c.fill();
      break;
    }
    case 'unlight': {
      c.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 16; i++) { const a = i * TAU / 16 + t * 0.4, l = r * (1.4 + 0.3 * Math.sin(t * 3 + i * 2)); c.strokeStyle = rgba(i % 2 ? '#ffffff' : col, 0.5); c.lineWidth = 3; c.beginPath(); c.moveTo(e.x + Math.cos(a) * r, y + Math.sin(a) * r); c.lineTo(e.x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke(); }
      drawGlow(c, e.x, y, r * 2, col, 0.6);
      c.globalCompositeOperation = 'source-over';
      c.fillStyle = e.flash > 0 ? '#ffffff' : '#000000'; c.beginPath(); c.arc(e.x, y, r, 0, TAU); c.fill(); c.strokeStyle = '#ffffff'; c.lineWidth = 3; c.stroke();
      for (let i = 0; i < 3 + e.phase * 2; i++) { const a = -t * 1.5 + i * TAU / (3 + e.phase * 2); c.fillStyle = '#ffffff'; poly(c, e.x + Math.cos(a) * r * 1.6, y + Math.sin(a) * r * 1.6, 7, 3, a); c.fill(); }
      c.fillStyle = col; c.beginPath(); c.arc(e.x + Math.cos(aP) * r * 0.3, y + Math.sin(aP) * r * 0.3, 6, 0, TAU); c.fill();
      break;
    }
  }
}

// ------------------------------------------------------------- player & allies
function drawPlayer(c) {
  const p = G.p, col = p.color;
  if (G.phase === 'dead') return;
  for (const d of G.decoys) { c.globalAlpha = 0.4 * d.life / d.max; c.strokeStyle = col; c.lineWidth = 2; c.beginPath(); c.arc(d.x, d.y, p.r, 0, TAU); c.stroke(); c.globalCompositeOperation = 'lighter'; drawGlow(c, d.x, d.y, 40, col, 0.5); c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1; }
  c.globalCompositeOperation = 'lighter';
  p.trail.forEach((q, i) => drawGlow(c, q.x, q.y, p.r * 1.5 * i / p.trail.length, col, 0.15 * i / p.trail.length));
  if (p.rampage > 0) drawGlow(c, p.x, p.y, 60 + 6 * Math.sin(G.time * 20), '#ff3d5e', 0.6);
  if (p.citadel > 0) drawGlow(c, p.x, p.y, 55, '#ffb23d', 0.4);
  if (p.invuln > 0 && p.dashT <= 0) drawGlow(c, p.x, p.y, 50, '#ffffff', 0.3 + 0.2 * Math.sin(G.time * 30));
  drawGlow(c, p.x, p.y, 55, col, 0.55);
  c.globalCompositeOperation = 'source-over';
  const blink = p.hurtT > 0 && Math.sin(G.time * 50) > 0;
  c.fillStyle = blink ? '#ff4060' : '#0b1410'; c.strokeStyle = col; c.lineWidth = 3;
  c.beginPath(); c.arc(p.x, p.y, p.r, 0, TAU); c.fill(); c.stroke();
  // ring emblem
  c.strokeStyle = '#ffffff'; c.lineWidth = 2; c.beginPath(); c.arc(p.x, p.y, p.r * 0.5, 0, TAU); c.stroke();
  c.save(); c.translate(p.x, p.y); c.rotate(p.aim);
  c.fillStyle = col; c.beginPath(); c.moveTo(p.r + 10, 0); c.lineTo(p.r + 2, -5); c.lineTo(p.r + 2, 5); c.closePath(); c.fill();
  c.restore();
  // wisps
  c.globalCompositeOperation = 'lighter';
  for (let i = 0; i < p.wisps; i++) { const a = G.time * 2.8 + i * TAU / p.wisps, x = p.x + Math.cos(a) * 74, y = p.y + Math.sin(a) * 74; drawGlow(c, x, y, 18, col, 0.9); drawGlow(c, x, y, 6, '#ffffff', 1); }
  for (const d of G.drones) { drawGlow(c, d.x, d.y, 16, col, 0.5); }
  for (const s of G.spirits) { drawGlow(c, s.x, s.y, 22, col, 0.9); drawGlow(c, s.x, s.y, 8, '#ffffff', 1); }
  c.globalCompositeOperation = 'source-over';
  for (const d of G.drones) { c.save(); c.translate(d.x, d.y); c.rotate(d.ang); c.fillStyle = '#0b1410'; c.strokeStyle = col; c.lineWidth = 2; poly(c, 0, 0, 8, 4, 0); c.fill(); c.stroke(); c.fillStyle = '#fff'; c.fillRect(4, -1.5, 7, 3); c.restore(); }
}

function drawProjectiles(c, v) {
  c.globalCompositeOperation = 'lighter'; c.lineCap = 'round';
  for (const b of G.bolts) {
    if (!inView(b.x, b.y, 30, v)) continue;
    const sp = Math.hypot(b.vx, b.vy) || 1, tx = b.vx / sp, ty = b.vy / sp;
    drawGlow(c, b.x, b.y, b.r * 4, b.color, 0.55);
    c.strokeStyle = rgba(b.color, 0.9); c.lineWidth = b.r * 1.4; c.beginPath(); c.moveTo(b.x - tx * b.r * 3.5, b.y - ty * b.r * 3.5); c.lineTo(b.x, b.y); c.stroke();
    c.strokeStyle = '#ffffff'; c.lineWidth = b.r * 0.6; c.stroke();
  }
  c.lineCap = 'butt';
  for (const q of G.eproj) {
    if (!inView(q.x, q.y, 30, v)) continue;
    if (q.type === 'needle') { const a = Math.atan2(q.vy, q.vx); c.strokeStyle = rgba(q.color, 0.9); c.lineWidth = 5; c.beginPath(); c.moveTo(q.x - Math.cos(a) * 30, q.y - Math.sin(a) * 30); c.lineTo(q.x, q.y); c.stroke(); drawGlow(c, q.x, q.y, 22, q.color, 0.8); continue; }
    if (q.type === 'mine') { const armed = q.t > 0.8, pl = armed ? 0.5 + 0.5 * Math.sin(q.t * 12) : 0.3; drawGlow(c, q.x, q.y, 26, q.color, pl); c.strokeStyle = rgba(q.color, 0.9); c.lineWidth = 2; c.beginPath(); c.arc(q.x, q.y, q.r, 0, TAU); c.stroke(); continue; }
    drawGlow(c, q.x, q.y, q.r * 3.2, q.color, 0.75);
  }
  c.globalCompositeOperation = 'source-over';
  for (const q of G.eproj) {
    if (q.type !== 'orb' || !inView(q.x, q.y, 20, v)) continue;
    c.fillStyle = '#ffffff'; c.beginPath(); c.arc(q.x, q.y, q.r * 0.6, 0, TAU); c.fill();
    c.strokeStyle = rgba('#200010', 0.8); c.lineWidth = 1.5; c.beginPath(); c.arc(q.x, q.y, q.r, 0, TAU); c.stroke();
  }
}

function drawStroke(c) {
  const s = G.stroke; if (!s || s.pts.length < 2) return;
  const p = G.p, cls = s.cls, ok = cls && p.will >= cls.cost;
  const col = cls ? (ok ? CONSTRUCTS[cls.type].color : '#ff4060') : '#9aa0b0';
  c.lineCap = 'round'; c.lineJoin = 'round';
  c.globalCompositeOperation = 'lighter';
  c.beginPath(); s.pts.forEach((q, i) => i ? c.lineTo(q.x, q.y) : c.moveTo(q.x, q.y));
  c.strokeStyle = rgba(col, 0.2); c.lineWidth = 16; c.stroke();
  c.strokeStyle = rgba(col, 0.85); c.lineWidth = 4; c.stroke();
  c.strokeStyle = 'rgba(255,255,255,0.9)'; c.lineWidth = 1.5; c.stroke();
  c.globalCompositeOperation = 'source-over';
  // preview hints
  if (cls) {
    const R = cls.data.R;
    if (cls.type === 'lance') { const a = angTo(R[0].x, R[0].y, R[R.length - 1].x, R[R.length - 1].y); c.strokeStyle = rgba(col, 0.25); c.setLineDash([10, 10]); c.lineWidth = 2; c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x + Math.cos(a) * 1050, p.y + Math.sin(a) * 1050); c.stroke(); c.setLineDash([]); }
    if (cls.type === 'vortex') { c.strokeStyle = rgba(col, 0.35); c.setLineDash([6, 8]); c.lineWidth = 2; c.beginPath(); c.arc(cls.data.cx, cls.data.cy, cls.data.r, 0, TAU); c.stroke(); c.setLineDash([]); }
    if (cls.type === 'prison' || cls.type === 'aegis') { c.fillStyle = rgba(col, 0.08); c.beginPath(); R.forEach((q, i) => i ? c.lineTo(q.x, q.y) : c.moveTo(q.x, q.y)); c.closePath(); c.fill(); }
  }
  const m = s.pts[s.pts.length - 1];
  c.textAlign = 'left'; c.textBaseline = 'middle';
  c.font = `800 ${15 / ZOOM * US}px ${FONT}`;
  const label = cls ? CONSTRUCTS[cls.type].name.toUpperCase() : '…';
  c.lineWidth = 4 / ZOOM; c.strokeStyle = 'rgba(0,0,0,0.8)'; c.strokeText(label, m.x + 18 / ZOOM, m.y - 14 / ZOOM); c.fillStyle = col; c.fillText(label, m.x + 18 / ZOOM, m.y - 14 / ZOOM);
  if (cls) { c.font = `700 ${12 / ZOOM * US}px ${FONT}`; const t2 = cls.cost + ' WILL'; c.strokeText(t2, m.x + 18 / ZOOM, m.y + 4 / ZOOM); c.fillStyle = ok ? '#bfe8ff' : '#ff6080'; c.fillText(t2, m.x + 18 / ZOOM, m.y + 4 / ZOOM); }
  const lf = s.len / p.maxStroke; if (lf > 0.6) { c.fillStyle = lf >= 1 ? '#ff6080' : '#aaa'; c.font = `600 ${10 / ZOOM * US}px ${FONT}`; c.fillText(lf >= 1 ? 'MAX LENGTH' : Math.round(lf * 100) + '%', m.x + 18 / ZOOM, m.y + 20 / ZOOM); }
}

// ------------------------------------------------------------- lighting
function drawLighting(v) {
  const target = Math.max(G.anomaly && G.anomaly.id === 'eclipse' && G.phase === 'wave' ? 0.94 : 0, G.forcedDark || 0);
  G.darkness = lerp(G.darkness, target, 0.03);
  if (G.darkness < 0.02) return;
  const lw = lightCv.width, lh = lightCv.height, s = 0.5 * ZOOM;
  lctx.globalCompositeOperation = 'source-over'; lctx.clearRect(0, 0, lw, lh);
  lctx.fillStyle = `rgba(2,0,8,${G.darkness})`; lctx.fillRect(0, 0, lw, lh);
  lctx.globalCompositeOperation = 'destination-out';
  const L = (x, y, r, a = 1) => { const sx = ((x - G.cam.x) * ZOOM + W / 2) / 2, sy = ((y - G.cam.y) * ZOOM + H / 2) / 2; const R = r * s; if (sx + R < 0 || sy + R < 0 || sx - R > lw || sy - R > lh) return; lctx.globalAlpha = a; lctx.drawImage(glowSprite('#ffffff'), sx - R, sy - R, R * 2, R * 2); };
  const p = G.p;
  L(p.x, p.y, 380, 1); L(p.x, p.y, 200, 1);
  for (const b of G.bolts) L(b.x, b.y, 60, 0.6);
  for (const q of G.eproj) L(q.x, q.y, 45, 0.8);
  for (const e of G.enemies) L(e.x, e.y, e.r * 2.5, e.isBoss ? 1 : 0.35);
  for (const k of G.constructs) {
    if (k.type === 'wall') { for (let i = 0; i <= 4; i++) L(lerp(k.ax, k.bx, i / 4), lerp(k.ay, k.by, i / 4), 110, 0.7); }
    else if (k.type === 'vortex') L(k.x, k.y, k.r * 1.2, 0.8);
    else if (k.type === 'prison') L(k.cx, k.cy, 200, 0.7);
    else if (k.type === 'scythe' && k.x !== undefined) L(k.x, k.y, 150, 0.9);
    else if (k.type === 'lance') { for (let i = 0; i <= 8; i++) L(lerp(k.x, k.bx, i / 8), lerp(k.y, k.by, i / 8), 120, k.life / k.max); }
    else if (k.type === 'bolt') { const q = k.pts[k.pts.length - 1]; L(q.x, q.y, 160, k.life / k.max); }
  }
  for (const z of G.zones) if (z.type === 'fire' || (z.type === 'rift' && z.warn <= 0)) L(z.x, z.y, z.r * 2, 0.6);
  for (const k of G.pickups) L(k.x, k.y, 40, 0.6);
  for (const pt of G.portals) L(pt.x, pt.y, 90, 0.6);
  for (const pa of parts) if (pa.type === 2) L(pa.x, pa.y, pa.r1, pa.life / pa.max * 0.8);
  lctx.globalAlpha = 1; lctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(lightCv, 0, 0, W, H);
}

// ------------------------------------------------------------- whole world
function drawWorld() {
  const p = G.p;
  ctx.fillStyle = '#030308'; ctx.fillRect(0, 0, W, H);
  drawStars(ctx, G.cam.x, G.cam.y, G.time);
  const sh = G.shake, sx = rand(-sh, sh), sy = rand(-sh, sh);
  ctx.save();
  ctx.translate(W / 2 + sx, H / 2 + sy); ctx.scale(ZOOM, ZOOM); ctx.translate(-G.cam.x, -G.cam.y);
  const v = viewRect();
  drawArena(ctx, v);
  drawZones(ctx, v);
  drawPickups(ctx, v);
  for (const o of G.obstacles) if (inView(o.x, o.y, o.r, v)) drawObstacle(ctx, o);
  drawConstructs(ctx);
  for (const e of G.enemies) if (inView(e.x, e.y, e.r + 40, v)) drawEnemy(ctx, e);
  // boss pieces offscreen are still drawn when large
  drawHazardsTop(ctx);
  drawPlayer(ctx);
  drawProjectiles(ctx, v);
  drawParts(ctx);
  drawFloaters(ctx);
  drawStroke(ctx);
  ctx.restore();
  drawLighting(v);
  // screen effects
  ctx.globalAlpha = 0.85; ctx.drawImage(vignetteCv, 0, 0, W, H); ctx.globalAlpha = 1;
  if (G.stroke) { ctx.fillStyle = rgba(p.color, 0.05); ctx.fillRect(0, 0, W, H); ctx.strokeStyle = rgba(p.color, 0.35); ctx.lineWidth = 3; ctx.strokeRect(6, 6, W - 12, H - 12); }

  const slider = (id, label, key) => {
    txt(label, x, y + 20 * u, 16 * u, '#dfe6ff', 'left', 700);
    const sx = x + w - 260 * u, sw = 170 * u;
    if (button(id + '-', sx - 44 * u, y + 2 * u, 36 * u, 36 * u, '−')) { settings[key] = Math.max(0, Math.round((settings[key] - 0.1) * 10) / 10); saveSettings(); }
    rr(ctx, sx, y + 14 * u, sw, 12 * u, 6 * u); ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fill(); ctx.fillStyle = '#8ab4ff'; rr(ctx, sx, y + 14 * u, sw * settings[key], 12 * u, 6 * u); ctx.fill();
    if (mouse.l && hit(sx, y + 6 * u, sw, 28 * u)) { settings[key] = Math.round(clamp((mouse.x - sx) / sw, 0, 1) * 20) / 20; saveSettings(); }
    if (button(id + '+', sx + sw + 8 * u, y + 2 * u, 36 * u, 36 * u, '+')) { settings[key] = Math.min(1, Math.round((settings[key] + 0.1) * 10) / 10); saveSettings(); }
    txt(Math.round(settings[key] * 100) + '%', x + w, y + 20 * u, 14 * u, '#9aa4c0', 'right', 700);
    y += 52 * u;
  };
  const toggle = (id, label, key, desc) => {
    txt(label, x, y + 20 * u, 16 * u, '#dfe6ff', 'left', 700); if (desc) txt(desc, x, y + 38 * u, 11 * u, 'rgba(220,230,255,0.45)', 'left', 500);
    if (button(id, x + w - 110 * u, y + 2 * u, 110 * u, 36 * u, settings[key] ? 'ON' : 'OFF', { active: !!settings[key], color: settings[key] ? '#7affc1' : '#9aa4c0' })) { settings[key] = settings[key] ? 0 : 1; saveSettings(); }
    y += 56 * u;
  };
  slider('mv', 'Master Volume', 'master'); slider('mu', 'Music', 'music'); slider('sf', 'Sound Effects', 'sfx');
  toggle('sh', 'Screen Shake', 'shake'); toggle('dn', 'Damage Numbers', 'numbers'); toggle('af', 'Auto-Fire', 'autoFire', 'Fire continuously toward the cursor (hold left mouse not needed).'); toggle('fps', 'Show FPS', 'fps');
  if (settingsFrom === 'menu') {
    if (button('reset', x, y + 6 * u, 220 * u, 40 * u, confirmReset ? 'CLICK AGAIN TO CONFIRM' : 'RESET ALL PROGRESS', { color: '#ff4060', size: 13 * u })) {
      if (confirmReset) { meta = defaultMeta(); saveMeta(); confirmReset = 0; selHue = 'verdant'; } else confirmReset = 1;
    }
  }
  if (button('back', W / 2 - 110 * u, H - 76 * u, 220 * u, 48 * u, 'BACK', { color: '#9aa4c0' }) || pressed.Escape) { confirmReset = 0; state = settingsFrom === 'pause' ? 'paused' : 'menu'; }
}

function screenPause(rdt) {
  drawWorld(); drawHUD();
  ctx.fillStyle = 'rgba(2,3,8,0.8)'; ctx.fillRect(0, 0, W, H);
  const u = US;
  spaced('PAUSED', W / 2, 54 * u, 36 * u, '#ffffff', 10 * u);
  const lx = Math.max(20 * u, W / 2 - 560 * u), bw = 220 * u; let by = 110 * u;
  if (button('resume', lx, by, bw, 48 * u, 'RESUME', { color: G.p.color }) || pressed.Escape || pressed.p) { state = 'playing'; return; }
  by += 60 * u; if (button('psettings', lx, by, bw, 48 * u, 'SETTINGS', { color: '#9aa4c0' })) { settingsFrom = 'pause'; state = 'settings'; }
  by += 60 * u; if (button('pcodex', lx, by, bw, 48 * u, 'CODEX', { color: '#8ab4ff' })) { settingsFrom = 'pause'; state = 'codex'; }
  by += 60 * u; if (button('abandon', lx, by, bw, 48 * u, 'ABANDON RUN', { color: '#ff4060' })) { G.deathCause = 'abandoning the light'; endRun(false); state = 'gameover'; }
  // stats
  const p = G.p; by += 80 * u;
  const stats = [['Hue', G.hue.name], ['Difficulty', G.D.name], ['Bolt Damage', (p.dmg * p.dmgMult).toFixed(1)], ['Fire Rate', p.fireRate.toFixed(1) + '/s'], ['Bolts', p.bolts], ['Crit', Math.round(p.crit * 100) + '% ×' + p.critMult.toFixed(2)], ['Construct Power', '×' + (p.cPow * p.dmgMult).toFixed(2)], ['Construct Cost', '×' + p.cCost.toFixed(2)], ['Armor', Math.round(p.armor * 100) + '%'], ['Speed', Math.round(p.speed)]];
  stats.forEach((s, i) => { txt(s[0], lx, by + i * 20 * u, 12 * u, 'rgba(220,230,255,0.55)', 'left', 600); txt(String(s[1]), lx + bw, by + i * 20 * u, 12 * u, '#fff', 'right', 800); });
  // build
  const rx = lx + bw + 40 * u, rw = W - rx - 20 * u;
  txt('YOUR BUILD', rx, 124 * u, 14 * u, '#fff', 'left', 900);
  const ids = Object.keys(G.cards); const cols = Math.max(1, Math.floor(rw / (200 * u))), cw = rw / cols - 8 * u;
  ids.forEach((id, i) => {
    const c = CARD[id], x = rx + (i % cols) * (cw + 8 * u), y = 144 * u + Math.floor(i / cols) * 34 * u;
    rr(ctx, x, y, cw, 28 * u, 6 * u); ctx.fillStyle = 'rgba(10,14,28,0.9)'; ctx.fill(); ctx.strokeStyle = rgba(RARITY[c.r].color, 0.6); ctx.lineWidth = 1.2; ctx.stroke();
    drawCatIcon(ctx, c.cat, x + 14 * u, y + 14 * u, 7 * u, CAT_COL[c.cat]);
    txt(c.name, x + 28 * u, y + 14 * u, 12 * u, '#fff', 'left', 700); txt('×' + G.cards[id], x + cw - 8 * u, y + 14 * u, 12 * u, RARITY[c.r].color, 'right', 800);
    if (hit(x, y, cw, 28 * u)) tooltip(c.name, c.desc, RARITY[c.r].color);
  });
  let ry = 144 * u + Math.ceil(ids.length / cols) * 34 * u + 16 * u;
  if (!ids.length) { txt('No cards yet.', rx, 156 * u, 12 * u, '#889', 'left', 500); ry = 180 * u; }
  if (G.relics.length) {
    txt('RELICS', rx, ry, 14 * u, '#ffc94d', 'left', 900); ry += 20 * u;
    G.relics.forEach((id, i) => { const r = RELIC[id]; txt('◆ ' + r.name, rx, ry + i * 36 * u, 13 * u, '#ffc94d', 'left', 800); txt(r.desc, rx + 14 * u, ry + i * 36 * u + 16 * u, 11 * u, '#c8d2ee', 'left', 500); });
    ry += G.relics.length * 36 * u + 10 * u;
  }
  // mini gesture guide
  const types = Object.keys(CONSTRUCTS), gw = Math.min(120 * u, rw / types.length - 6 * u), gy = Math.max(ry + 20 * u, H - 150 * u);
  if (gy + 110 * u < H) types.forEach((t, i) => {
    const x = rx + i * (gw + 6 * u); panel(x, gy, gw, 110 * u, CONSTRUCTS[t].color, 0.85);
    drawDemo(t, x + gw / 2, gy + 42 * u, gw * 0.28, menuT + i * 0.4); txt(CONSTRUCTS[t].name, x + gw / 2, gy + 90 * u, 11 * u, CONSTRUCTS[t].color, 'center', 800);
    txt((G.cast[t] || 0) + ' cast', x + gw / 2, gy + 103 * u, 9 * u, 'rgba(255,255,255,0.4)', 'center', 600);
  });
  menuT += rdt;
}

function drawRunStats(y, won) {
  const u = US, p = G.p;
  const rows = [
    ['Sector Reached', G.wave], ['Score', fmt(G.score)], ['Hollow Slain', G.kills], ['Titans Felled', G.bossesKilled], ['Best Combo', G.maxCombo],
    ['Constructs Forged', G.castTotal], ['Damage Dealt', fmt(G.dmgDealt)], ['Time', fmtTime(G.time)], ['Cards / Relics', G.cardList.length + ' / ' + G.relics.length],
  ];
  const w = Math.min(520 * u, W - 40), x = W / 2 - w / 2;
  panel(x, y, w, rows.length * 26 * u + 70 * u, G.hue.color, 0.85);
  rows.forEach((r, i) => { txt(r[0], x + 24 * u, y + 24 * u + i * 26 * u, 14 * u, 'rgba(220,230,255,0.6)', 'left', 600); txt(String(r[1]), x + w - 24 * u, y + 24 * u + i * 26 * u, 15 * u, '#fff', 'right', 800); });
  const cy = y + 24 * u + rows.length * 26 * u + 12 * u;
  const favs = Object.entries(G.cast).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k, v]) => CONSTRUCTS[k].name + ' ×' + v).join('   ');
  txt(favs || 'No constructs forged', W / 2, cy, 12 * u, 'rgba(220,230,255,0.5)', 'center', 600);
  txt('+ ' + (G.finalEmbers || 0) + ' ✦ embers banked', W / 2, cy + 22 * u, 16 * u, '#ffb13d', 'center', 900);
  return y + rows.length * 26 * u + 90 * u;
}

function screenGameOver(rdt) {
  drawMenuBG(rdt);
  const u = US;
  ctx.globalCompositeOperation = 'lighter'; drawGlow(ctx, W / 2, 90 * u, 300 * u, '#ff3d5e', 0.2); ctx.globalCompositeOperation = 'source-over';
  spaced('YOUR LIGHT FADES', W / 2, 70 * u, 38 * u, '#ffffff', 8 * u);
  txt('Extinguished by ' + G.deathCause + ' in Sector ' + G.wave, W / 2, 110 * u, 15 * u, '#ff8aa0', 'center', 600);
  const y = drawRunStats(140 * u, false) + 10 * u, bw = 200 * u;
  if (button('retry', W / 2 - bw * 1.5 - 12 * u, y, bw, 50 * u, 'RISE AGAIN', { color: G.hue.color, size: 17 * u }) || pressed.Enter) newRun(G.hueId, G.diff);
  if (button('hue', W / 2 - bw / 2, y, bw, 50 * u, 'CHANGE HUE', { color: '#8ab4ff' })) state = 'select';
  if (button('menu', W / 2 + bw / 2 + 12 * u, y, bw, 50 * u, 'MAIN MENU', { color: '#9aa4c0' }) || pressed.Escape) { state = 'menu'; Music.set('calm', 0.2); }
}
function screenVictory(rdt) {
  drawMenuBG(rdt);
  const u = US, c = G.hue.color;
  ctx.globalCompositeOperation = 'lighter'; drawGlow(ctx, W / 2, 80 * u, 420 * u, '#ffe08a', 0.3 + 0.1 * Math.sin(menuT * 2)); ctx.globalCompositeOperation = 'source-over';
  if (Math.random() < 0.3) menuMotes.push({ x: rand(1), y: 1.05, s: rand(1, 3), v: rand(0.05, 0.15), c: pick(['#ffe08a', c, '#ffffff']), ph: rand(TAU) });
  if (menuMotes.length > 200) menuMotes.splice(90, 1);
  spaced('DAWN BREAKS', W / 2, 64 * u, 48 * u, '#ffffff', 12 * u);
  txt('The Unlight is undone. The ' + G.hue.name + ' light endures.', W / 2, 108 * u, 16 * u, '#ffe08a', 'center', 600);
  const y = drawRunStats(136 * u, true) + 10 * u, bw = 260 * u;
  if (button('endless', W / 2 - bw - 10 * u, y, bw, 50 * u, 'CONTINUE INTO ENDLESS', { color: c, size: 15 * u })) {
    G.endless = true; G.victory = false; state = 'playing'; startWave(G.wave + 1);
  }
  if (button('menu', W / 2 + 10 * u, y, bw, 50 * u, 'RETURN TO MENU', { color: '#9aa4c0' })) { state = 'menu'; Music.set('calm', 0.2); }
}

// =====================================================================
//  MAIN LOOP
// =====================================================================
function updateGame(rdt) {
  const p = G.p;
  if ((pressed.Escape || pressed.p) && G.phase !== 'pick' && G.phase !== 'dead') { state = 'paused'; G.stroke = null; return; }
  if (G.phase === 'pick') { G.pickT += rdt; updateParts(rdt * 0.2); return; }
  let freeze = false;
  if (G.hitstop > 0) { G.hitstop -= rdt; freeze = true; }
  const target = G.phase === 'dead' ? 0.25 : G.stroke ? p.focusSlow : 1;
  G.ts = lerp(G.ts, target, 1 - Math.exp(-14 * rdt));
  const dt = freeze ? 0 : rdt * G.ts, pdt = freeze ? 0 : rdt * Math.max(G.ts, 0.5);
  G.time += dt; G.phaseT += rdt;
  updateTips(rdt);
  if (G.announce) { G.announce.t += rdt; if (G.announce.t > G.announce.dur) G.announce = null; }
  switch (G.phase) {
    case 'intro': if (G.phaseT > 1.0) { if (G.pickQueue.length) openPick(G.pickQueue[0]); else startWave(1); } break;
    case 'wave': updateWave(dt); if (!G.pendingBoss && !G.spawnQ.length && !G.portals.length && !G.enemies.length && G.phaseT > 1) waveCleared(); break;
    case 'cleared': if (G.phaseT > 2.2 && (!G.pickups.length || G.phaseT > 4.5)) { openPick(G.pickQueue[0]); return; } break;
    case 'dead': if (G.phaseT > 2.4) { endRun(false); state = 'gameover'; return; } break;
  }
  if (G.phase !== 'dead') { updateStroke(rdt); updatePlayer(pdt, rdt); }
  buildGrid();
  updateBolts(dt); updateEnemies(dt); buildGrid(); updateEProj(dt); updateConstructs(dt); updateHazards(dt); updatePortals(dt); updatePickups(pdt);
  updateParts(dt);
  G.comboT -= dt; if (G.comboT <= 0) G.combo = 0;
  // camera
  const m = mouseWorld(), lead = G.stroke ? 0 : 0.16;
  const tx = p.x + (m.x - p.x) * lead, ty = p.y + (m.y - p.y) * lead;
  const k = 1 - Math.exp(-7 * rdt); G.cam.x += (tx - G.cam.x) * k; G.cam.y += (ty - G.cam.y) * k;
  G.shake *= Math.exp(-9 * rdt); G.flash -= rdt;
  if (G.phase === 'wave' && !G.bosses.length && !G.pendingBoss) Music.target = clamp(0.45 + G.enemies.length / 60, 0.45, 0.95);
}

// endRun is idempotent by banking the difference
function bankEmbers(won) {
  if (won) G.wonOnce = true;
  const total = Math.floor(G.runEmbers + G.wave * 2 + (G.wonOnce ? 150 : 0));
  const add = total - (G.banked || 0); G.banked = total; G.finalEmbers = total;
  meta.embers += add; meta.totalEmbers += add;
}
function endRun(won) {
  bankEmbers(won);
  meta.bestWave = Math.max(meta.bestWave, G.wave); meta.bestScore = Math.max(meta.bestScore, Math.floor(G.score));
  meta.hueBest[G.hueId] = Math.max(meta.hueBest[G.hueId] || 0, G.wave);
  if (meta.kills >= 2000) unlockFeat('lightbearer');
  saveMeta();
  if (!won) Music.set('calm', 0.2);
}

let last = performance.now(), fpsVal = 60, fpsAcc = 0, fpsN = 0;
function drawCursor() {
  const col = G && state === 'playing' ? G.p.color : '#dfe6ff';
  const x = mouse.x, y = mouse.y;
  ctx.strokeStyle = col; ctx.lineWidth = 2;
  if (state === 'playing' && G.phase !== 'pick') {
    const drawing = !!G.stroke;
    ctx.beginPath(); ctx.arc(x, y, drawing ? 6 : 10, 0, TAU); ctx.stroke();
    if (!drawing) { ctx.beginPath(); ctx.moveTo(x - 16, y); ctx.lineTo(x - 6, y); ctx.moveTo(x + 6, y); ctx.lineTo(x + 16, y); ctx.moveTo(x, y - 16); ctx.lineTo(x, y - 6); ctx.moveTo(x, y + 6); ctx.lineTo(x, y + 16); ctx.stroke(); }
    ctx.fillStyle = '#fff'; ctx.fillRect(x - 1, y - 1, 2, 2);
  } else {
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 12, y + 5); ctx.lineTo(x + 5, y + 12); ctx.closePath(); ctx.fill();
  }
}

function frame(now) {
  let rdt = clamp((now - last) / 1000, 0, 0.05); last = now;
  fpsAcc += rdt; fpsN++; if (fpsAcc > 0.5) { fpsVal = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  hoverId = null;
  try {
    switch (state) {
      case 'menu': screenMenu(rdt); break;
      case 'select': screenSelect(rdt); break;
      case 'sanctum': screenSanctum(rdt); break;
      case 'codex': screenCodex(rdt); break;
      case 'settings': screenSettings(rdt); break;
      case 'paused': screenPause(rdt); break;
      case 'gameover': screenGameOver(rdt); break;
      case 'victory': screenVictory(rdt); break;
      case 'playing': {
        updateGame(rdt);
        if (state !== 'playing') break;
        drawWorld(); drawHUD(); drawAnnounce();
        if (G.phase === 'pick') drawPick();
        break;
      }
    }
    drawFeatToasts(rdt);
    drawTooltip();
    drawCursor();
  } catch (err) { console.error(err); }
  if (hoverId && hoverId !== prevHover) sfx('hover', 0.05);
  prevHover = hoverId;
  mouse.clicked = false; mouse.rclicked = false; mouse.wheel = 0;
  for (const k in pressed) delete pressed[k];
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
