  const m = a.length, n = b.length; let prev = new Array(n + 1), cur = new Array(n + 1);

}

function norm(s) {
  s = s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  s = s.replace(/\+/g, 'p').replace(/#/g, ' sharp').replace(/&/g, ' and ').replace(/['’`.]/g, '');
  s = s.replace(/[^a-z0-9]+/g, ' ').trim().replace(/^(the|a|an) /, '');
  return s.replace(/ +/g, ' ');
}
function sing(s) {
  if (s.length < 4) return s;
  if (/ies$/.test(s)) return s.slice(0, -3) + 'y';
  if (/(ches|shes|xes|sses|oes)$/.test(s)) return s.slice(0, -2);
  if (/[^s]s$/.test(s)) return s.slice(0, -1);
  return s;
}
function titleCase(s) {
  return s.replace(/\b([a-z])/g, (m, c) => c.toUpperCase()).replace(/\b(And|Of|The|To|On|In)\b/g, w => w.toLowerCase()).replace(/^./, c => c.toUpperCase());
}

const CATS = RAW.map((r, idx) => {
  const answers = [], seen = new Map();
  for (const item of r[2].split(',')) {
    const forms = item.split('/').map(x => x.trim()).filter(Boolean);
    const keys = forms.map(norm);
    const prev = keys.map(k => seen.get(k)).find(Boolean);
    if (prev) { // a spelling we already have: fold any new spellings into it
      for (const k of keys) if (!seen.has(k)) { prev.keys.push(k); prev.skeys.push(sing(k)); seen.set(k, prev); }
      continue;
    }
    const a = { label: titleCase(forms[0]), keys, skeys: keys.map(sing) };
    keys.forEach(k => seen.set(k, a));
    answers.push(a);
  }
  // Fake but stable "share of divers": a Zipf-ish curve over the list order.
  let sum = 0; const w = answers.map((a, i) => { const v = 1 / Math.pow(i + 1, 1.08); sum += v; return v; });
  answers.forEach((a, i) => { a.pct = w[i] / sum * 93; a.rank = i; });
  return { id: idx, theme: r[0], prompt: r[1], answers };
});

const TIER_ORDER = ['plankton', 'clever', 'schooler', 'rare', 'deep', 'krillion'];
function tierFor(a, krill) {
  if (!a) return 'miss';
  if (a === krill) return 'krillion';
  // by popularity rank, so long lists and short lists score alike
  if (a.rank < 4) return 'plankton';
  if (a.rank < 8) return 'clever';
  if (a.rank < 18) return 'schooler';

}
function matchAnswer(cat, input) {
  const k = norm(input); if (!k) return null;
  const sk = sing(k);
  for (const a of cat.answers) if (a.keys.includes(k) || a.skeys.includes(sk)) return a;
  let best = null, bd = 99;
  for (const a of cat.answers) for (const key of a.keys) {
    const tol = key.length >= 9 ? 2 : key.length >= 5 ? 1 : 0;
    if (!tol || Math.abs(key.length - k.length) > tol) continue;
    const d = lev(k, key);

}

function tone(f, dur, type = 'sine', vol = 0.08, delay = 0, slide = 0) {

// ---------------- drawing: the krill ----------------
function drawKrill(x, y, s, t, lamp, tilt = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(tilt); ctx.scale(s, s);
  if (lamp > 0.01) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(22, 8, 2, 40, 70, 120);
    g.addColorStop(0, `rgba(255,240,200,${0.35 * lamp})`); g.addColorStop(1, 'rgba(255,240,200,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(22, 4); ctx.lineTo(-30, 150); ctx.lineTo(120, 150); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  // antennae
  ctx.strokeStyle = 'rgba(255,170,160,0.85)'; ctx.lineWidth = 1.1;
  for (let i = 0; i < 2; i++) {
    ctx.beginPath(); ctx.moveTo(18, -3);
    ctx.bezierCurveTo(34, -14 - i * 6, 46, -10 + Math.sin(t * 3 + i) * 6, 58, -24 - i * 8 + Math.sin(t * 2 + i) * 4); ctx.stroke();
  }
  // swimmerets
  ctx.strokeStyle = 'rgba(255,140,130,0.9)'; ctx.lineWidth = 1.4;
  for (let i = 0; i < 6; i++) {
    const lx = 10 - i * 4.6, sw = Math.sin(t * 14 - i * 0.9) * 4;
    ctx.beginPath(); ctx.moveTo(lx, 4); ctx.lineTo(lx - 2 + sw, 13); ctx.stroke();
  }
  // body segments, head to tail
  const segs = 7;
  for (let i = segs - 1; i >= 0; i--) {
    const sx = 16 - i * 5.2, sy = Math.sin(t * 4 - i * 0.6) * (i * 0.25) + i * 0.6;
    const r = 7 - i * 0.6;
    const g = ctx.createLinearGradient(sx, sy - r, sx, sy + r);
    g.addColorStop(0, 'rgba(255,150,130,0.95)'); g.addColorStop(1, 'rgba(255,95,95,0.95)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(sx, sy, r * 0.9, r, 0, 0, 7); ctx.fill();
  }
  // tail fan
  const tx = 16 - segs * 5.2, ty = Math.sin(t * 4 - segs * 0.6) * 1.8 + 4;
  ctx.fillStyle = 'rgba(255,110,105,0.9)';
  ctx.beginPath(); ctx.moveTo(tx + 4, ty); ctx.lineTo(tx - 8, ty - 6); ctx.lineTo(tx - 9, ty + 1); ctx.lineTo(tx - 7, ty + 7); ctx.fill();
  // glowing photophores
  ctx.fillStyle = `rgba(140,230,255,${0.4 + 0.3 * Math.sin(t * 3)})`;
  for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(10 - i * 7, 6, 1.1, 0, 7); ctx.fill(); }
  // eye
  ctx.fillStyle = '#1a0a10'; ctx.beginPath(); ctx.arc(19, -2, 2.8, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(19.8, -2.8, 0.9, 0, 7); ctx.fill();
  ctx.restore();
}

// ---------------- UI primitives ----------------
const FONT = '"Avenir Next", "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif';
const font = (px, w = 600) => `${w} ${px}px ${FONT}`;
let buttons = [], mouse = { x: -1, y: -1 };
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function panel(x, y, w, h, a = 0.62) {
  ctx.save();

  roundRect(x, y, w, h, 18);
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, `rgba(14,40,72,${a})`); g.addColorStop(1, `rgba(4,16,34,${Math.min(1, a + 0.12)})`);
  ctx.fillStyle = g; ctx.fill();
  ctx.restore();
  // rim light: bright along the top edge, fading down the sides
  const rim = ctx.createLinearGradient(0, y, 0, y + h);
  rim.addColorStop(0, 'rgba(170,230,255,0.42)'); rim.addColorStop(0.35, 'rgba(160,220,255,0.12)'); rim.addColorStop(1, 'rgba(160,220,255,0.06)');
  roundRect(x + 0.5, y + 0.5, w - 1, h - 1, 18); ctx.strokeStyle = rim; ctx.lineWidth = 1; ctx.stroke();
  ctx.save(); roundRect(x, y, w, h, 18); ctx.clip();
  const sheen = ctx.createLinearGradient(0, y, 0, y + 40);
  sheen.addColorStop(0, 'rgba(180,235,255,0.07)'); sheen.addColorStop(1, 'rgba(180,235,255,0)');
  ctx.fillStyle = sheen; ctx.fillRect(x, y, w, 40); ctx.restore();
}
function text(s, x, y, px, col = '#eaf6ff', align = 'center', w = 600, base = 'middle') {
  ctx.font = font(px, w); ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = base; ctx.fillText(s, x, y);
}
function fitText(s, x, y, px, maxW, col, align = 'center', w = 600) {
  ctx.font = font(px, w); let size = px;
  while (size > 9 && ctx.measureText(s).width > maxW) { size -= 1; ctx.font = font(size, w); }
  text(s, x, y, size, col, align, w);
}
function wrap(s, maxW, px, w = 600) {
  ctx.font = font(px, w); const words = s.split(' '), lines = []; let line = '';
  for (const wd of words) { const t = line ? line + ' ' + wd : wd; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = wd; } else line = t; }
  if (line) lines.push(line); return lines;
}
function button(label, x, y, w, h, onClick, style = 'primary', enabled = true) {
  const hover = enabled && mouse.x >= x && mouse.x <= x + w && mouse.y >= y && mouse.y <= y + h;
  ctx.save();
  roundRect(x, y, w, h, h / 2);
  if (style === 'primary') {
    const g = ctx.createLinearGradient(x, y, x, y + h);
    g.addColorStop(0, hover ? '#ff9d8a' : '#ff8a78'); g.addColorStop(1, hover ? '#ff6f72' : '#f25c66');
    ctx.fillStyle = enabled ? g : 'rgba(120,140,160,0.4)'; ctx.fill();
  } else {
    ctx.fillStyle = hover ? 'rgba(160,220,255,0.22)' : 'rgba(160,220,255,0.1)'; ctx.fill();
    ctx.strokeStyle = 'rgba(160,220,255,0.35)'; ctx.lineWidth = 1; ctx.stroke();
  }
  ctx.restore();
  fitText(label, x + w / 2, y + h / 2 + 1, Math.min(18, h * 0.4), w - 20, style === 'primary' ? '#fff' : '#d6efff', 'center', 700);
  if (enabled) buttons.push({ x, y, w, h, onClick });
  return hover;
}

// ---------------- scenes ----------------
let shake = 0, revealT = 0, resultsT = 0;
const col = () => Math.min(W - 32, 520);

function drawTitle() {
  const cx = W / 2, cw = col(), x0 = cx - cw / 2;
  for (const b of swarm) drawKrill(b.x, b.y, b.s, time + b.a, 0, b.w > 0 ? 0.1 : -0.1);
  const ty = Math.max(playerY() + 120, H * 0.32);
  // logo
  const lsz = Math.min(76, W * 0.16);
  const lg = ctx.createLinearGradient(0, ty - lsz / 2, 0, ty + lsz / 2);
  lg.addColorStop(0, '#fff4ec'); lg.addColorStop(0.55, '#ffc2b2'); lg.addColorStop(1, '#ff7f86');
  ctx.save(); ctx.shadowColor = 'rgba(255,90,110,0.6)'; ctx.shadowBlur = 26;
  fitText('KRILLION', cx, ty, lsz, cw, lg, 'center', 800);
  ctx.restore();
  ctx.font = font(lsz, 800); const lw = Math.min(cw, ctx.measureText('KRILLION').width);
  ctx.strokeStyle = 'rgba(255,200,190,0.55)'; ctx.lineWidth = 2; ctx.beginPath();
  for (let i = 0; i <= 40; i++) { const px = cx - lw / 2 + lw * i / 40, py = ty + lsz * 0.44 + Math.sin(i * 0.9 + time * 3) * 2.5; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
  ctx.stroke();
  text('the daily dive', cx, ty + Math.min(58, W * 0.12), Math.min(20, W * 0.05), '#a8ddff', 'center', 600);
  fitText('Name something. The rarer your answer, the deeper you dive.', cx, ty + Math.min(90, W * 0.19), 15, cw, 'rgba(220,240,255,0.8)', 'center', 500);

  const d = dayNumber(), done = !!save.days[d];
  let by = ty + Math.min(126, W * 0.27); const bh = 52, gap = 12, bw = Math.min(cw, 360), bx = cx - bw / 2;
  if (!done) button(`Start Daily Dive #${d}`, bx, by, bw, bh, () => { sfxClick(); newGame('daily'); });
  else button(`Dive #${d} done · ${fmt(save.days[d].score * M_PER_POINT)} m — results`, bx, by, bw, bh, () => { sfxClick(); viewTodayResults(); });
  by += bh + gap;
  button('Endless Dive', bx, by, (bw - gap) / 2, 46, () => { sfxClick(); newGame('endless'); }, 'ghost');
  button('Themed Packs', bx + (bw + gap) / 2, by, (bw - gap) / 2, 46, () => { sfxClick(); scene = 'packs'; }, 'ghost');
  by += 46 + gap;
  button('How to play', bx, by, bw, 40, () => { sfxClick(); overlay = 'howto'; }, 'ghost');
  by += 40 + 26;
  const stats = [`🔥 Streak ${save.streak}`, `🏆 Best ${fmt(save.best)} m`, `♾️ Endless ${fmt(save.bestEndless)} m`];
  fitText(stats.join('   ·   '), cx, by, 14, cw, 'rgba(210,235,255,0.75)', 'center', 600);
  if (done) {
    const ms = msToReset(), h = Math.floor(ms / 3600000), m = Math.floor(ms / 60000) % 60, s = Math.floor(ms / 1000) % 60;
    text(`Next dive in ${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`, cx, by + 24, 13, 'rgba(210,235,255,0.6)', 'center', 500);
  }
  if (overlay === 'howto') drawHowTo();
}
function drawHowTo() {
  ctx.fillStyle = 'rgba(0,8,20,0.6)'; ctx.fillRect(0, 0, W, H);
  buttons = [];
  const cw = col(), ch = Math.min(H - 40, 500), x = W / 2 - cw / 2, y = H / 2 - ch / 2;
  panel(x, y, cw, ch, 0.92);
  let yy = y + 36;
  text('How to dive', W / 2, yy, 24, '#ffe3dc', 'center', 800); yy += 34;
  const lines = [
    `Each day brings ${PROMPTS_PER_DIVE} prompts, the same for everyone.`,
    `You get ${TIME_LIMIT} seconds per prompt to type one answer.`,
    'Common answers barely get you wet. Rare ones send you down.',
    'Every point dives you 10 metres deeper.',
    'Each prompt hides one secret answer worth 100: One in a Krillion.',
    'Answer not on our list? You get a red warning and can try again.',
  ];
  for (const l of lines) for (const w of wrap(l, cw - 48, 14, 500)) { text(w, W / 2, yy, 14, 'rgba(225,242,255,0.9)', 'center', 500); yy += 20; }
  yy += 10;
  const tiers = ['plankton', 'clever', 'schooler', 'rare', 'deep', 'krillion', 'miss'];
  const rowH = Math.min(30, (y + ch - 90 - yy) / tiers.length);
  for (const k of tiers) {
    const t = TIERS[k];
    roundRect(x + 24, yy - rowH / 2 + 2, cw - 48, rowH - 4, 8); ctx.fillStyle = 'rgba(160,220,255,0.07)'; ctx.fill();
    text(t.emo, x + 44, yy, 15, '#fff', 'center');
    text(t.name, x + 64, yy, 15, t.col, 'left', 700);
    text(k === 'miss' ? 'pass / timeout' : `${t.pts} pts · ${t.pts * M_PER_POINT} m`, x + cw - 36, yy, 13, 'rgba(220,240,255,0.75)', 'right', 600);
    yy += rowH;
  }
  button('Got it', W / 2 - 80, y + ch - 66, 160, 46, () => { sfxClick(); overlay = null; });
}
function drawPacks() {
  const cx = W / 2, cw = col(), keys = Object.keys(THEMES);
  const top = Math.max(playerY() + 60, 110);
  ctx.save(); ctx.shadowColor = 'rgba(0,30,60,0.75)'; ctx.shadowBlur = 10;
  text('Themed Packs', cx, top, 28, '#ffffff', 'center', 800);
  text(`${PROMPTS_PER_DIVE} prompts from one current. Unlimited dives.`, cx, top + 30, 14, '#eaf6ff', 'center', 600);
  ctx.restore();
  const bh = Math.min(62, (H - top - 150) / keys.length - 10);
  let y = top + 58;
  for (const k of keys) {
    const th = THEMES[k], x = cx - cw / 2;
    const hover = mouse.x >= x && mouse.x <= x + cw && mouse.y >= y && mouse.y <= y + bh;
    panel(x, y, cw, bh, hover ? 0.8 : 0.55);
    text(th.icon, x + 34, y + bh / 2, Math.min(26, bh * 0.45), '#fff');
    text(th.name, x + 64, y + bh / 2 - (bh > 48 ? 9 : 0), 18, '#eaf6ff', 'left', 700);
    if (bh > 48) text(th.blurb, x + 64, y + bh / 2 + 12, 13, 'rgba(200,230,255,0.7)', 'left', 500);
    text('›', x + cw - 26, y + bh / 2, 26, 'rgba(200,230,255,0.7)');
    buttons.push({ x, y, w: cw, h: bh, onClick: () => { sfxClick(); newGame('pack', { theme: k }); } });
    y += bh + 10;
  }
  button('‹ Back', cx - 70, y + 10, 140, 42, () => { sfxClick(); scene = 'title'; }, 'ghost');
}

function hud() {
  const g = game, cw = col(), x0 = W / 2 - cw / 2;
  const depth = Math.max(0, cam);
  // left: progress
  let label;
  if (g.mode === 'endless') label = `ENDLESS · #${g.idx + 1}`;
  else label = `${g.mode === 'daily' ? 'DIVE #' + g.day : THEMES[g.theme].name.toUpperCase()} · ${Math.min(g.idx + 1, g.prompts.length)}/${g.prompts.length}`;
  fitText(label, x0, 26, 13, cw * 0.55, 'rgba(220,240,255,0.85)', 'left', 700);
  // right: depth
  text(`${fmt(depth)} m`, x0 + cw, 26, 20, '#ffffff', 'right', 800);
  text(zoneAt(depth).name, x0 + cw, 46, 11, 'rgba(180,225,255,0.75)', 'right', 600);
  // pips
  if (g.mode === 'endless') {
    for (let i = 0; i < ENDLESS_LIVES; i++) text(i < g.lives ? '🫧' : '·', x0 + 8 + i * 22, 48, 15, i < g.lives ? '#fff' : 'rgba(255,255,255,0.35)', 'center');
  } else {
    for (let i = 0; i < g.prompts.length; i++) {
      const r = g.rows[i], cx = x0 + 6 + i * 18;
      ctx.beginPath(); ctx.arc(cx, 48, 5, 0, 7);
      ctx.fillStyle = r ? TIERS[r.tier].col : i === g.idx ? 'rgba(255,255,255,0.55)' : 'rgba(255,255,255,0.15)'; ctx.fill();
    }
  }
}
let inputBox = { x: 0, y: 0, w: 0, h: 0 };
function layoutInput() {
  inputEl.style.left = inputBox.x + 'px'; inputEl.style.top = inputBox.y + 'px';
  inputEl.style.width = inputBox.w + 'px'; inputEl.style.height = inputBox.h + 'px';
}
function promptCardGeom(h) {
  const cw = col(), x = W / 2 - cw / 2;
  const y = clamp(playerY() + 80, 120, Math.max(120, H - h - 16));
  return { x, y, w: cw, h };
}
function drawPlay(dt) {
  const g = game, p = current();
  if (!(overlay === 'pause')) g.timeLeft -= dt;
  if (g.timeLeft <= 0) { g.timeLeft = 0; submitAnswer('timeout'); return; }
  const lines = wrap(p.cat.prompt, col() - 48, 30, 800);
  const ch = 248 + lines.length * 36;
  const { x, y, w, h } = promptCardGeom(ch);
  const sx = shake > 0 ? Math.sin(time * 70) * shake * 18 : 0;
  ctx.save(); ctx.translate(sx, 0);
  panel(x, y, w, h, 0.8);
  text(`PROMPT ${g.idx + 1}`, x + 24, y + 28, 12, 'rgba(160,220,255,0.75)', 'left', 700);
  const th = THEMES[p.cat.theme]; text(`${th.icon} ${th.name}`, x + w - 24, y + 28, 12, 'rgba(160,220,255,0.6)', 'right', 600);
  let yy = y + 66;
  for (const l of lines) { text(l, W / 2, yy, 30, '#ffffff', 'center', 800); yy += 36; }
  yy += 4;
  // timer bar
  const frac = g.timeLeft / TIME_LIMIT, barW = w - 48;
  roundRect(x + 24, yy, barW, 8, 4); ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fill();
  roundRect(x + 24, yy, Math.max(8, barW * frac), 8, 4);
  ctx.fillStyle = frac > 0.5 ? '#6fe3ff' : frac > 0.25 ? '#ffd36e' : '#ff6f7d'; ctx.fill();
  text(`${Math.ceil(g.timeLeft)}s`, x + w - 24, yy + 22, 12, frac > 0.25 ? 'rgba(220,240,255,0.7)' : '#ff8f99', 'right', 700);
  if (frac < 0.25 && Math.floor(g.timeLeft * 2) !== Math.floor((g.timeLeft + dt) * 2)) tone(880, 0.05, 'square', 0.02);
  yy += 34;
  // input box
  inputBox = { x: x + 24 + sx, y: yy, w: w - 48 - 110, h: 50 };
  roundRect(x + 24, yy, inputBox.w, 50, 12);
  ctx.fillStyle = 'rgba(0,10,25,0.55)'; ctx.fill();
  const focused = document.activeElement === inputEl;
  ctx.strokeStyle = focused ? 'rgba(111,227,255,0.8)' : 'rgba(160,220,255,0.3)'; ctx.lineWidth = focused ? 2 : 1; ctx.stroke();
  const val = inputEl.value;
  ctx.save(); roundRect(x + 24, yy, inputBox.w, 50, 12); ctx.clip();
  ctx.font = font(20, 600);
  const tw = ctx.measureText(val).width, maxTw = inputBox.w - 30, offX = Math.min(0, maxTw - tw);
  if (val) text(val, x + 38 + offX, yy + 26, 20, '#fff', 'left', 600);
  else text(focused ? '' : 'Tap here and type…', x + 38, yy + 26, 17, 'rgba(200,230,255,0.4)', 'left', 500);
  if (focused && Math.floor(time * 2) % 2 === 0) {
    let cx = x + 38 + offX + tw;
    if (inputEl.selectionStart != null && inputEl.selectionStart < val.length) { ctx.font = font(20, 600); cx = x + 38 + offX + ctx.measureText(val.slice(0, inputEl.selectionStart)).width; }
    ctx.fillStyle = '#6fe3ff'; ctx.fillRect(cx + 1, yy + 13, 2, 26);
  }
  ctx.restore();
  button('Dive ▾', x + w - 24 - 100, yy, 100, 50, () => submitAnswer());
  yy += 70;
  if (g.err) {
    g.errT += dt;
    const a = g.errT < 0.15 ? g.errT / 0.15 : 1;
    ctx.globalAlpha = a;
    fitText(g.err, W / 2, yy - 2, 15, w - 48, '#ff5d6c', 'center', 700);
    ctx.globalAlpha = 1;
  }
  yy += 20;
  button('Pass', x + 24, yy, 90, 34, () => submitAnswer('pass'), 'ghost');
  text('Enter to dive', x + w - 24, yy + 17, 12, 'rgba(200,230,255,0.5)', 'right', 500);
  ctx.restore();
  layoutInput();
}
function drawReveal(dt) {
  const g = game, r = g.rows[g.rows.length - 1], t = TIERS[r.tier];
  revealT += dt;
  const cw = col(), x = W / 2 - cw / 2;
  const isLast = g.mode === 'endless' ? g.lives <= 0 : g.idx + 1 >= g.prompts.length;
  const ch = 300;
  const { y } = promptCardGeom(ch);
  panel(x, y, cw, ch, 0.8);
  fitText(r.prompt, W / 2, y + 26, 13, cw - 48, 'rgba(160,220,255,0.75)', 'center', 700);
  // tier stamp
  const pop = 1 + Math.max(0, 0.35 - revealT) * 1.6;
  ctx.save(); ctx.translate(W / 2, y + 66); ctx.scale(pop, pop);
  if (r.tier === 'krillion') { ctx.shadowColor = '#ffb6e6'; ctx.shadowBlur = 20 + Math.sin(time * 6) * 8; }
  fitText(`${t.emo} ${t.name}`, 0, 0, 32, cw - 40, t.col, 'center', 800);
  ctx.restore();
  const shown = Math.min(t.pts, Math.floor(revealT * 160));
  text(r.tier === 'miss' ? (r.passed ? 'Passed' : r.timedOut ? 'Out of air!' : 'Not on our reef') : `+${shown} pts  ·  ${shown * M_PER_POINT} m deeper`, W / 2, y + 104, 16, '#fff', 'center', 700);
  let yy = y + 138;
  if (r.ans) {
    const pct = r.tier === 'krillion' ? 'only you and a handful of divers' : `${r.ans.pct < 1 ? r.ans.pct.toFixed(1) : Math.round(r.ans.pct)}% of divers said this`;
    fitText(`“${r.ans.label}” — ${pct}`, W / 2, yy, 15, cw - 48, 'rgba(230,245,255,0.92)', 'center', 600);
  } else if (r.input) {
    fitText(`“${r.input}” isn't on our list for this prompt.`, W / 2, yy, 15, cw - 48, 'rgba(230,245,255,0.8)', 'center', 500);
  } else fitText(r.passed ? 'You let this one drift by.' : 'The clock ran out before you answered.', W / 2, yy, 15, cw - 48, 'rgba(230,245,255,0.8)', 'center', 500);
  yy += 30;
  const top3 = r.cat.answers.slice(0, 3).map(a => `${a.label} ${Math.round(a.pct)}%`).join(' · ');
  fitText(`Most common: ${top3}`, W / 2, yy, 13, cw - 48, 'rgba(180,220,255,0.7)', 'center', 500);
  yy += 24;
  if (r.tier !== 'krillion') fitText(`One in a Krillion was: ${r.krill.label} 🦐`, W / 2, yy, 13, cw - 48, '#ffcdee', 'center', 600);
  else fitText('You found the secret answer!', W / 2, yy, 13, cw - 48, '#ffcdee', 'center', 700);
  const label = isLast ? 'Surface results ▸' : 'Keep diving ▾';
  button(label, W / 2 - 110, y + ch - 70, 220, 50, nextPrompt);
  if (g.mode === 'endless' && r.tier === 'miss') text(g.lives > 0 ? `${g.lives} air bubble${g.lives === 1 ? '' : 's'} left` : 'Out of air bubbles', W / 2, y + ch - 10, 12, '#ff9aa6', 'center', 600);
}
function drawResults(dt) {
  const g = game; resultsT += dt;
  const cw = col(), x = W / 2 - cw / 2;
  const depth = g.score * M_PER_POINT;
  const rows = g.rows.slice(-8), extra = g.rows.length - rows.length;
  const rowH = 30;
  const ch = Math.min(H - 24, 196 + rows.length * rowH + (extra ? 16 : 0) + 84);
  const y = clamp(playerY() + 70, 12, Math.max(12, H - ch - 12));
  panel(x, y, cw, ch, 0.75);
  const title = g.mode === 'daily' ? `Daily Dive #${g.day}` : g.mode === 'pack' ? `${THEMES[g.theme].name} Pack` : 'Endless Dive';
  text(title, W / 2, y + 28, 14, 'rgba(160,220,255,0.8)', 'center', 700);
  const shownD = Math.min(depth, Math.floor(resultsT * Math.max(1500, depth * 0.9)));
  text(`${fmt(shownD)} m`, W / 2, y + 72, 46, '#ffffff', 'center', 800);
  text(`${zoneAt(depth).name} · ${g.score} pts`, W / 2, y + 108, 15, '#a8ddff', 'center', 600);
  if (g.mode === 'endless' && g.newBest) text('New endless record!', W / 2, y + 130, 13, '#ffe36e', 'center', 700);
  text(g.rows.map(r => TIERS[r.tier].emo).join(' '), W / 2, y + 156, 18, '#fff', 'center');
  let yy = y + 190;
  if (extra) { text(`…${extra} earlier prompt${extra === 1 ? '' : 's'}`, W / 2, yy - 4, 12, 'rgba(200,230,255,0.5)', 'center', 500); yy += 16; }
  for (const r of rows) {
    roundRect(x + 18, yy - rowH / 2 + 2, cw - 36, rowH - 4, 8); ctx.fillStyle = 'rgba(160,220,255,0.06)'; ctx.fill();
    const t = TIERS[r.tier];
    fitText(r.prompt.replace(/^Name (a|an) /, ''), x + 30, yy, 13, cw * 0.36, 'rgba(200,230,255,0.75)', 'left', 600);
    fitText(r.ans ? r.ans.label : (r.input || '—'), x + 30 + cw * 0.38, yy, 14, cw * 0.36, r.ans ? '#fff' : 'rgba(255,255,255,0.45)', 'left', 700);
    text(String(r.pts), x + cw - 30, yy, 14, t.col, 'right', 800);
    yy += rowH;
  }
  yy = y + ch - 66;
  const bw = (cw - 48 - 12) / 2;
  button('Share 🦐', x + 24, yy, bw, 48, () => { sfxClick(); share(); });
  if (g.mode === 'daily') button('Home', x + 36 + bw, yy, bw, 48, () => { sfxClick(); goHome(); }, 'ghost');
  else button('Dive again', x + 36 + bw, yy, bw, 48, () => { sfxClick(); newGame(g.mode, { theme: g.theme }); }, 'ghost');
  if (g.mode !== 'daily') { button('Home', x + cw - 74, y + 12, 58, 30, () => { sfxClick(); goHome(); }, 'ghost'); }
  else {
    const ms = msToReset(), h = Math.floor(ms / 3600000), m = Math.floor(ms / 60000) % 60;
    text(`🔥 ${save.streak} day streak · next dive in ${h}h ${m}m`, W / 2, y + ch - 8 - 2, 11, 'rgba(200,230,255,0.6)', 'center', 500, 'bottom');
  }
}
function drawDepthGauge() {
  if (scene === 'title' || scene === 'packs') return;
  const gx = W - 10, gy0 = 70, gy1 = H - 30, max = 7000;
  if (W < 420) return;
  ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(gx - 2, gy0, 3, gy1 - gy0);
  for (const z of ZONES.slice(2)) {
    const yy = gy0 + (z.from / max) * (gy1 - gy0);
    ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(gx - 6, yy, 8, 1);
  }
  const yy = gy0 + clamp(Math.max(0, cam) / max, 0, 1) * (gy1 - gy0);
  ctx.fillStyle = '#ff8a78'; ctx.beginPath(); ctx.moveTo(gx - 3, yy); ctx.lineTo(gx - 11, yy - 5); ctx.lineTo(gx - 11, yy + 5); ctx.fill();
}
function drawMute() {
  const s = 34, x = W - s - 12, y = H - s - 12;
  roundRect(x, y, s, s, s / 2); ctx.fillStyle = 'rgba(160,220,255,0.12)'; ctx.fill();
  text(save.muted ? '🔇' : '🔊', x + s / 2, y + s / 2 + 1, 15, '#fff');
  buttons.push({ x, y, w: s, h: s, onClick: () => { save.muted = !save.muted; persist(); if (!save.muted) sfxClick(); } });
}

// ---------------- main loop ----------------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
  shake = Math.max(0, shake - dt);
  updateWorld(dt);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buttons = [];
  drawBackground();
  drawCaustics();
  drawWalls();
  for (const c of creatures) drawCreature(c, false);
  drawDarkness();
  for (const c of creatures) drawCreature(c, true);
  drawSnow();
  updateBanner(dt);
  // the player krill (and a little bubble trail while descending)
  if (scene !== 'title' && scene !== 'packs') {
    const desc = camTarget - cam;
    if (desc > 5 && rnd() < dt * 14) bubbles.push({ x: W / 2 + rr(-8, 8), y: playerY() + 2, v: rr(40, 90), r: rr(1.5, 4), life: 3 });
    const lamp = clamp((cam - 300) / 1200, 0, 1);
    drawKrill(W / 2, playerY() + Math.sin(time * 1.6) * 4, 1.35, time, lamp, clamp(desc * 0.002, 0, 0.6));
  }
  ctx.strokeStyle = 'rgba(220,245,255,0.6)'; ctx.lineWidth = 1;
  for (const b of bubbles) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.stroke(); }
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const f of fx) { ctx.globalAlpha = clamp(f.life / f.max, 0, 1); ctx.fillStyle = f.col; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 7); ctx.fill(); }
  ctx.restore(); ctx.globalAlpha = 1;
  drawVignette();
  drawDepthGauge();
  if (scene === 'play' || scene === 'reveal') drawBanner();

  if (scene === 'title') drawTitle();
  else if (scene === 'packs') drawPacks();
  else if (scene === 'play') { hud(); drawPlay(dt); }
  else if (scene === 'reveal') { hud(); drawReveal(dt); }
  else if (scene === 'results') drawResults(dt);
  if (overlay !== 'howto') drawMute();

  if (toast.t > 0) {
    toast.t -= dt; ctx.globalAlpha = clamp(toast.t * 2, 0, 1);
    ctx.font = font(14, 700); const tw = ctx.measureText(toast.text).width + 36;
    roundRect(W / 2 - tw / 2, H - 70, tw, 38, 19); ctx.fillStyle = 'rgba(6,22,44,0.92)'; ctx.fill();
    text(toast.text, W / 2, H - 50, 14, '#fff', 'center', 700); ctx.globalAlpha = 1;
  }
  canvasCursor();
  requestAnimationFrame(frame);
}
function canvasCursor() {
  const over = buttons.some(b => mouse.x >= b.x && mouse.x <= b.x + b.w && mouse.y >= b.y && mouse.y <= b.y + b.h);
  cv.style.cursor = over ? 'pointer' : 'default';
}

// ---------------- input ----------------
function hit(x, y) {
  for (let i = buttons.length - 1; i >= 0; i--) { const b = buttons[i]; if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b; }
  return null;
}
cv.addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
cv.addEventListener('pointerleave', () => { mouse.x = mouse.y = -1; });
cv.addEventListener('pointerdown', e => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  const b = hit(e.clientX, e.clientY);
  if (b) { e.preventDefault(); b.onClick(); }
  else if (scene === 'play') { try { inputEl.focus({ preventScroll: true }); } catch (er) {} }
});
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); if (!e.repeat) submitAnswer(); }
  if (e.key === 'Escape') { inputEl.blur(); }
});
addEventListener('keydown', e => {
  if (e.target === inputEl || e.repeat) return;
  if (e.key === 'Enter' || e.key === ' ') {
    if (scene === 'reveal') { e.preventDefault(); nextPrompt(); }
    else if (scene === 'play') { e.preventDefault(); inputEl.focus(); }
    else if (scene === 'title' && overlay === 'howto') { overlay = null; }
    else if (scene === 'title' && !save.days[dayNumber()]) { sfxClick(); newGame('daily'); }
  } else if (e.key === 'Escape') {
    if (overlay) overlay = null; else if (scene === 'packs') scene = 'title';
  } else if (scene === 'play' && e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
    inputEl.focus(); // typed while unfocused: steer the keystroke into the box
  }
});

resize();
requestAnimationFrame(frame);
</script>
