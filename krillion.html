  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }

  const m = a.length, n = b.length; let prev = new Array(n + 1), cur = new Array(n + 1);

}

function norm(s) {
  s = s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  s = s.replace(/\+/g, 'p').replace(/#/g, ' sharp').replace(/&/g, ' and ').replace(/['’`.]/g, '');
  s = s.replace(/[^a-z0-9]+/g, ' ').trim().replace(/^(the|a|an) /, '');
  return s.replace(/ +/g, ' ');
}
function sing(s) {
  if (s.length < 4) return s;
  if (/ies$/.test(s)) return s.slice(0, -3) + 'y';
  if (/(ches|shes|xes|sses|oes)$/.test(s)) return s.slice(0, -2);
  if (/[^s]s$/.test(s)) return s.slice(0, -1);
  return s;
}
function titleCase(s) {
  return s.replace(/\b([a-z])/g, (m, c) => c.toUpperCase()).replace(/\b(And|Of|The|To|On|In)\b/g, w => w.toLowerCase()).replace(/^./, c => c.toUpperCase());
}

const CATS = RAW.map((r, idx) => {
  const answers = [], seen = new Set();
  for (const item of r[2].split(',')) {
    const forms = item.split('/').map(x => x.trim()).filter(Boolean);
    const keys = forms.map(norm);
    if (keys.some(k => seen.has(k))) continue;
    keys.forEach(k => seen.add(k));
    answers.push({ label: titleCase(forms[0]), keys, skeys: keys.map(sing) });
  }
  // Fake but stable "share of divers": a Zipf-ish curve over the list order.
  let sum = 0; const w = answers.map((a, i) => { const v = 1 / Math.pow(i + 1, 1.08); sum += v; return v; });
  answers.forEach((a, i) => { a.pct = w[i] / sum * 93; a.rank = i; });
  return { id: idx, theme: r[0], prompt: r[1], answers };
});

const TIERS = {
  miss:     { name: 'Washed Out', pts: 0, col: '#8494ab', emo: '⬛' },
  plankton: { name: 'Plankton', pts: 10, col: '#8fe3ff', emo: '🟦' },
  clever:   { name: 'Too Clever', pts: 15, col: '#7ef0c2', emo: '🟩' },
  schooler: { name: 'Schooler', pts: 30, col: '#ffe36e', emo: '🟨' },

  deep:     { name: 'Deep Cut', pts: 85, col: '#ff6f7d', emo: '🟥' },
  krillion: { name: 'One in a Krillion', pts: 100, col: '#ffb6e6', emo: '🦐' },
};
const TIER_ORDER = ['plankton', 'clever', 'schooler', 'rare', 'deep', 'krillion'];
function tierFor(a, krill) {
  if (!a) return 'miss';
  if (a === krill) return 'krillion';
  if (a.pct >= 7) return 'plankton';
  if (a.pct >= 4) return 'clever';
  if (a.pct >= 1.6) return 'schooler';
  if (a.pct >= 0.7) return 'rare';
  return 'deep';
}
function matchAnswer(cat, input) {
  const k = norm(input); if (!k) return null;
  const sk = sing(k);
  for (const a of cat.answers) if (a.keys.includes(k) || a.skeys.includes(sk)) return a;
  let best = null, bd = 99;
  for (const a of cat.answers) for (const key of a.keys) {
    const tol = key.length >= 9 ? 2 : key.length >= 5 ? 1 : 0;
    if (!tol || Math.abs(key.length - k.length) > tol) continue;
    const d = lev(k, key);
    if (d <= tol && d < bd) { bd = d; best = a; }
  }
  return best;
}
function pickKrillion(cat, r) {
  const n = cat.answers.length, from = Math.floor(n * 0.6);
  return cat.answers[from + Math.floor(r() * (n - from))];
}

let actx = null;
function tone(f, dur, type = 'sine', vol = 0.08, delay = 0, slide = 0) {
  if (save.muted) return;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const t0 = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.05);
  } catch (e) {}
}
function sfxTier(t) {
  const lvl = TIER_ORDER.indexOf(t);
  if (lvl < 0) { tone(220, 0.35, 'triangle', 0.07, 0, 0.6); return; }
  const base = [330, 392, 440, 523, 587, 659][lvl];
  for (let i = 0; i <= Math.min(lvl, 4); i++) tone(base * Math.pow(1.26, i), 0.22, 'sine', 0.06, i * 0.07);
  if (t === 'krillion') for (let i = 0; i < 6; i++) tone(1046 * Math.pow(1.12, i), 0.3, 'triangle', 0.04, 0.4 + i * 0.06);
}
const sfxClick = () => tone(660, 0.06, 'square', 0.025);

const PROMPTS_PER_DIVE = 7, TIME_LIMIT = 20, M_PER_POINT = 10, ENDLESS_LIVES = 3;
let scene = 'title';         // title | howto | packs | play | reveal | results
let overlay = null;          // 'howto' drawn over title
let game = null;
let toast = { text: '', t: 0 };
let camTarget = -150, cam = -150;
let time = 0;

function newGame(mode, opts = {}) {
  const day = dayNumber();
  let list = [], rng;
  if (mode === 'daily') {
    rng = mulberry32(day * 9973 + 17);
    list = shuffle(CATS.map(c => c.id), rng).slice(0, PROMPTS_PER_DIVE);
  } else if (mode === 'pack') {
    rng = Math.random;
    list = shuffle(CATS.filter(c => c.theme === opts.theme).map(c => c.id), rng).slice(0, PROMPTS_PER_DIVE);
  } else {
    rng = Math.random;
    list = shuffle(CATS.map(c => c.id), rng);
  }
  const prompts = list.map(id => ({ cat: CATS[id], krill: pickKrillion(CATS[id], rng) }));
  game = { mode, theme: opts.theme, day, prompts, idx: 0, score: 0, shownScore: 0, rows: [], lives: ENDLESS_LIVES, timeLeft: TIME_LIMIT, rng };
  camTarget = 0;
  startPrompt();
}
function current() { return game.prompts[game.idx]; }
function startPrompt() {
  if (game.mode === 'endless' && game.idx >= game.prompts.length) {
    // ran through the whole reef: reshuffle another lap
    const more = shuffle(CATS.map(c => c.id), Math.random).map(id => ({ cat: CATS[id], krill: pickKrillion(CATS[id], Math.random) }));
    game.prompts.push(...more);
  }
  game.timeLeft = TIME_LIMIT;
  scene = 'play';
  inputEl.value = '';
  inputEl.style.display = 'block';
  layoutInput();
  try { inputEl.focus({ preventScroll: true }); } catch (e) { inputEl.focus(); }
}
function submitAnswer(how) { // how: undefined (typed), 'timeout' or 'pass'
  if (scene !== 'play') return;
  const timedOut = !!how, p = current(), raw = timedOut ? '' : inputEl.value.trim();
  if (!timedOut && !raw) { shake = 0.35; tone(180, 0.08, 'square', 0.03); return; }
  const a = matchAnswer(p.cat, raw);
  const tier = tierFor(a, p.krill);
  const pts = TIERS[tier].pts;
  const row = { prompt: p.cat.prompt, cat: p.cat, krill: p.krill, input: raw, ans: a, tier, pts, timedOut, passed: how === 'pass' };
  game.rows.push(row);
  game.score += pts;
  if (tier === 'miss' && game.mode === 'endless') game.lives--;
  camTarget = game.score * M_PER_POINT;
  scene = 'reveal'; revealT = 0;
  inputEl.blur(); inputEl.style.display = 'none';
  sfxTier(tier);
  burst(tier);
}
function nextPrompt() {
  if (scene !== 'reveal') return;
  sfxClick();
  game.idx++;
  const over = game.mode === 'endless' ? game.lives <= 0 : game.idx >= game.prompts.length;
  if (over) finishGame(); else startPrompt();
}
function finishGame() {
  scene = 'results'; resultsT = 0;
  if (game.mode === 'daily') {
    const d = game.day;
    if (!save.days[d]) {
      save.days[d] = { score: game.score, rows: game.rows.map(r => ({ p: r.prompt, a: r.ans ? r.ans.label : r.input, t: r.tier, pts: r.pts })) };
      save.played++;
      save.streak = save.lastDay === d - 1 ? save.streak + 1 : 1;
      save.maxStreak = Math.max(save.maxStreak, save.streak);
      save.lastDay = d;
      save.best = Math.max(save.best, game.score * M_PER_POINT);
    }
  } else if (game.mode === 'endless') {
    game.newBest = game.score * M_PER_POINT > save.bestEndless;
    save.bestEndless = Math.max(save.bestEndless, game.score * M_PER_POINT);
  }
  persist();
  tone(523, 0.2, 'sine', 0.06); tone(659, 0.2, 'sine', 0.06, 0.12); tone(784, 0.4, 'sine', 0.06, 0.24);
}
function goHome() {
  scene = 'title'; overlay = null; game = null; camTarget = -150;
  inputEl.blur(); inputEl.style.display = 'none';
}
function viewTodayResults() {
  const d = dayNumber(), rec = save.days[d]; if (!rec) return;
  game = { mode: 'daily', day: d, score: rec.score, shownScore: rec.score, prompts: [], idx: 0, lives: 0, fromSave: true,
    rows: rec.rows.map(r => ({ prompt: r.p, input: r.a, ans: r.t === 'miss' ? null : { label: r.a }, tier: r.t, pts: r.pts })) };
  camTarget = rec.score * M_PER_POINT;
  scene = 'results'; resultsT = 0;
}
function shareText() {
  const g = game, depth = g.score * M_PER_POINT;
  const head = g.mode === 'daily' ? `Krillion 🦐 Daily Dive #${g.day}` : g.mode === 'pack' ? `Krillion 🦐 ${THEMES[g.theme].name} pack` : `Krillion 🦐 Endless Dive`;
  const grid = g.rows.map(r => TIERS[r.tier].emo).join('');
  return `${head}\n🌊 ${fmt(depth)} m · ${zoneAt(depth).name}\n${grid}  ${g.score} pts\nRarer answers dive deeper.`;
}
function share() {
  const text = shareText();

    try {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done();
    } catch (e) { showToast('Could not copy'); }

  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}

const ZONES = [
  { from: -1e9, name: 'The Surface' },
  { from: 1, name: 'Sunlight Zone' },
  { from: 200, name: 'Twilight Zone' },
  { from: 1000, name: 'Midnight Zone' },

function zoneAt(d) { let z = ZONES[0]; for (const q of ZONES) if (d >= q.from) z = q; return z; }
const DEPTH_COLS = [[-200, [120, 205, 240]], [0, [44, 168, 214]], [150, [20, 120, 176]], [500, [12, 74, 128]], [1200, [8, 40, 79]], [3000, [4, 20, 46]], [6000, [2, 8, 22]], [12000, [1, 2, 8]]];
function depthColor(d) {
  if (d <= DEPTH_COLS[0][0]) return DEPTH_COLS[0][1];
  for (let i = 1; i < DEPTH_COLS.length; i++) {
    const [d1, c1] = DEPTH_COLS[i];
    if (d <= d1) {
      const [d0, c0] = DEPTH_COLS[i - 1], t = (d - d0) / (d1 - d0);
      return [lerp(c0[0], c1[0], t), lerp(c0[1], c1[1], t), lerp(c0[2], c1[2], t)];
    }
  }
  return DEPTH_COLS[DEPTH_COLS.length - 1][1];
}

// ---------------- drawing: background ----------------
function drawBackground() {

    sky.addColorStop(0, '#5ec2f2'); sky.addColorStop(1, '#d9f3ff');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, sY + 1);

    ctx.fillStyle = 'rgba(255,255,255,0.8)';

    }

    for (let x = 0; x <= W + 10; x += 10) ctx.lineTo(x, sY + Math.sin(x * 0.03 + time * 2) * 4 + Math.sin(x * 0.011 - time) * 3);
    ctx.lineTo(W, H); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.65)'; ctx.lineWidth = 2; ctx.beginPath();
    for (let x = 0; x <= W + 10; x += 10) { const y = sY + Math.sin(x * 0.03 + time * 2) * 4 + Math.sin(x * 0.011 - time) * 3; x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }

function drawSnow() {

// ---------------- drawing: creatures ----------------
function shadeFor(d, col) { // darker & bluer with depth

      ctx.beginPath(); ctx.ellipse(26, 0, 7, 5, 0, 0, 7); ctx.fill();

        ctx.strokeStyle = '#2b3245'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(6, -16); ctx.quadraticCurveTo(20, -36, lx, ly); ctx.stroke();

        ctx.fillStyle = '#dfe6f0'; for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(10 + i * 4, 4); ctx.lineTo(12 + i * 4, 9); ctx.lineTo(14 + i * 4, 4); ctx.fill(); }

// ---------------- drawing: the krill ----------------
function drawKrill(x, y, s, t, lamp, tilt = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(tilt); ctx.scale(s, s);
  if (lamp > 0.01) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(22, 8, 2, 40, 70, 120);
    g.addColorStop(0, `rgba(255,240,200,${0.35 * lamp})`); g.addColorStop(1, 'rgba(255,240,200,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(22, 4); ctx.lineTo(-30, 150); ctx.lineTo(120, 150); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  // antennae
  ctx.strokeStyle = 'rgba(255,170,160,0.85)'; ctx.lineWidth = 1.1;
  for (let i = 0; i < 2; i++) {
    ctx.beginPath(); ctx.moveTo(18, -3);
    ctx.bezierCurveTo(34, -14 - i * 6, 46, -10 + Math.sin(t * 3 + i) * 6, 58, -24 - i * 8 + Math.sin(t * 2 + i) * 4); ctx.stroke();
  }
  // swimmerets
  ctx.strokeStyle = 'rgba(255,140,130,0.9)'; ctx.lineWidth = 1.4;
  for (let i = 0; i < 6; i++) {
    const lx = 10 - i * 4.6, sw = Math.sin(t * 14 - i * 0.9) * 4;
    ctx.beginPath(); ctx.moveTo(lx, 4); ctx.lineTo(lx - 2 + sw, 13); ctx.stroke();
  }
  // body segments, head to tail
  const segs = 7;
  for (let i = segs - 1; i >= 0; i--) {
    const sx = 16 - i * 5.2, sy = Math.sin(t * 4 - i * 0.6) * (i * 0.25) + i * 0.6;
    const r = 7 - i * 0.6;
    const g = ctx.createLinearGradient(sx, sy - r, sx, sy + r);
    g.addColorStop(0, 'rgba(255,150,130,0.95)'); g.addColorStop(1, 'rgba(255,95,95,0.95)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(sx, sy, r * 0.9, r, 0, 0, 7); ctx.fill();
  }
  // tail fan
  const tx = 16 - segs * 5.2, ty = Math.sin(t * 4 - segs * 0.6) * 1.8 + 4;
  ctx.fillStyle = 'rgba(255,110,105,0.9)';
  ctx.beginPath(); ctx.moveTo(tx + 4, ty); ctx.lineTo(tx - 8, ty - 6); ctx.lineTo(tx - 9, ty + 1); ctx.lineTo(tx - 7, ty + 7); ctx.fill();
  // glowing photophores
  ctx.fillStyle = `rgba(140,230,255,${0.4 + 0.3 * Math.sin(t * 3)})`;
  for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(10 - i * 7, 6, 1.1, 0, 7); ctx.fill(); }
  // eye
  ctx.fillStyle = '#1a0a10'; ctx.beginPath(); ctx.arc(19, -2, 2.8, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(19.8, -2.8, 0.9, 0, 7); ctx.fill();
  ctx.restore();

  for (const b of bubbles) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.stroke(); }
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const f of fx) { ctx.globalAlpha = clamp(f.life / f.max, 0, 1); ctx.fillStyle = f.col; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 7); ctx.fill(); }
  ctx.restore(); ctx.globalAlpha = 1;
  drawDepthGauge();

  if (scene === 'title') drawTitle();
  else if (scene === 'packs') drawPacks();
  else if (scene === 'play') { hud(); drawPlay(dt); }
  else if (scene === 'reveal') { hud(); drawReveal(dt); }
  else if (scene === 'results') drawResults(dt);
  if (overlay !== 'howto') drawMute();

  if (toast.t > 0) {
    toast.t -= dt; ctx.globalAlpha = clamp(toast.t * 2, 0, 1);
    ctx.font = font(14, 700); const tw = ctx.measureText(toast.text).width + 36;
    roundRect(W / 2 - tw / 2, H - 70, tw, 38, 19); ctx.fillStyle = 'rgba(6,22,44,0.92)'; ctx.fill();
    text(toast.text, W / 2, H - 50, 14, '#fff', 'center', 700); ctx.globalAlpha = 1;
  }
  canvasCursor();
  requestAnimationFrame(frame);
}
function canvasCursor() {
  const over = buttons.some(b => mouse.x >= b.x && mouse.x <= b.x + b.w && mouse.y >= b.y && mouse.y <= b.y + b.h);
  cv.style.cursor = over ? 'pointer' : 'default';
}

// ---------------- input ----------------
function hit(x, y) {
  for (let i = buttons.length - 1; i >= 0; i--) { const b = buttons[i]; if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b; }
  return null;
}
cv.addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
cv.addEventListener('pointerleave', () => { mouse.x = mouse.y = -1; });
cv.addEventListener('pointerdown', e => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  const b = hit(e.clientX, e.clientY);
  if (b) { e.preventDefault(); b.onClick(); }
  else if (scene === 'play') { try { inputEl.focus({ preventScroll: true }); } catch (er) {} }
});
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); if (!e.repeat) submitAnswer(); }
  if (e.key === 'Escape') { inputEl.blur(); }
});
addEventListener('keydown', e => {
  if (e.target === inputEl || e.repeat) return;
  if (e.key === 'Enter' || e.key === ' ') {
    if (scene === 'reveal') { e.preventDefault(); nextPrompt(); }
    else if (scene === 'play') { e.preventDefault(); inputEl.focus(); }
    else if (scene === 'title' && overlay === 'howto') { overlay = null; }
    else if (scene === 'title' && !save.days[dayNumber()]) { sfxClick(); newGame('daily'); }
  } else if (e.key === 'Escape') {
    if (overlay) overlay = null; else if (scene === 'packs') scene = 'title';
  } else if (scene === 'play' && e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
    inputEl.focus(); // typed while unfocused: steer the keystroke into the box
  }
});

resize();
requestAnimationFrame(frame);
</script>
